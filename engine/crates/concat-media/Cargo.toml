[package]
name = "concat-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Getting pixels and samples in and out of media files. The only crate that knows FFmpeg exists."

[dependencies]
concat-core.workspace = true
# Linked FFmpeg: the safe wrapper over libavformat, libavcodec, libavfilter,
# libswscale and libswresample. Built against the FFmpeg development
# libraries on the machine - pkg-config where there is one, FFMPEG_DIR
# pointing at an unpacked shared build otherwise. FFmpeg 7 or newer: the
# display-rotation side data is read from where 7.0 moved it.
ffmpeg-the-third = "6"
libc = "0.2"
thiserror.workspace = true

[lints]
workspace = true
