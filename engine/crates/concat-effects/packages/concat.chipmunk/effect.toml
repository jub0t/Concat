[effect]
id = "concat.chipmunk"
name = "Chipmunk"
kind = "filter"
category = "Voice"
order = 12
intensity = "pitch"
aliases = ["chipmunk"]
description = "Higher and squeakier."

[[param]]
key = "pitch"
label = "Pitch"
min = 3
max = 12
default = 7
step = 0.5
unit = "st"

[ffmpeg]
let = [
  "ratio = pow(2, pitch / 12)",
]
chain = "aresample=48000,asetrate={fixed(48000 * ratio, 6)},aresample=48000,atempo={fixed(1 / ratio, 8)},highpass=f=120,alimiter=limit=0.94"
