[effect]
id = "concat.echo"
name = "Echo"
kind = "filter"
category = "Space"
order = 30
intensity = "decay"
aliases = ["echo"]
description = "One repeat, fading."

[[param]]
key = "delay"
label = "Delay"
min = 0.05
max = 1
default = 0.25
step = 0.05
unit = "s"

[[param]]
key = "decay"
label = "Decay"
min = 0.1
max = 0.9
default = 0.4
step = 0.05

[ffmpeg]
chain = "aecho=0.8:0.85:{round(delay * 1000)}:{fixed(decay, 2)}"
