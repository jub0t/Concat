[effect]
id = "concat.vivid"
name = "Vivid"
kind = "filter"
category = "Everyday"
order = 11
intensity = "colour"
description = "Colour that sings and contrast that bites, with a little edge: the look that reads as a better camera. Skin is held back from the boost."

[[param]]
key = "colour"
label = "Colour"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "punch"
label = "Punch"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
chain = "eq=contrast={fixed(1 + punch / 100 * 0.35, 3)},vibrance=intensity={fixed(colour / 100 * 1.4, 3)},unsharp=5:5:{fixed(punch / 100 * 0.7, 3)}"

[wgsl]
entry = "effect.wgsl"
