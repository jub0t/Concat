[effect]
id = "concat.teal-orange"
name = "Teal & Orange"
kind = "filter"
category = "Cinematic"
order = 22
intensity = "amount"
description = "Teal in the shadows, orange in the highlights, skin left as skin: the blockbuster grade."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[[param]]
key = "skin"
label = "Protect skin"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[ffmpeg]
chain = "colorbalance=rs={fixed(0 - amount / 100 * 0.12, 3)}:gs={fixed(amount / 100 * 0.04, 3)}:bs={fixed(amount / 100 * 0.16, 3)}:rh={fixed(amount / 100 * 0.16, 3)}:gh={fixed(amount / 100 * 0.04, 3)}:bh={fixed(0 - amount / 100 * 0.12, 3)},eq=contrast={fixed(1 + contrast / 100 * 0.4, 3)}"

[wgsl]
entry = "effect.wgsl"
