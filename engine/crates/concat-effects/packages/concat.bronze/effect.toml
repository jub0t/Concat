[effect]
id = "concat.bronze"
name = "Bronze"
kind = "filter"
category = "Retro"
order = 31
intensity = "tone"
description = "Sepia that keeps its contrast, so it reads as old film rather than a brown wash."

[[param]]
key = "tone"
label = "Tone"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[ffmpeg]
chain = "hue=s={fixed(1 - tone / 100 * 0.9, 3)},colorbalance=rm={fixed(tone / 100 * 0.12, 3)}:gm={fixed(tone / 100 * 0.04, 3)}:bm={fixed(0 - tone / 100 * 0.12, 3)},eq=contrast={fixed(1 + contrast / 100 * 0.3, 3)}"

[wgsl]
entry = "effect.wgsl"
