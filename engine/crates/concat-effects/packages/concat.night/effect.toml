[effect]
id = "concat.night"
name = "Night"
kind = "filter"
category = "Cinematic"
order = 23
intensity = "lift"
description = "Low light opened up: shadows lifted, the darks softened so the noise does not come up with them, the blue kept."

[[param]]
key = "lift"
label = "Lift"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "clarity"
label = "Clarity"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[ffmpeg]
chain = "curves=all='0/{fixed(lift / 100 * 0.06, 3)} 0.25/{fixed(0.25 + lift / 100 * 0.15, 3)} 0.5/{fixed(0.5 + lift / 100 * 0.1, 3)} 1/1',hqdn3d={fixed(clarity / 100 * 6, 2)}"

[wgsl]
entry = "effect.wgsl"
