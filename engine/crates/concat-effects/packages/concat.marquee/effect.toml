[effect]
id = "concat.marquee"
name = "Marquee"
kind = "filter"
category = "Stylised"
order = 52
intensity = "lights"
description = "Night city: the lights and signs made vivid and blooming, blacks kept deep and cool, faces left clean. Made for the strip."

[[param]]
key = "lights"
label = "Lights"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[ffmpeg]
chain = "curves=all='0/0 0.2/{fixed(0.2 - depth / 100 * 0.08, 3)} 1/1',colorbalance=bs={fixed(depth / 100 * 0.1, 3)},eq=saturation={fixed(1 + lights / 100 * 0.35, 3)},split[marqa{index}][marqb{index}];[marqb{index}]gblur=sigma=8[marqg{index}];[marqa{index}][marqg{index}]blend=all_mode=screen:all_opacity={fixed(lights / 100 * 0.3, 3)}"

[wgsl]
entry = "effect.wgsl"
