[effect]
id = "concat.cloudless-sky"
name = "Cloudless Sky"
kind = "filter"
category = "Everyday"
order = 15
intensity = "sky"
description = "Blues deeper and richer, greens cooled, everything else left alone. Travel footage."

[[param]]
key = "sky"
label = "Sky"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "greens"
label = "Greens"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[ffmpeg]
chain = "selectivecolor=blues='{fixed(sky / 100 * 0.4, 3)} 0 {fixed(0 - sky / 100 * 0.3, 3)} {fixed(sky / 100 * 0.15, 3)}':greens='{fixed(greens / 100 * 0.2, 3)} 0 {fixed(0 - greens / 100 * 0.2, 3)} 0',eq=saturation={fixed(1 + sky / 100 * 0.1, 3)}"

[wgsl]
entry = "effect.wgsl"
