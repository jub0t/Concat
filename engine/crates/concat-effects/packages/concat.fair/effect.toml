[effect]
id = "concat.fair"
name = "Fair"
kind = "filter"
category = "Portrait"
order = 21
intensity = "brighten"
description = "Faces brightened and evened: skin lifted, reds calmed, the balance neutral, the rest of the frame left where it was."

[[param]]
key = "brighten"
label = "Brighten"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "even"
label = "Even"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
chain = "selectivecolor=reds='0 {fixed(0 - even / 100 * 0.1, 3)} 0 {fixed(0 - brighten / 100 * 0.15, 3)}':yellows='0 0 {fixed(0 - even / 100 * 0.05, 3)} {fixed(0 - brighten / 100 * 0.1, 3)}',curves=all='0/0 0.5/{fixed(0.5 + brighten / 100 * 0.03, 3)} 1/1'"

[wgsl]
entry = "effect.wgsl"
