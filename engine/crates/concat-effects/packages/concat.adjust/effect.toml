[effect]
id = "concat.adjust"
name = "Adjust"
kind = "filter"
category = "Adjust"
order = 0
intensity = "exposure"
description = "The manual colour panel every picture clip carries: exposure, tone, balance, sharpness and edge."

# Three groups, in the order the panel lists them. Colour: temperature in
# kelvin with 6500 the picture as shot, tint green to magenta, saturation
# as a signed percent. Lightness: exposure in stops, then brightness,
# contrast, highlights and shadows as signed percents, the last two lifting
# or crushing their end of the curve. Effects: sharpen, fade and vignette
# add from zero.

[[param]]
key = "temperature"
group = "Color"
label = "Temperature"
min = 2000
max = 11000
default = 6500
step = 50
unit = "K"

[[param]]
key = "tint"
group = "Color"
label = "Tint"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "saturation"
group = "Color"
label = "Saturation"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "exposure"
group = "Lightness"
label = "Exposure"
min = -3
max = 3
default = 0
step = 0.05
unit = "EV"

[[param]]
key = "brightness"
group = "Lightness"
label = "Brightness"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "contrast"
group = "Lightness"
label = "Contrast"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "highlights"
group = "Lightness"
label = "Highlights"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "shadows"
group = "Lightness"
label = "Shadows"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "sharpen"
group = "Effects"
label = "Sharpen"
min = 0
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "fade"
group = "Effects"
label = "Fade"
min = 0
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "vignette"
group = "Effects"
label = "Vignette"
min = 0
max = 100
default = 0
step = 1
unit = "%"

[ffmpeg]
let = [
  "lift = fade / 100 * 0.25",
  "low = clamp(0.25 + shadows / 100 * 0.18, 0.05, 0.45)",
  "high = clamp(0.75 + highlights / 100 * 0.18, 0.55, 0.95)",
]
chain = "exposure=exposure={fixed(exposure, 2)},eq=brightness={fixed(brightness / 100 * 0.5, 3)}:contrast={fixed(1 + contrast / 100, 3)}:saturation={fixed(1 + saturation / 100 * 2, 3)},colortemperature=temperature={round(temperature)},colorbalance=gm={fixed(0 - tint / 100 * 0.5, 3)},curves=all='0/{fixed(lift, 3)} 0.25/{fixed(low, 3)} 0.75/{fixed(high, 3)} 1/1',unsharp=5:5:{fixed(sharpen / 100 * 2, 2)},vignette=a={fixed(vignette / 100 * 1.2, 3)}"

[wgsl]
entry = "effect.wgsl"
