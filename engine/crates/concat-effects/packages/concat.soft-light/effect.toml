[effect]
id = "concat.soft-light"
name = "Soft Light"
kind = "filter"
category = "Everyday"
order = 13
intensity = "lift"
description = "Lifted blacks, low contrast, cream in the highlights: airy and flattering."

[[param]]
key = "lift"
label = "Lift"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[ffmpeg]
chain = "curves=all='0/{fixed(lift / 100 * 0.12, 3)} 1/1',eq=contrast={fixed(1 - lift / 100 * 0.2, 3)}:saturation={fixed(1 - lift / 100 * 0.15, 3)},colorbalance=rh={fixed(warmth / 100 * 0.08, 3)}:bh={fixed(0 - warmth / 100 * 0.06, 3)}"

[wgsl]
entry = "effect.wgsl"
