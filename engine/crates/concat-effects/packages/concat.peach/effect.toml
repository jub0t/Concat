[effect]
id = "concat.peach"
name = "Peach"
kind = "filter"
category = "Portrait"
order = 20
intensity = "glow"
description = "Skin warmed toward peach and softened, shadows lifted so lines ease, contrast low. Portraits and talking heads; it is meant to run at half strength."

[[param]]
key = "glow"
label = "Glow"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "softness"
label = "Softness"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[ffmpeg]
chain = "selectivecolor=reds='0 {fixed(0 - glow / 100 * 0.08, 3)} {fixed(glow / 100 * 0.1, 3)} {fixed(0 - glow / 100 * 0.1, 3)}':yellows='0 {fixed(glow / 100 * 0.05, 3)} 0 {fixed(0 - glow / 100 * 0.06, 3)}',curves=all='0/{fixed(glow / 100 * 0.06, 3)} 1/1',eq=contrast={fixed(1 - glow / 100 * 0.1, 3)},colorbalance=rh={fixed(glow / 100 * 0.05, 3)}:gh={fixed(glow / 100 * 0.02, 3)},split[peacha{index}][peachb{index}];[peachb{index}]gblur=sigma=6[peachg{index}];[peacha{index}][peachg{index}]blend=all_mode=screen:all_opacity={fixed(softness / 100 * 0.25, 3)}"

[wgsl]
entry = "effect.wgsl"
