[effect]
id = "concat.moody"
name = "Moody"
kind = "filter"
category = "Cinematic"
order = 31
intensity = "depth"
description = "Blacks crushed by a film toe, colour drained, bronze through the middle, cool in the shadows, the corners closing in."

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
chain = "curves=all='0/0 0.15/{fixed(0.15 - depth / 100 * 0.07, 3)} 0.5/{fixed(0.5 - depth / 100 * 0.05, 3)} 1/1',eq=saturation={fixed(1 - depth / 100 * 0.4, 3)},colorbalance=rm={fixed(warmth / 100 * 0.1, 3)}:gm={fixed(warmth / 100 * 0.03, 3)}:bm={fixed(0 - warmth / 100 * 0.08, 3)}:bs={fixed(depth / 100 * 0.06, 3)},vignette=a={fixed(depth / 100 * 0.9, 3)}"

[wgsl]
entry = "effect.wgsl"
