[effect]
id = "concat.matcha"
name = "Matcha"
kind = "filter"
category = "Stylised"
order = 53
intensity = "amount"
description = "Soft green through the midtones and whites, colour muted, a light matte. The trend look, gentle enough for a face."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "curves=all='0/{fixed(amount / 100 * 0.06, 3)} 1/{fixed(1 - amount / 100 * 0.03, 3)}',eq=saturation={fixed(1 - amount / 100 * 0.25, 3)},colorbalance=gm={fixed(amount / 100 * 0.08, 3)}:rm={fixed(0 - amount / 100 * 0.03, 3)}:gh={fixed(amount / 100 * 0.06, 3)}:bh={fixed(0 - amount / 100 * 0.03, 3)}"

[wgsl]
entry = "effect.wgsl"
