[package]
name = "concat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Concat, the editor window: the Slint front end that drives the engine."

# The product's name is the binary's name, unsuffixed: `concat` is what a
# user launches, and the concat-* crates are what it is made of. The window
# itself is the library, so that the binary here and the Android activity
# in concat-android are each a few lines over the same code.
[lib]
path = "src/lib.rs"

[[bin]]
name = "concat"
path = "src/main.rs"

# Slint is taken under its GPL-3.0-only option to sit beside the AGPL engine.
# See ../../../THIRD_PARTY_NOTICES.md for why those two combine legally.
#
# default-features is off because `renderer-femtovg` (the OpenGL path) is a
# default. Enabling both compiles glutin and the whole GL renderer for
# nothing: i-slint-backend-winit picks wgpu over GL in
# default_renderer_factory, and cfg's the GL path out of the fallback list
# entirely. The rest of this list is slint's default set, reproduced verbatim
# minus that one renderer.
#
# 1.17, not 1.14: renderer-femtovg-wgpu does not exist in 1.14.
#
# Three platforms, three feature sets. The desktop and iOS draw through the
# winit backend, iOS without the system tray; Android draws through Slint's
# android-activity backend, which owns the window and the renderer itself
# (see platform.rs). The renderer and wgpu features are the same on all
# three, chosen by the `skia`/`wgpu` features below.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
    # The custom title bar: platform.rs needs the winit window to hide the
    # native title bar (macOS traffic-light overlay) and to start window
    # drags from the strip's drag region.
    "unstable-winit-030",
    # The renderer draws on a wgpu device the window creates and shares with
    # the engine's compositor, so a monitor frame is a texture Slint shows
    # as it is - see gpu.rs.
    "unstable-wgpu-29",
] }
# Native file and folder dialogs, which Slint deliberately does not have.
rfd = "0.17"
# Reveal an exported file in the platform's file manager.
opener = { version = "0.8", features = ["reveal"] }

[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "unstable-winit-030",
    "unstable-wgpu-29",
] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-android-activity-06",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "unstable-wgpu-29",
] }

[dependencies]
# The one device: created in gpu.rs, handed to Slint and to the monitor.
wgpu.workspace = true
pollster.workspace = true

# The engine, through the host layer. `gpu` turns on the wgpu compositor for
# the monitor and the export; the CPU compositor stays as the fallback.
concat-core.workspace = true
concat-media.workspace = true
concat-project.workspace = true
concat-export.workspace = true
concat-host = { workspace = true, features = ["gpu"] }
concat-speech.workspace = true
# The effect catalogue: the inspector's shelves and each link's knobs.
concat-effects.workspace = true

# Remembered preferences, as a small JSON file in the config directory.
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# Text presets are TOML files, as the effect manifests are.
toml = "1.1"

# The renderer is picked by a feature here rather than by editing the
# dependency, so both variants build from one tree and can be compared:
#
#   cargo build --release -p concat                                       # skia
#   cargo build --release -p concat --no-default-features --features wgpu # femtovg/wgpu
#
# Skia is the default. It has partial rendering machinery that FemtoVG lacks
# entirely - but Surface's use_partial_rendering() defaults to false and is
# overridden only by software_surface.rs, so it is OFF on Metal/D3D/Vulkan/GL.
# Measure before believing any CPU or power claim about it; the reason it is
# the default here is that its text rendering is gamma-correct, not that it is
# known to be cheaper.
#
# Theme.weight-body/weight-title are 400/500 to match. FemtoVG composites
# glyph coverage without gamma correction, which 500/600 compensates for, so
# use those if you build --features wgpu, or the text will be too light there.
#
# FemtoVG over wgpu rather than over OpenGL: same renderer, native graphics
# API underneath - Metal on macOS, D3D12 on Windows, Vulkan on Linux -
# instead of OpenGL, which Apple deprecated and now emulates on top of Metal
# anyway. Still pure Rust, so cross-compiling needs nothing beyond
# `rustup target add`.
[features]
default = ["skia"]
wgpu = ["slint/renderer-femtovg-wgpu"]
skia = ["slint/renderer-skia"]

[build-dependencies]
slint-build = "1.17"

[lints]
workspace = true
