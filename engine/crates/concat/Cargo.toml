[package]
name = "concat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Concat, the editor window: the Slint front end that drives the Concat engine."

# The product's name is the binary's name, unsuffixed: `concat` is what a
# user launches, and the concat-* crates are what it is made of.
[[bin]]
name = "concat"
path = "src/main.rs"

[dependencies]
# Slint is taken under its GPL-3.0-only option to sit beside the AGPL engine.
# See ../../../THIRD_PARTY_NOTICES.md for why those two combine legally.
#
# default-features is off because `renderer-femtovg` (the OpenGL path) is a
# default. Enabling both compiles glutin and the whole GL renderer for
# nothing: i-slint-backend-winit picks wgpu over GL in
# default_renderer_factory, and cfg's the GL path out of the fallback list
# entirely. The rest of this list is slint's default set, reproduced verbatim
# minus that one renderer.
#
# 1.17, not 1.14: renderer-femtovg-wgpu does not exist in 1.14.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
    # The custom title bar: main.rs needs the winit window to hide the native
    # title bar (macOS traffic-light overlay) and to start window drags from
    # the strip's drag region.
    "unstable-winit-030",
] }

# The engine. What Settings > About reports about it comes from here; the
# rest of the wiring is the work in progress.
concat-media.workspace = true

# The renderer is picked by a feature here rather than by editing the
# dependency, so both variants build from one tree and can be compared:
#
#   cargo build --release -p concat                                       # skia
#   cargo build --release -p concat --no-default-features --features wgpu # femtovg/wgpu
#
# Skia is the default. It has partial rendering machinery that FemtoVG lacks
# entirely - but Surface's use_partial_rendering() defaults to false and is
# overridden only by software_surface.rs, so it is OFF on Metal/D3D/Vulkan/GL.
# Measure before believing any CPU or power claim about it; the reason it is
# the default here is that its text rendering is gamma-correct, not that it is
# known to be cheaper.
#
# Theme.weight-body/weight-title are 400/500 to match: the 500/600 they used to
# carry compensated for FemtoVG compositing glyph coverage without gamma
# correction. Put them back if you build --features wgpu, or the text will be
# too light there.
#
# FemtoVG over wgpu rather than over OpenGL: same renderer, native graphics
# API underneath - Metal on macOS, D3D12 on Windows, Vulkan on Linux -
# instead of OpenGL, which Apple deprecated and now emulates on top of Metal
# anyway. Still pure Rust, so cross-compiling needs nothing beyond
# `rustup target add`.
[features]
default = ["skia"]
wgpu = ["slint/renderer-femtovg-wgpu"]
skia = ["slint/renderer-skia"]

[build-dependencies]
slint-build = "1.17"

[lints]
workspace = true
