[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"  # + plugin exception, see LICENSE-EXCEPTIONS.md

[workspace.dependencies]
wolfcut-core = { path = "crates/wolfcut-core" }
wolfcut-media = { path = "crates/wolfcut-media" }
wolfcut-render = { path = "crates/wolfcut-render" }
wolfcut-export = { path = "crates/wolfcut-export" }

serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

# The GPU compositor, behind wolfcut-render's `gpu` feature. A heavy tree, which
# is exactly why it is optional: engine-only work never pays for it.
wgpu = "30"
pollster = "0.4"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# Cleverness is the enemy of a codebase you maintain alone.
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Decoding and compositing are unusably slow in an unoptimised build, even when
# the rest of the engine is being debugged.
[profile.dev.package."*"]
opt-level = 2
