# The models Concat downloads, and where they come from.
#
# Concat ships no weights inside its bundles - a cutout network, a Kokoro
# voice bank and a whisper model together outweigh the editor many times
# over, and most people never ask for all three. They are fetched the first
# time a feature needs one.
#
# What they are fetched *from* is this file. Every model is mirrored onto a
# release of this repository, under the `release` tag below, and that mirror
# is what the app asks for; `upstream` is where the mirror was filled from
# and what the app falls back to if our own release cannot be reached. The
# point of the mirror is that a model Concat offers stays reachable, stays
# the bytes we tested, and stays under one roof, rather than depending on a
# third party's bucket keeping a path alive.
#
#   scripts/models.py --check          # this table against the engine's
#   scripts/models.py mirror --out dir # fill a mirror from upstream
#   scripts/models.py release-manifest # the manifest.json a release carries
#
# Refreshing the mirror is .github/workflows/models.yml: it fetches every
# `upstream`, checks each against `sha256`, records the digest when this
# table has none yet, and uploads the lot to the `release` tag. Bump that
# tag only when a model's bytes change - app releases point at it by name,
# so an unchanged model is never re-uploaded.
#
# `sha256` is what the app verifies a finished download against, and a
# download with no digest to check is refused, so a model added here is
# unusable until its digest is: the workflow prints what it computed, and
# that goes here and into the engine's table beside it. Hugging Face
# upstreams are pinned to a commit rather than `main`, so the bytes the
# fallback fetches are the bytes the digest names.

# The release every model is mirrored on.
release = "models-v1"

