[package]
name = "concat-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Concat for AI agents: an MCP server over HTTP with Server-Sent Events (SSE) whose tools are the Concat API's methods, with schemas generated from its request types. stdio transport removed; Android only."

[features]
default = []
# Android LocalSocket support for connecting to the window's server.
local-socket = ["concat-server/local-socket", "dep:socket2", "dep:libc"]
# HTTP + SSE transport. Required on Android; off elsewhere.
http = [
  "dep:tokio",
  "dep:hyper",
  "dep:bytes",
  "dep:futures-util",
  "dep:hyper-util",
  "dep:tokio-stream",
]

[dependencies]
# The one source of editing semantics. `schema` gives each request and each
# edit command its JSON Schema, which is what a tool's arguments are.
concat-api = { workspace = true, features = ["schema"] }
# The window's server, reached as a client, and the file that says where
# it is.
concat-server = { workspace = true, features = [] }
serde_json.workspace = true
# For Android LocalSocket support
socket2 = { version = "0.5", optional = true }
libc = { version = "0.2", optional = true }

# HTTP + SSE transport (behind the `http` feature).
tokio = { version = "1", optional = true }
hyper = { version = "1", optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
hyper-util = { version = "0.1", optional = true }
tokio-stream = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
