[package]
name = "concat-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Turning a timeline plus a timestamp into one finished frame."

[features]
# The wgpu compositor is the only one now, so it is always built; the
# feature is kept so the crates that name it need not change.
gpu = []

[dependencies]
concat-core.workspace = true
log = "0.4"
wgpu.workspace = true
pollster.workspace = true
# The working space's half floats, written and read back as numbers where
# an effect's probes check them.
half = "2"

[dev-dependencies]
# The pass test compiles a real package shader through the catalogue's
# stitching, so what the test runs is what a package would run.
concat-effects.workspace = true

[lints]
workspace = true
