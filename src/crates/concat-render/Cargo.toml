[package]
name = "concat-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Turning a timeline plus a timestamp into one finished frame."

[features]
# The wgpu compositor is the only one now, so it is always built; the
# feature is kept so the crates that name it need not change.
gpu = []

[dependencies]
concat-core.workspace = true
log = "0.4"
wgpu.workspace = true
pollster.workspace = true
# The working space's half floats, written and read back as numbers where
# an effect's probes check them.
half = "2"
# Memory figures in the log say sizes as every other line does.
concat-log.workspace = true

# The memory figures wgpu's budget gates read, asked of each API directly
# (see memory.rs): the crates and versions wgpu-hal already builds with,
# so nothing new is compiled or licensed.
[target.'cfg(any(windows, target_os = "linux", target_os = "android"))'.dependencies]
ash = "0.38"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice"] }

[dev-dependencies]
# The pass test compiles a real package shader through the catalogue's
# stitching, so what the test runs is what a package would run.
concat-effects.workspace = true
# The upscaler's answer is held to the network's plain CPU reference.
concat-vision.workspace = true

[lints]
workspace = true
