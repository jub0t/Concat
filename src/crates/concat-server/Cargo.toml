[package]
name = "concat-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Concat API served on a socket: JSON-RPC lines over TCP or a Unix socket. One dispatcher, any number of callers."

[dependencies]
concat-api.workspace = true
serde_json.workspace = true
# The listing a local MCP adapter reads to find the window's server.
serde = { version = "1", features = ["derive"] }
# A token minted when none was given: 128 bits the operating system
# hands out, so the server is never open to whoever reaches the socket.
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
