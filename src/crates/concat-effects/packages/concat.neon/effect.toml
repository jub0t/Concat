format = 2

[effect]
id = "concat.neon"
name = "Neon"
kind = "filter"
category = "Stylised"
order = 51
intensity = "glow"
description = "Magenta in the shadows, cyan in the highlights, hard contrast, colour turned up, and the lights themselves blooming. Night streets and signage."

[[param]]
key = "glow"
label = "Glow"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "punch"
label = "Punch"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
