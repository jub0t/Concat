[effect]
id = "concat.fog"
name = "Fog"
kind = "effect"
category = "Atmosphere"
order = 86
intensity = "amount"
description = "A soft haze settles over the picture, blacks lifted and colour thinned."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
chain = "eq=saturation={fixed(1 - amount / 100 * 0.5, 3)}:contrast={fixed(1 - amount / 100 * 0.2, 3)},curves=all='0/{fixed(amount / 100 * 0.15, 3)} 1/{fixed(1 - amount / 100 * 0.05, 3)}'"

[wgsl]
entry = "effect.wgsl"
