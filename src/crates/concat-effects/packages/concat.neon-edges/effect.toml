[effect]
id = "concat.neon-edges"
name = "Neon Edges"
kind = "effect"
category = "Stylize"
order = 83
intensity = "amount"
description = "The picture's edges traced in drifting neon colour over black."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[ffmpeg]
let = [
  "high = 0.6 - amount / 100 * 0.3",
  "low = high * 0.35",
]
chain = "edgedetect=mode=colormix:low={fixed(low, 3)}:high={fixed(high, 3)},eq=saturation={fixed(1 + amount / 100 * 0.8, 3)}"

[wgsl]
entry = "effect.wgsl"
