format = 2

[effect]
id = "concat.cool-blue"
name = "Cool Blue"
kind = "filter"
category = "Cinematic"
order = 32
intensity = "chill"
description = "Blue in the shadows and midtones, highlights and skin left neutral, contrast up. Cities at dusk."

[[param]]
key = "chill"
label = "Chill"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
