format = 2

[effect]
id = "concat.teal-orange"
name = "Teal & Orange"
kind = "filter"
category = "Cinematic"
order = 30
intensity = "amount"
description = "Teal in the shadows, orange in the highlights, skin held as skin, a film curve over it. The blockbuster grade, and the most requested look there is."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "contrast"
label = "Contrast"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[[param]]
key = "skin"
label = "Protect skin"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
