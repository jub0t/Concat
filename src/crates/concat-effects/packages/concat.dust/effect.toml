[effect]
id = "concat.dust"
name = "Dust"
kind = "effect"
category = "Atmosphere"
order = 87
intensity = "amount"
description = "Fine specks of dust flicker over the picture, frame to frame."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
chain = "noise=alls={round(amount / 100 * 15)}:allf=t+u,eq=contrast={fixed(1 - amount / 100 * 0.05, 3)}"

[wgsl]
entry = "effect.wgsl"

# A card is small; it shows the dust at its thickest.
[card]
params = { amount = 100 }
