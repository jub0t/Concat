[effect]
id = "concat.snow"
name = "Snow"
kind = "effect"
category = "Atmosphere"
order = 85
intensity = "density"
description = "Flakes of snow drift down over the picture."

[[param]]
key = "density"
label = "Density"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.2
max = 3
default = 1
step = 0.1

[ffmpeg]
chain = "noise=alls={round(density / 100 * 30)}:allf=t,eq=brightness={fixed(density / 100 * 0.03, 3)}"

[wgsl]
entry = "effect.wgsl"

# A card is small; it shows the snow at its thickest.
[card]
params = { density = 100 }
