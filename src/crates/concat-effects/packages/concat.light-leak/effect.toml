[effect]
id = "concat.light-leak"
name = "Light Leak"
kind = "effect"
category = "Light"
order = 70
intensity = "amount"
description = "A warm streak of light drifts across the picture."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "colorbalance=rh={fixed(amount / 100 * 0.35, 3)}:gh={fixed(amount / 100 * 0.12, 3)}:bh={fixed(0 - amount / 100 * 0.25, 3)},eq=brightness={fixed(amount / 100 * 0.06, 3)}"

[wgsl]
entry = "effect.wgsl"
