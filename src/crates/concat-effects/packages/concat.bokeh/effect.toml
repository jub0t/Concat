[effect]
id = "concat.bokeh"
name = "Bokeh"
kind = "effect"
category = "Light"
order = 73
intensity = "amount"
description = "Soft out-of-focus circles of light drift over the picture."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "split[bka{index}][bkb{index}];[bkb{index}]gblur=sigma=6[bkg{index}];[bka{index}][bkg{index}]blend=all_mode=screen:all_opacity={fixed(amount / 200, 3)}"

[wgsl]
entry = "effect.wgsl"
