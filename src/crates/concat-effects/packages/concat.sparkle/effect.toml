[effect]
id = "concat.sparkle"
name = "Sparkle"
kind = "effect"
category = "Light & Shadow"
order = 3
intensity = "amount"
description = "Kira Kira starburst glints on luminance highlights with shimmer."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "threshold"
label = "Threshold"
min = 50
max = 95
default = 75
step = 1
unit = "%"

[ffmpeg]
let = [
  "a = fixed(amount / 100 * 0.8, 3)",
]
chain = "split[spka{index}][spkb{index}];[spkb{index}]gblur=sigma=8[spkg{index}];[spka{index}][spkg{index}]blend=all_mode=screen:all_opacity={a}"

[wgsl]
entry = "effect.wgsl"

# The reference picture's brightest wall sits just under the default
# threshold; the card lowers it so the glints show.
[card]
params = { threshold = 55 }
