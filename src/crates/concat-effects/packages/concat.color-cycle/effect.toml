[effect]
id = "concat.color-cycle"
name = "Color Cycle"
kind = "effect"
category = "Party & Club"
order = 17
intensity = "speed"
description = "Smooth temporal hue rotation across the entire spectrum."

[[param]]
key = "speed"
label = "Speed"
min = 1
max = 100
default = 30
step = 1
unit = "°/s"

[ffmpeg]
let = [
  "s = fixed(speed, 1)",
]
chain = "hue=h=t*{s}"

[wgsl]
entry = "effect.wgsl"
