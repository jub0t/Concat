[effect]
id = "concat.prism-dispersion"
name = "Prism Dispersion"
kind = "effect"
category = "Optical & Lens"
order = 12
intensity = "strength"
description = "Radial chromatic dispersion refracting RGB channels."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
let = [
  "s = round(strength * 0.3)",
]
chain = "rgbashift=rh={s}:bv={s}"

[wgsl]
entry = "effect.wgsl"
