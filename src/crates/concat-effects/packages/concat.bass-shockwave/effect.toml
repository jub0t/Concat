[effect]
id = "concat.bass-shockwave"
name = "Bass Shockwave"
kind = "effect"
category = "Party & Club"
order = 14
intensity = "strength"
description = "Radial ripple expansion pulsing with beat intensity."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 1
max = 10
default = 3
step = 1
unit = "Hz"

[ffmpeg]
let = [
  "b = fixed(strength / 100 * 0.3, 3)",
]
chain = "eq=brightness={b}"

[wgsl]
entry = "effect.wgsl"
