[effect]
id = "concat.bulge-pinch"
name = "Bulge / Pinch"
kind = "effect"
category = "Distort"
order = 79
intensity = "amount"
description = "The centre of the picture bulges outward, or pinches inward below zero."

[[param]]
key = "amount"
label = "Amount"
min = -100
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
let = [
  "k = fixed(amount / 100 * 0.4, 3)",
]
chain = "geq=r='r(W/2+(X-W/2)*(1+{k}*(1-min(hypot(X-W/2,Y-H/2)/(W/2),1))),H/2+(Y-H/2)*(1+{k}*(1-min(hypot(X-W/2,Y-H/2)/(W/2),1))))':g='g(W/2+(X-W/2)*(1+{k}*(1-min(hypot(X-W/2,Y-H/2)/(W/2),1))),H/2+(Y-H/2)*(1+{k}*(1-min(hypot(X-W/2,Y-H/2)/(W/2),1))))':b='b(W/2+(X-W/2)*(1+{k}*(1-min(hypot(X-W/2,Y-H/2)/(W/2),1))),H/2+(Y-H/2)*(1+{k}*(1-min(hypot(X-W/2,Y-H/2)/(W/2),1))))'"

[wgsl]
entry = "effect.wgsl"
