[effect]
id = "concat.cloudless-sky"
name = "Cloudless Sky"
kind = "filter"
category = "Everyday"
order = 15
intensity = "sky"
description = "Skies deeper and bluer, foliage cooler and calmer, the rest of the picture and every face untouched. Travel footage."

[[param]]
key = "sky"
label = "Sky"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "greens"
label = "Greens"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[ffmpeg]
chain = "selectivecolor=blues='{fixed(sky / 100 * 0.35, 3)} 0 {fixed(0 - sky / 100 * 0.25, 3)} {fixed(sky / 100 * 0.12, 3)}':cyans='{fixed(sky / 100 * 0.2, 3)} 0 {fixed(0 - sky / 100 * 0.15, 3)} 0':greens='{fixed(greens / 100 * 0.25, 3)} 0 {fixed(0 - greens / 100 * 0.25, 3)} 0'"

[wgsl]
entry = "effect.wgsl"
