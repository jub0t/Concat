format = 2

[effect]
id = "concat.fresh"
name = "Fresh"
kind = "filter"
category = "Everyday"
order = 10
intensity = "pop"
description = "Daylight footage made to pop: midtones lifted, colour brought up where it is muted, a breath of mint in the brightest whites, skin left alone."

[[param]]
key = "pop"
label = "Pop"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "brightness"
label = "Brightness"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
