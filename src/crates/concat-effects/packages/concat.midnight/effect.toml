format = 2

[effect]
id = "concat.midnight"
name = "Midnight"
kind = "filter"
category = "Cinematic"
order = 37
intensity = "depth"
description = "Deep blacks, a cool cast over everything but the lamps, colour low, a little grain. Late-night desk and monologue footage."

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
