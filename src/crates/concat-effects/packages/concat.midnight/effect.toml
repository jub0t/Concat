[effect]
id = "concat.midnight"
name = "Midnight"
kind = "filter"
category = "Cinematic"
order = 37
intensity = "depth"
description = "Deep blacks, a cool cast over everything but the lamps, colour low, a little grain. Late-night desk and monologue footage."

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[ffmpeg]
chain = "curves=all='0/0 0.2/{fixed(0.2 - depth / 100 * 0.1, 3)} 1/1',eq=saturation={fixed(1 - depth / 100 * 0.35, 3)},colorbalance=bs={fixed(depth / 100 * 0.12, 3)}:bm={fixed(depth / 100 * 0.08, 3)}:rs={fixed(0 - depth / 100 * 0.05, 3)},noise=alls={round(grain / 100 * 20)}:allf=t"

[wgsl]
entry = "effect.wgsl"
