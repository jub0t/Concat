format = 2

[effect]
id = "concat.glitch"
name = "Glitch"
kind = "effect"
category = "Glitch"
shelves = ["Featured"]
order = 1
intensity = "amount"
description = "A broken signal: blocks of the picture jump sideways, lines tear, colours slip apart and scan lines show."

[[param]]
key = "amount"
label = "Amount"
unit = "%"
min = 0
max = 100
step = 1
default = 60

[[param]]
key = "speed"
label = "Speed"
unit = "/s"
min = 1
max = 30
step = 1
default = 10

[[param]]
key = "split"
label = "Colour Split"
unit = "%"
min = 0
max = 100
step = 1
default = 50

[wgsl]
entry = "effect.wgsl"
