format = 2

[effect]
id = "concat.film"
name = "Film"
kind = "filter"
category = "Cinematic"
order = 34
intensity = "grain"
description = "A film curve with a real toe and shoulder, warm halation around the lights, and grain that moves. Print stock, not a filter."

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
