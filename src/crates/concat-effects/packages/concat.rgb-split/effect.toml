[effect]
id = "concat.rgb-split"
name = "RGB Split"
kind = "effect"
category = "Retro"
order = 74
intensity = "shift"
description = "The colour channels pulled apart into a bold stylised fringe."

[[param]]
key = "shift"
label = "Shift"
type = "int"
min = 1
max = 40
default = 10
step = 1
unit = "px"

[ffmpeg]
chain = "rgbashift=rh={round(shift)}:bh=-{round(shift)}"

[wgsl]
entry = "effect.wgsl"
