# Pinned from the GPU's own rendering of one flat colour; see each name.

[[probe]]
name = "default"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.6
expect = [0.050079, 0.15027, 0.40063, 1]

[[probe]]
name = "least"
at = "min"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.6
expect = [0.049988, 0.15002, 0.3999, 1]

[[probe]]
name = "most"
at = "max"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.6
expect = [0.05014, 0.15051, 0.40112, 1]
