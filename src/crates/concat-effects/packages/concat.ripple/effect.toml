format = 2

[effect]
id = "concat.ripple"
name = "Ripple"
kind = "transition"
category = "Distort"
order = 20
description = "Rings run out from the middle as if a stone hit water, and the next shot spreads out behind them."

[[param]]
key = "strength"
label = "Strength"
unit = "%"
min = 0
max = 100
step = 1
default = 60

[transition]
entry = "effect.wgsl"
xfade = "circleopen"
fallback = "cross-fade"
