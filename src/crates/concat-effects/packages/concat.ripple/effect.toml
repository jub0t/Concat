[effect]
id = "concat.ripple"
name = "Ripple"
kind = "effect"
category = "Distort"
order = 77
intensity = "amount"
description = "Rings of water ripple outward from the centre of the picture."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.5
max = 6
default = 3
step = 0.1

[ffmpeg]
let = [
  "amp = fixed(amount / 100 * 8, 2)",
  "spd = fixed(speed, 2)",
]
chain = "geq=r='r(X+{amp}*sin(Y/10+T*{spd}),Y+{amp}*sin(X/10+T*{spd}))':g='g(X+{amp}*sin(Y/10+T*{spd}),Y+{amp}*sin(X/10+T*{spd}))':b='b(X+{amp}*sin(Y/10+T*{spd}),Y+{amp}*sin(X/10+T*{spd}))'"

[wgsl]
entry = "effect.wgsl"
