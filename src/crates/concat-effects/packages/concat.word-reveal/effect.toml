[effect]
id = "concat.word-reveal"
name = "Word Reveal"
kind = "effect"
category = "Text"
order = 97
description = "A title's words appear one at a time as progress rises, in reading order."

[[param]]
key = "style"
label = "Style"
type = "enum"
min = 0
max = 2
default = 0
values = [0, 1, 2]
labels = ["Fade", "Blur", "Typewriter"]

[[param]]
key = "progress"
label = "Progress"
min = 0
max = 100
default = 100
step = 1
unit = "%"

[[param]]
key = "softness"
label = "Softness"
min = 0
max = 100
default = 20
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
