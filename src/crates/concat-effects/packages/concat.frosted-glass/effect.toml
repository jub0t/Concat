[effect]
id = "concat.frosted-glass"
name = "Frosted Glass"
kind = "effect"
category = "Text"
order = 93
intensity = "blur"
description = "A soft blurred halo spreads just outside the picture's edge, the shape itself kept sharp."

[[param]]
key = "blur"
label = "Blur"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "spread"
label = "Spread"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
chain = "gblur=sigma={fixed(0.3 + blur / 100 * 2.5, 2)}"

[wgsl]
entry = "effect.wgsl"
