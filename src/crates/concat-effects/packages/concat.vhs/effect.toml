format = 2

[effect]
id = "concat.vhs"
name = "VHS"
kind = "filter"
category = "Retro"
order = 44
intensity = "bleed"
description = "Colour bleeding sideways, scan lines, softness, tape noise and too much saturation, with the slight vertical smear of a worn head."

[[param]]
key = "bleed"
label = "Bleed"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "lines"
label = "Lines"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
