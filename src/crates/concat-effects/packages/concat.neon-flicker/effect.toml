[effect]
id = "concat.neon-flicker"
name = "Neon Flicker"
kind = "effect"
category = "Text"
order = 95
intensity = "rate"
description = "The picture flickers on and off like an unreliable neon sign."

[[param]]
key = "rate"
label = "Rate"
min = 0.5
max = 15
default = 4
step = 0.1
unit = "Hz"

[[param]]
key = "min_opacity"
label = "Minimum"
min = 0
max = 100
default = 15
step = 1
unit = "%"

[ffmpeg]
chain = "eq=brightness=0.03:saturation={fixed(1 + min_opacity / 100 * 0.3, 3)}"

[wgsl]
entry = "effect.wgsl"
