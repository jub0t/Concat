[effect]
id = "concat.neon-glow"
name = "Neon Glow"
kind = "effect"
category = "Party & Club"
order = 16
intensity = "glow"
description = "Vibrant edge-detection luminescence with electric hue cycling."

[[param]]
key = "glow"
label = "Glow"
min = 0
max = 100
default = 75
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.5
max = 8
default = 2
step = 0.5
unit = "Hz"

[ffmpeg]
let = [
  "s = fixed(1 + glow / 100 * 2.0, 2)",
]
chain = "eq=saturation={s}"

[wgsl]
entry = "effect.wgsl"
