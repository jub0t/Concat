# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. Pinned from the format 1 shader, so the look is what it was,
# but for its hue turn, which no longer shifts a colour it does not turn.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.35059, 0.23145, 0.14905, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.45, 0.4, 0.35, 1]
expect = [0.44946, 0.39941, 0.34961, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.08, 0.07, 0.06, 1]
expect = [0.11188, 0.1012, 0.09058, 1]
