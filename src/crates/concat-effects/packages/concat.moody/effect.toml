format = 2

[effect]
id = "concat.moody"
name = "Moody"
kind = "filter"
category = "Cinematic"
order = 31
intensity = "depth"
description = "Blacks crushed by a film toe, colour drained, bronze through the middle, cool in the shadows, the corners closing in."

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
