# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. Pinned from the format 1 shader, so the look is what it was.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.30005, 0.19995, 0.12, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.45, 0.4, 0.35, 1]
expect = [0.18945, 0.18945, 0.18945, 1]

# Every knob up is far past white, where format 1 clipped it: the panel's
# exposure scales the display encoding, +3 EV eight times over, until its
# maths moves into light with the colour sliders (phase 2, step 5).
[[probe]]
name = "maximum"
at = "max"
input = [0.08, 0.07, 0.06, 1]
expect = [40.8125, 31.71875, 122.25, 1]
