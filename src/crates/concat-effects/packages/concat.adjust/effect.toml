format = 2

[effect]
id = "concat.adjust"
name = "Adjust"
kind = "filter"
category = "Adjust"
order = 0
intensity = "exposure"
description = "The manual colour panel every picture clip carries: exposure, tone, balance, sharpness and edge."

# Three groups, in the order the panel lists them. Colour: temperature in
# kelvin with 6500 the picture as shot, tint green to magenta, saturation
# as a signed percent. Lightness: exposure in stops, then brightness,
# contrast, highlights, shadows, whites and blacks as signed percents; the
# last four lift or crush their end of the curve, highlights and shadows
# the broad upper and lower halves, whites and blacks the narrow extremes.
# Effects: sharpen, fade and vignette add from zero.

[[param]]
key = "temperature"
group = "Color"
label = "Temperature"
min = 2000
max = 11000
default = 6500
step = 50
unit = "K"

[[param]]
key = "tint"
group = "Color"
label = "Tint"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "saturation"
group = "Color"
label = "Saturation"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[[param]]
key = "exposure"
group = "Lightness"
label = "Exposure"
min = -3
max = 3
default = 0
step = 0.05
unit = "EV"

[[param]]
key = "brightness"
group = "Lightness"
label = "Brightness"
min = -100
max = 100
default = 0
step = 1
unit = "%"

[[param]]
