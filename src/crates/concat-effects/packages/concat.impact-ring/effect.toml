[effect]
id = "concat.impact-ring"
name = "Impact Ring"
kind = "effect"
category = "Text"
order = 94
description = "A ring pulses outward from the centre once per loop, a stamp-like entrance flourish."

[[param]]
key = "period"
label = "Period"
min = 0.3
max = 5
default = 1.5
step = 0.1
unit = "s"

[ffmpeg]
chain = "eq=contrast=1.12:brightness=0.03"

[wgsl]
entry = "effect.wgsl"
