[effect]
id = "concat.crt-scanlines"
name = "CRT Scanlines"
kind = "effect"
category = "Retro & Film"
order = 6
intensity = "curvature"
description = "Retro CRT scanlines and barrel screen curvature."

[[param]]
key = "curvature"
label = "Curvature"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[[param]]
key = "scanlines"
label = "Scanlines"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
let = [
  "k = fixed(-0.25 * curvature / 100, 3)",
]
chain = "lenscorrection=k1={k}:k2={k}:i=bilinear"

[wgsl]
entry = "effect.wgsl"
