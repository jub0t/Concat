[effect]
id = "concat.camcorder-90s"
name = "90s Camcorder"
kind = "effect"
category = "Retro & Film"
order = 8
intensity = "noise"
description = "Vintage VHS/camcorder on-screen display with tracking noise."

[[param]]
key = "noise"
label = "Noise"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "lines"
label = "Lines"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[ffmpeg]
let = [
  "n = fixed(noise * 0.25, 1)",
]
chain = "noise=alls={n}:allf=t"

[wgsl]
entry = "effect.wgsl"
