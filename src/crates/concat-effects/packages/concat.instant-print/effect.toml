format = 2

[effect]
id = "concat.polaroid"
name = "Polaroid"
kind = "filter"
category = "Retro"
order = 41
intensity = "fade"
description = "The instant print: a cream matte, warm highlights, cyan creeping into the shadows, a little softness in the corners."

[[param]]
key = "fade"
label = "Fade"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
