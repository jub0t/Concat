[effect]
id = "concat.wave-warp"
name = "Wave Warp"
kind = "effect"
category = "Distortion & Glitch"
order = 10
intensity = "amplitude"
description = "Liquid sinusoidal horizontal and vertical ripple warping."

[[param]]
key = "amplitude"
label = "Amplitude"
min = 0
max = 50
default = 20
step = 1
unit = "px"

[[param]]
key = "wavelength"
label = "Wavelength"
min = 5
max = 100
default = 30
step = 1
unit = "px"

[[param]]
key = "speed"
label = "Speed"
min = 0.5
max = 10
default = 2
step = 0.5
unit = "Hz"

[ffmpeg]
let = [
  "amp = fixed(amplitude / 50 * 10, 2)",
  "spd = fixed(speed, 2)",
]
chain = "geq=r='r(X+{amp}*sin(Y/15+T*{spd}),Y+{amp}*cos(X/15+T*{spd}))':g='g(X+{amp}*sin(Y/15+T*{spd}),Y+{amp}*cos(X/15+T*{spd}))':b='b(X+{amp}*sin(Y/15+T*{spd}),Y+{amp}*cos(X/15+T*{spd}))'"

[wgsl]
entry = "effect.wgsl"
