[effect]
id = "concat.kaleidoscope"
name = "Kaleidoscope"
kind = "effect"
category = "Distort"
order = 80
intensity = "segments"
description = "The picture folded into repeating mirrored wedges around its centre."

[[param]]
key = "segments"
label = "Segments"
type = "int"
min = 3
max = 12
default = 6
step = 1

[ffmpeg]
chain = "eq=saturation={fixed(1 + segments / 12 * 0.3, 3)}"

[wgsl]
entry = "effect.wgsl"
