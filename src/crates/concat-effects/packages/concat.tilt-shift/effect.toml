[effect]
id = "concat.tilt-shift"
name = "Tilt Shift"
kind = "effect"
category = "Optical & Lens"
order = 4
intensity = "blur"
description = "Miniature horizontal focus band with progressive blur and saturation."

[[param]]
key = "blur"
label = "Blur"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "position"
label = "Position"
min = 10
max = 90
default = 50
step = 1
unit = "%"

[ffmpeg]
let = [
  "b = fixed(blur * 0.2, 1)",
]
chain = "gblur=sigma={b},eq=saturation=1.2"

[wgsl]
entry = "effect.wgsl"
