format = 2

[effect]
id = "concat.lagoon"
name = "Lagoon"
kind = "filter"
category = "Everyday"
order = 16
intensity = "water"
description = "Water and sky turned aquamarine and brightened, sand and skin left warm and clean. The beach-day look creators reach for first."

[[param]]
key = "water"
label = "Water"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "brightness"
label = "Brightness"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
