[effect]
id = "concat.duotone"
name = "Duotone"
kind = "effect"
category = "Stylize"
order = 82
intensity = "amount"
description = "The picture's tones remapped between a shadow colour and a highlight colour."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 100
step = 1
unit = "%"

[ffmpeg]
chain = "eq=saturation={fixed(1 - amount / 100 * 0.7, 3)},colorbalance=rs={fixed(0 - amount / 100 * 0.05, 3)}:bs={fixed(amount / 100 * 0.12, 3)}:rh={fixed(amount / 100 * 0.1, 3)}:bh={fixed(0 - amount / 100 * 0.08, 3)}"

[wgsl]
entry = "effect.wgsl"
