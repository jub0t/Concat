[effect]
id = "concat.shine-sweep"
name = "Shine Sweep"
kind = "effect"
category = "Text"
order = 90
intensity = "speed"
description = "A specular band sweeps diagonally across the picture on a loop."

[[param]]
key = "speed"
label = "Speed"
min = 0.1
max = 3
default = 1
step = 0.1

[[param]]
key = "width"
label = "Width"
min = 1
max = 100
default = 30
step = 1
unit = "%"

[[param]]
key = "angle"
label = "Angle"
min = -90
max = 90
default = 25
step = 1
unit = "°"

[ffmpeg]
chain = "eq=contrast={fixed(1 + width / 100 * 0.15, 3)}:brightness={fixed(width / 100 * 0.03, 3)}"

[wgsl]
entry = "effect.wgsl"
