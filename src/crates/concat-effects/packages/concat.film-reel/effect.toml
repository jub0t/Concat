[effect]
id = "concat.film-reel"
name = "Film Reel"
kind = "effect"
category = "Retro & Film"
order = 7
intensity = "grain"
description = "Vintage countdown leader with film grain and gate weave."

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "weave"
label = "Weave"
min = 0
max = 50
default = 10
step = 1
unit = "px"

[ffmpeg]
let = [
  "g = fixed(grain * 0.3, 1)",
]
chain = "noise=alls={g}:allf=t+u"

[wgsl]
entry = "effect.wgsl"
