[effect]
id = "concat.green-screen"
name = "Green Screen"
kind = "effect"
category = "Cutout"
order = 60
intensity = "similarity"
description = "Keys the green out, leaving the picture over whatever is beneath."

[[param]]
key = "similarity"
label = "Similarity"
min = 1
max = 60
default = 25
step = 1
unit = "%"

[[param]]
key = "softness"
label = "Softness"
min = 0
max = 50
default = 10
step = 1
unit = "%"

[ffmpeg]
chain = "chromakey=color=0x00FF00:similarity={fixed(similarity / 100, 3)}:blend={fixed(softness / 100, 3)}"

[wgsl]
entry = "effect.wgsl"

# The reference picture has no screen; the card stands it before a
# broadcast one, which the key takes out from a similarity of about 40 -
# its default, 25, keys only a purer colour.
[card]
screen = "#00b140"
params = { similarity = 42 }
