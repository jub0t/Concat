[effect]
id = "concat.hologram"
name = "Hologram"
kind = "effect"
category = "Stylize"
order = 48
intensity = "glow"
aliases = ["hologram"]
description = "The picture as a sci-fi projection: its hue thrown away for a blue ramp, edges glowing, scan lines drifting, a refresh sweep, tears and grain."

[[param]]
key = "glow"
label = "Edge glow"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[[param]]
key = "scanlines"
label = "Scanlines"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[[param]]
key = "split"
label = "RGB split"
min = 0
max = 100
default = 35
step = 1
unit = "%"

[[param]]
key = "glitch"
label = "Tear"
min = 0
max = 100
default = 25
step = 1
unit = "%"

[[param]]
key = "grain"
label = "Grain"
min = 0
max = 100
default = 15
step = 1
unit = "%"

[[param]]
key = "hue"
label = "Tint"
min = -180
max = 180
default = 0
step = 1
unit = "°"

[ffmpeg]
let = [
  "shift = round(split / 100 * 8)",
]
chain = "hue=s=0,split[holoa{index}][holob{index}];[holob{index}]edgedetect=low=0.1:high=0.3,format=rgb24,lutrgb=r=val*0.5:g=val*0.91:b=val[holoe{index}];[holoa{index}]curves=r='0/0.009 0.6/0.14 1/0.78':g='0/0.08 0.6/0.57 1/1':b='0/0.14 0.6/0.83 1/1'[holor{index}];[holor{index}][holoe{index}]blend=all_mode=addition:all_opacity={fixed(glow / 100, 2)},hue=h={round(hue)},rgbashift=rh={round(0 - shift)}:bh={shift},drawgrid=x=-1:w=iw+2:h=4:t=1:c=black@{fixed(scanlines / 100 * 0.55, 2)},noise=alls={round(grain / 100 * 40)}:allf=t,vignette=angle=0.55"

[wgsl]
entry = "effect.wgsl"
