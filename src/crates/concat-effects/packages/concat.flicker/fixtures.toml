# Pinned from the GPU's own rendering of one flat colour; see each name.

[[probe]]
name = "default"
input = [0.18, 0.18, 0.18, 1]
expect = [0.16138, 0.16138, 0.16138, 1]

[[probe]]
name = "least"
at = "min"
input = [0.8, 0.5, 0.3, 1]
expect = [0.7998, 0.5, 0.30005, 1]

[[probe]]
name = "most"
at = "max"
input = [0.05, 0.15, 0.4, 1]
expect = [0.041016, 0.12305, 0.32812, 1]
