format = 2

[effect]
id = "concat.flash"
name = "Flash"
kind = "effect"
category = "Flash"
shelves = ["Featured", "Light"]
order = 1
intensity = "amount"
description = "One burst of light when the clip or layer starts, fading back to the picture. Drop it on the beat."

[[param]]
key = "amount"
label = "Brightness"
unit = "%"
min = 0
max = 100
step = 1
default = 85

[[param]]
key = "length"
label = "Length"
unit = "s"
min = 0.05
max = 2
step = 0.05
default = 0.4

[[param]]
key = "colour"
label = "Colour"
type = "color"
min = 0
max = 4294967295
default = 4294967295

[wgsl]
entry = "effect.wgsl"

[card]
moment = 0.08
