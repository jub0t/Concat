format = 2

[effect]
id = "concat.push"
name = "Push"
kind = "transition"
category = "Slide"
order = 5
description = "The incoming shot pushes the outgoing one off the frame."

[[param]]
key = "direction"
label = "Direction"
type = "enum"
min = 0
max = 3
default = 0
values = [0, 1, 2, 3]
labels = ["Left", "Right", "Up", "Down"]

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
