format = 2

[effect]
id = "concat.push"
name = "Push"
kind = "transition"
category = "Slide"
order = 5
aliases = ["push"]
description = "The next shot shoves the last one out of frame, both moving as one, with a streak of motion blur at full speed."

[[param]]
key = "direction"
label = "Direction"
type = "enum"
values = [0, 1, 2, 3]
labels = ["Left", "Right", "Up", "Down"]
default = 0
min = 0
max = 3

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"
