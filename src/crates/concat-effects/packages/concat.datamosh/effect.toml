[effect]
id = "concat.datamosh"
name = "Datamosh"
kind = "effect"
category = "Retro"
order = 75
intensity = "amount"
description = "Blocks of the picture tear sideways, flickering like a broken codec."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "chromashift=crh={round(amount / 100 * 6)}:cbh=-{round(amount / 100 * 6)},noise=alls={round(amount / 100 * 20)}:allf=t"

[wgsl]
entry = "effect.wgsl"
