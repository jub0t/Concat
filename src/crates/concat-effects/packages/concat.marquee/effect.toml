format = 2

[effect]
id = "concat.marquee"
name = "Marquee"
kind = "filter"
category = "Stylised"
order = 52
intensity = "lights"
description = "Night city: the lights and signs made vivid and blooming, blacks kept deep and cool, faces left clean. Made for the strip."

[[param]]
key = "lights"
label = "Lights"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "depth"
label = "Depth"
min = 0
max = 100
default = 40
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
