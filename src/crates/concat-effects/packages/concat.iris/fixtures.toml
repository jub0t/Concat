# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. A cut from one colour to another, and its middle pixel.

[[probe]]
name = "default"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.37
expect = [0.04999, 0.15002, 0.3999, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.37
expect = [0.04999, 0.15002, 0.3999, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.37
# The led edge: the band is off the picture at both ends, so the widest
# softness blends by where the edge has reached at 0.37 rather than
# straddling the centre; see effect.wgsl.
expect = [0.50879, 0.36426, 0.33887, 1]
