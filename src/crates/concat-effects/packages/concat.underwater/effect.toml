[effect]
id = "concat.underwater"
name = "Underwater"
kind = "audio"
category = "Space"
order = 34
intensity = "depth"
aliases = ["submerged"]
description = "Submerged beneath the surface with heavy low-pass filtering."

[[param]]
key = "depth"
label = "Depth"
min = 1
max = 10
default = 5
step = 0.5

[ffmpeg]
chain = "lowpass=f={fixed(800 - depth * 40, 1)},equalizer=f=200:t=q:w=2.0:g={fixed(2 + depth * 0.3, 2)},alimiter=limit=0.92"
