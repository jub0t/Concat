format = 2

[effect]
id = "concat.bloom-pulse"
name = "Bloom Pulse"
kind = "effect"
category = "Light"
order = 72
version = 2
intensity = "amount"
description = "A soft bloom over the highlights that breathes in and out."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.5
max = 5
default = 2
step = 0.1

[wgsl]
entry = "effect.wgsl"

# The bloom is the highlights' light spread by a Gaussian, drawn across and
# then down at a quarter of the layer's pixels, three of which it is wide.
[[wgsl.pass]]
target = "across"
shrink = ["4", "1"]

[[wgsl.pass]]
target = "down"
shrink = ["4", "4"]
