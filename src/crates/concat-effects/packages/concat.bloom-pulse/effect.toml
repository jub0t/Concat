[effect]
id = "concat.bloom-pulse"
name = "Bloom Pulse"
kind = "effect"
category = "Light"
order = 72
intensity = "amount"
description = "A soft bloom over the highlights that breathes in and out."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.5
max = 5
default = 2
step = 0.1

[ffmpeg]
chain = "split[blma{index}][blmb{index}];[blmb{index}]gblur=sigma=14[blmg{index}];[blma{index}][blmg{index}]blend=all_mode=screen:all_opacity={fixed(amount / 100, 3)}"

[wgsl]
entry = "effect.wgsl"
