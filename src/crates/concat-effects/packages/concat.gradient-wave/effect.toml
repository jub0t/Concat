[effect]
id = "concat.gradient-wave"
name = "Gradient Wave"
kind = "effect"
category = "Text"
order = 92
intensity = "hue"
description = "A two-colour gradient rolls across the picture, its palette turned by hue."

[[param]]
key = "hue"
label = "Hue"
min = 0
max = 360
default = 200
step = 1
unit = "°"

[[param]]
key = "speed"
label = "Speed"
min = 0.1
max = 3
default = 1
step = 0.1

[ffmpeg]
chain = "hue=h={round(hue)},colorbalance=rh=0.04:bh=0.06"

[wgsl]
entry = "effect.wgsl"
