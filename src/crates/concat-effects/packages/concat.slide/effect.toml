format = 2

[effect]
id = "concat.slide"
name = "Slide"
kind = "transition"
category = "Slide"
order = 4
description = "The next shot glides in over the last one and settles, casting a soft shadow on the shot it covers."

[[param]]
key = "direction"
label = "Direction"
type = "enum"
values = [0, 1, 2, 3]
labels = ["Left", "Right", "Up", "Down"]
default = 0
min = 0
max = 3

[transition]
fallback = "cross-fade"
entry = "effect.wgsl"
