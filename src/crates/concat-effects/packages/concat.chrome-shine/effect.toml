[effect]
id = "concat.chrome-shine"
name = "Chrome Shine"
kind = "effect"
category = "Text"
order = 91
intensity = "tint"
description = "A metallic gradient rolls slowly across the picture, dark to bright to dark."

[[param]]
key = "tint"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 0.1
max = 3
default = 1
step = 0.1

[ffmpeg]
chain = "eq=saturation={fixed(1 - tint / 100 * 0.3, 3)}:contrast=1.15"

[wgsl]
entry = "effect.wgsl"
