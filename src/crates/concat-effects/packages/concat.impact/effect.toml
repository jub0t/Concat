format = 2

[effect]
id = "concat.impact"
name = "Impact"
kind = "effect"
category = "Shake"
order = 5
intensity = "amount"
description = "One hard hit when the clip or layer starts: the frame jolts, punches in and rings out. Drop it on the beat."

[[param]]
key = "amount"
label = "Amount"
unit = "%"
min = 0
max = 100
step = 1
default = 60

[[param]]
key = "length"
label = "Length"
unit = "s"
min = 0.1
max = 2
step = 0.05
default = 0.45

[[param]]
key = "punch"
label = "Zoom Punch"
unit = "%"
min = 0
max = 100
step = 1
default = 40

[[param]]
key = "direction"
label = "Direction"
type = "enum"
values = [0, 1, 2]
labels = ["Any", "Sideways", "Up and Down"]
default = 0
min = 0
max = 2

[[param]]
key = "blur"
label = "Motion Blur"
unit = "%"
min = 0
max = 100
step = 1
default = 60

[wgsl]
entry = "effect.wgsl"

[card]
moment = 0.06
