# Pinned from the GPU's own rendering of one flat colour; see each name.

[[probe]]
name = "default, at a hit"
input = [0.18, 0.18, 0.18, 1]
expect = [0.3728, 0.3728, 0.3728, 1]

[[probe]]
name = "least"
at = "min"
input = [0.8, 0.5, 0.3, 1]
expect = [0.7998, 0.5, 0.30005, 1]

[[probe]]
name = "most"
at = "max"
input = [0.05, 0.15, 0.4, 1]
expect = [0.14136, 0.42432, 1.1309, 1]
