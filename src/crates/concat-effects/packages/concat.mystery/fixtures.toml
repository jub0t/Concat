# Colours in the working space: linear light, 1.0 the white of an SDR
# picture, read at the middle pixel at the timeline's start.
# No mark falls on the middle then, so it shows the picture dimmed behind
# the marks; with nothing of the effect kept it is the picture as it was.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.12396, 0.09796, 0.07654, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.45, 0.4, 0.35, 1]
expect = [0.45, 0.4, 0.35, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.08, 0.07, 0.06, 1]
expect = [0.03259, 0.03345, 0.03528, 1]
