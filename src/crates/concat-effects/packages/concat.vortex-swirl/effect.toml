[effect]
id = "concat.vortex-swirl"
name = "Vortex Swirl"
kind = "effect"
category = "Distortion & Glitch"
order = 11
intensity = "angle"
description = "Rotational vortex twist around a focal point."

[[param]]
key = "angle"
label = "Angle"
min = -180
max = 180
default = 90
step = 1
unit = "°"

[[param]]
key = "radius"
label = "Radius"
min = 10
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
let = [
  "s = fixed(0.5 + abs(angle) / 180 * 2.0, 2)",
]
chain = "gblur=sigma={s}"

[wgsl]
entry = "effect.wgsl"
