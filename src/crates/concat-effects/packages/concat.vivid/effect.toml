format = 2

[effect]
id = "concat.vivid"
name = "Vivid"
kind = "filter"
category = "Everyday"
order = 11
intensity = "colour"
description = "Colour that sings and contrast that bites, with a little edge: the look that reads as a better camera. Skin is held back from the boost."

[[param]]
key = "colour"
label = "Colour"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "punch"
label = "Punch"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
