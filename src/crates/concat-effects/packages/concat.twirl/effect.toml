[effect]
id = "concat.twirl"
name = "Twirl"
kind = "effect"
category = "Distort"
order = 78
intensity = "amount"
description = "The picture twisted around its centre like a whirlpool."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
chain = "gblur=sigma={fixed(0.3 + amount / 100 * 1.2, 2)}"

[wgsl]
entry = "effect.wgsl"
