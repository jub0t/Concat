[effect]
id = "concat.oil-paint"
name = "Oil Paint"
kind = "effect"
category = "Stylize"
order = 81
intensity = "amount"
description = "The picture simplified into soft, posterised brush-like strokes."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
let = [
  "r = round(1 + amount / 100 * 4)",
]
chain = "boxblur={r}:1,eq=contrast={fixed(1 + amount / 100 * 0.25, 3)}:saturation={fixed(1 + amount / 100 * 0.15, 3)}"

[wgsl]
entry = "effect.wgsl"
