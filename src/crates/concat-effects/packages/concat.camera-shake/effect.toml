[effect]
id = "concat.camera-shake"
name = "Camera Shake"
kind = "effect"
category = "Featured"
order = 1
intensity = "amplitude"
description = "Handheld 2D harmonic camera jitter with organic drift."

[[param]]
key = "amplitude"
label = "Amplitude"
type = "int"
min = 1
max = 50
default = 15
step = 1
unit = "px"

[[param]]
key = "speed"
label = "Speed"
min = 2
max = 30
default = 10
step = 1
unit = "Hz"

[[param]]
key = "rotation"
label = "Rotation"
min = 0
max = 10
default = 2
step = 1
unit = "°"

[ffmpeg]
let = [
  "a = round(amplitude)",
  "s = round(speed)",
  "s2 = round(s * 1.3)",
]
chain = "crop=iw-{2 * a}:ih-{2 * a}:{a}+{a}*sin(t*{s}):{a}+{a}*cos(t*{s2})"

[wgsl]
entry = "effect.wgsl"
