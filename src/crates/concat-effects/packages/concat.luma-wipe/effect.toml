format = 2

[effect]
id = "concat.luma-wipe"
name = "Luma Wipe"
kind = "transition"
category = "Wipe"
order = 20
description = "The next shot shows through the last one's brightest parts first and spreads into the shadows, or the other way round."

[[param]]
key = "order"
label = "Order"
type = "enum"
values = [0, 1]
labels = ["Bright First", "Dark First"]
default = 0
min = 0
max = 1

[[param]]
key = "softness"
label = "Softness"
unit = "%"
min = 0
max = 100
step = 1
default = 30

[transition]
entry = "effect.wgsl"
fallback = "cross-fade"
