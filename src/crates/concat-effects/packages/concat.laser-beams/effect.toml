[effect]
id = "concat.laser-beams"
name = "Laser Beams"
kind = "effect"
category = "Party & Club"
order = 15
intensity = "strength"
description = "Glowing vector light streaks crossing the frame."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[[param]]
key = "speed"
label = "Speed"
min = 1
max = 12
default = 4
step = 1
unit = "Hz"

[ffmpeg]
let = [
  "g = fixed(strength / 100 * 0.4, 3)",
]
chain = "colorbalance=gh={g}:bh={g}"

[wgsl]
entry = "effect.wgsl"
