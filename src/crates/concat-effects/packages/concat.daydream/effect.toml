format = 2

[effect]
id = "concat.daydream"
name = "Daydream"
kind = "filter"
category = "Cinematic"
order = 35
intensity = "haze"
description = "Soft cinema: blacks lifted, the light blooming warm, shadows a touch cool, skin kept. The look of a story told in a window seat."

[[param]]
key = "haze"
label = "Haze"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "warmth"
label = "Warmth"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[wgsl]
entry = "effect.wgsl"
space = "display"
