# Lift, gamma and gain on the display level: masters down darken, masters
# up brighten, a puck pushes its end of the picture towards its hue, and
# gamma leaves white where it is and carries a level past it on.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.3, 0.2, 0.12, 1]

[[probe]]
name = "minimum, every master down"
at = "min"
input = [0.3, 0.2, 0.12, 1]
expect = [0.00257149, 0.000335419, 7.21473e-06, 1]

[[probe]]
name = "maximum, every master up"
at = "max"
input = [0.3, 0.2, 0.12, 1]
expect = [4.05487, 3.77131, 3.47967, 1]

[[probe]]
name = "the lift towards red, at the top"
params = { "lift.y" = 1 }
input = [0.02, 0.02, 0.02, 1]
expect = [0.108882, 0.00918199, 0.00918199, 1]

[[probe]]
name = "the gain towards blue"
params = { "gain.x" = -0.866025, "gain.y" = -0.5 }
input = [0.5, 0.5, 0.5, 1]
expect = [0.468661, 0.468661, 1.1487, 1]

[[probe]]
name = "gamma up, white kept and past white carried"
params = { "gamma.m" = 0.5 }
input = [4.0, 1.0, 0.18, 1]
expect = [4.0, 1.0, 0.297439, 1]
