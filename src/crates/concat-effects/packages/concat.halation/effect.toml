[effect]
id = "concat.halation"
name = "Halation"
kind = "effect"
category = "Retro & Film"
order = 9
intensity = "amount"
description = "Warm red/orange glow bleeding around high-contrast edges."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[[param]]
key = "radius"
label = "Radius"
min = 2
max = 30
default = 12
step = 1
unit = "px"

[ffmpeg]
let = [
  "a = fixed(amount / 100 * 0.4, 3)",
  "r = round(radius)",
]
chain = "split[hla{index}][hlb{index}];[hlb{index}]gblur=sigma={r},colorbalance=rh=0.3:gh=0.05:bh=-0.2[hlg{index}];[hla{index}][hlg{index}]blend=all_mode=screen:all_opacity={a}"

[wgsl]
entry = "effect.wgsl"

# The reference picture has few highlights; the card shows the glow at
# its strongest.
[card]
params = { amount = 100 }
