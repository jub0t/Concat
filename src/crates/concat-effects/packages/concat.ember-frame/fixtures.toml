# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. The embers keep to the frame's edges and the corners are cut
# outside the middle, so the middle pixel comes through untouched.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.3, 0.2, 0.12, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.45, 0.4, 0.35, 1]
expect = [0.45, 0.4, 0.35, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.08, 0.07, 0.06, 1]
expect = [0.08, 0.07, 0.06, 1]
