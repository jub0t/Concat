# Pinned from the GPU's own rendering of one flat colour; see each name.

[[probe]]
name = "default, a flash on"
input = [0.18, 0.18, 0.18, 1]
expect = [0.91797, 0.91797, 0.91797, 1]

[[probe]]
name = "weakest"
at = "min"
input = [0.8, 0.5, 0.3, 1]
expect = [0.7998, 0.5, 0.30005, 1]

[[probe]]
name = "strongest"
at = "max"
input = [0.05, 0.15, 0.4, 1]
expect = [1, 1, 1, 1]
