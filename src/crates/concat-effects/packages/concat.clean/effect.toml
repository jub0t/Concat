[effect]
id = "concat.clean"
name = "Clean"
kind = "filter"
category = "Everyday"
order = 12
intensity = "amount"
description = "Barely there: neutral, a gentle curve, a touch more colour, and the reds calmed so a face reads even. What a talking head wants."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[ffmpeg]
chain = "eq=contrast={fixed(1 + amount / 100 * 0.14, 3)}:saturation={fixed(1 + amount / 100 * 0.1, 3)},selectivecolor=reds='0 {fixed(0 - amount / 100 * 0.06, 3)} 0 0'"

[wgsl]
entry = "effect.wgsl"
