# A flat picture's glow is the picture itself, screened over it by the
# amount in the display encoding: a grey is lifted by a share of what lies
# between it and white, and a level past white stays where it was.

[[probe]]
name = "default, a grey"
input = [0.18, 0.18, 0.18, 1]
expect = [0.29569, 0.29569, 0.29569, 1]

[[probe]]
name = "default, an orange"
input = [0.8, 0.3, 0.05, 1]
expect = [0.87887, 0.44406, 0.097502, 1]

[[probe]]
name = "default, a highlight past white"
input = [4.0, 1.0, 0.05, 1]
expect = [4.0, 1.0, 0.097502, 1]

[[probe]]
name = "minimum, a grey"
at = "min"
input = [0.18, 0.18, 0.18, 1]
expect = [0.20285, 0.20285, 0.20285, 1]

[[probe]]
name = "maximum, a grey"
at = "max"
input = [0.18, 0.18, 0.18, 1]
expect = [0.4844, 0.4844, 0.4844, 1]

[[probe]]
name = "maximum, a highlight past white"
at = "max"
input = [4.0, 1.0, 0.05, 1]
expect = [4.0, 1.0, 0.18196, 1]
