[effect]
id = "concat.rgb-glitch"
name = "RGB Glitch"
kind = "effect"
category = "Distortion & Glitch"
order = 2
intensity = "amount"
description = "Periodic horizontal slice displacement with chromatic aberration."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 50
step = 1
unit = "%"

[[param]]
key = "frequency"
label = "Frequency"
min = 1
max = 30
default = 8
step = 1
unit = "Hz"

[ffmpeg]
let = [
  "s = round(amount * 0.2)",
]
chain = "rgbashift=rh={s}:bv=-{s}"

[wgsl]
entry = "effect.wgsl"
