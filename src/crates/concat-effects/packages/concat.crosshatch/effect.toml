[effect]
id = "concat.crosshatch"
name = "Crosshatch"
kind = "effect"
category = "Stylize"
order = 84
intensity = "amount"
description = "The dark parts of the picture built from crossed pen strokes."

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 60
step = 1
unit = "%"

[ffmpeg]
let = [
  "high = 0.5 - amount / 100 * 0.25",
  "low = high * 0.4",
]
chain = "edgedetect=mode=colormix:low={fixed(low, 3)}:high={fixed(high, 3)},hue=s=0,eq=contrast={fixed(1 + amount / 100 * 0.3, 3)}"

[wgsl]
entry = "effect.wgsl"
