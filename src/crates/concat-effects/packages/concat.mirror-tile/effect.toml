[effect]
id = "concat.mirror-tile"
name = "Mirror Tile"
kind = "effect"
category = "Distortion & Glitch"
order = 13
intensity = "tiles"
description = "Symmetrical 2x2 and 4x4 kaleidoscopic mirror reflections."

[[param]]
key = "tiles"
label = "Tiles"
min = 2
max = 4
default = 2
step = 2
unit = "x"

[ffmpeg]
let = [
  "s = fixed(1 + tiles / 4 * 0.2, 3)",
]
chain = "eq=saturation={s}"

[wgsl]
entry = "effect.wgsl"
