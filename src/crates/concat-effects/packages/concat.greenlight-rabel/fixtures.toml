# Colours in the working space: linear light, 1.0 the white of an SDR
# picture, read at the middle pixel at the timeline's start.
# The middle lies between the strips and out of the vignette's reach,
# tinted green and grained; with nothing of the effect kept it is the
# picture as it was.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.27466, 0.22571, 0.11322, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.45, 0.4, 0.35, 1]
expect = [0.45, 0.4, 0.35, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.08, 0.07, 0.06, 1]
expect = [0.07214, 0.08087, 0.05862, 1]
