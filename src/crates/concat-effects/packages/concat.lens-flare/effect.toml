[effect]
id = "concat.lens-flare"
name = "Lens Flare"
kind = "effect"
category = "Light"
order = 71
intensity = "amount"
description = "A bright hotspot with a string of echoes through the centre."

[[param]]
key = "posx"
label = "Position X"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[[param]]
key = "posy"
label = "Position Y"
min = 0
max = 100
default = 30
step = 1
unit = "%"

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 70
step = 1
unit = "%"

[ffmpeg]
chain = "eq=brightness={fixed(amount / 100 * 0.08, 3)}:contrast={fixed(1 + amount / 100 * 0.1, 3)}"

[wgsl]
entry = "effect.wgsl"
