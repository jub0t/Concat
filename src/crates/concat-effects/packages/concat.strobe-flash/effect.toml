[effect]
id = "concat.strobe-flash"
name = "Strobe Flash"
kind = "effect"
category = "Party & Club"
order = 5
intensity = "strength"
description = "High-energy pulsating stroboscopic flash."

[[param]]
key = "strength"
label = "Strength"
min = 0
max = 100
default = 80
step = 1
unit = "%"

[[param]]
key = "frequency"
label = "Frequency"
min = 2
max = 30
default = 10
step = 1
unit = "Hz"

[ffmpeg]
let = [
  "f = fixed(strength / 100 * 0.5, 3)",
]
chain = "eq=brightness={f}"

[wgsl]
entry = "effect.wgsl"
