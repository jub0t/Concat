[effect]
id = "concat.scroll-ticker"
name = "Scroll Ticker"
kind = "effect"
category = "Text"
order = 96
intensity = "speed"
description = "The picture scrolls sideways and wraps around, like a news ticker."

[[param]]
key = "speed"
label = "Speed"
min = 1
max = 100
default = 30
step = 1

[[param]]
key = "direction"
label = "Direction"
type = "enum"
min = 0
max = 1
default = 0
values = [0, 1]
labels = ["Left", "Right"]

[ffmpeg]
let = [
  "px = fixed(if(direction < 0.5, speed, 0 - speed) * 0.3, 2)",
]
chain = "format=rgba,geq=r='r(mod(X+T*{px}+W*1000,W),Y)':g='g(mod(X+T*{px}+W*1000,W),Y)':b='b(mod(X+T*{px}+W*1000,W),Y)':a='alpha(mod(X+T*{px}+W*1000,W),Y)'"

[wgsl]
entry = "effect.wgsl"
