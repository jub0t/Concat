# Pinned from the GPU's own rendering of one flat colour; see each name.

[[probe]]
name = "default"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.5
expect = [0.027481, 0.082458, 0.21985, 1]

[[probe]]
name = "least"
at = "min"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.5
expect = [0.027481, 0.082458, 0.21985, 1]

[[probe]]
name = "most"
at = "max"
input = [0.8, 0.5, 0.3, 1]
to = [0.05, 0.15, 0.4, 1]
progress = 0.5
expect = [0.4397, 0.2749, 0.16492, 1]
