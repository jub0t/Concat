[effect]
id = "concat.cathedral"
name = "Cathedral"
kind = "audio"
category = "Space"
order = 34
intensity = "size"
aliases = ["cathedral"]
description = "Stone and height: reflections that take a while to arrive."

[[param]]
key = "size"
label = "Size"
min = 0
max = 100
default = 55
step = 1
unit = "%"

[ffmpeg]
let = [
  "scale = 0.5 + (size / 100) * 1.5",
]
chain = "aecho=0.8:0.9:{round(120 * scale)}|{round(230 * scale)}|{round(390 * scale)}|{round(600 * scale)}:0.6|0.5|0.4|0.3"
