[package]
name = "concat-speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Speech in and out: on-device transcription with whisper.cpp, and text to speech with Kokoro."

[dependencies]
concat-host.workspace = true
concat-media.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

# Model downloads. Blocking on purpose: downloads run on their own thread,
# and an async HTTP stack would be a second runtime's worth of dependencies
# for one GET.
ureq = "2"

# Kokoro models arrive as tar.bz2 archives, hence tar + bzip2 (pure-Rust
# decoder) for unpacking them.
tar = "0.4"
bzip2 = "0.6"

# Transcription: whisper.cpp in-process. Built from source by cmake at build
# time; on macOS with Metal so the encoder runs on the GPU.
whisper-rs = "0.16"

# Text to speech: the official k2-fsa bindings. Linked statically on the
# desktop Unixes, so the binary carries no extra dylibs.
[target.'cfg(not(any(windows, target_os = "android", target_os = "ios")))'.dependencies]
sherpa-onnx = "1.13"

# Elsewhere it is the shared library.
#
# On Windows it must be: the only static archives k2-fsa publishes are /MT
# (static CRT), and MSVC refuses to link those into a binary whose every
# other object - Rust's own runtime, Skia, whisper - is /MD. LNK2038, on
# every object pair. The /MT code stays sealed inside the DLLs, which ship
# beside the binary.
#
# Windows builds must also set SHERPA_ONNX_LIB_DIR to a directory holding
# only the import .lib files (CI does; ~/.cargo/config.toml locally). Left
# to its own download, the sys crate finds the DLLs next to the import
# libraries and tries to copy them into the "profile directory" - which it
# locates by searching for an ancestor named after $PROFILE, a walk that
# panics under the custom `app` profile. Keeping the DLLs out of the lib
# directory skips that code path; packaging ships them explicitly.
#
# On the phones it is what k2-fsa publishes: one archive of .so files per
# Android ABI, which the app's jniLibs carry, and an xcframework for iOS
# with onnxruntime folded into the one dylib the app embeds. The sys crate
# downloads the right one for the target on its own.
[target.'cfg(any(windows, target_os = "android", target_os = "ios"))'.dependencies]
sherpa-onnx = { version = "1.13", default-features = false, features = ["shared"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[lints]
workspace = true
