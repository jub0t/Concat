[package]
name = "concat-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Concat API: one dispatcher for projects, edits, media, effects, templates, exports and frames, which every transport - the command line, a daemon, a plugin - calls."

[features]
# Real GPU info in `hardware.profile`'s reply, at the cost of the wgpu tree.
# Off by default like everywhere the engine touches a GPU; without it the
# method still answers, with `gpu: null`.
gpu = ["concat-host/gpu"]

[dependencies]
concat-project.workspace = true
concat-effects.workspace = true
concat-export.workspace = true
concat-host.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The frame method hands back a PNG: the one picture format every
# caller reads and that keeps the compositor's pixels exact.
png = "0.17"
# A frame handed back inline crosses as text.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
