[package]
name = "concat-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rendering a timeline to a file, and one true frame of it to a monitor. The engine's ownership of what the pixels mean."

[features]
# The GPU compositor for full exports. Off by default for the same reason as
# concat-render's: engine-only work never pays for the wgpu tree.
gpu = ["concat-render/gpu"]

[dependencies]
concat-core.workspace = true
concat-media.workspace = true
concat-render.workspace = true
concat-project = { path = "../concat-project" }
concat-effects.workspace = true
# Masks for cutouts: read from the project's cache and applied to a decoded
# frame before it is placed. Reading only; the host finds them.
concat-vision.workspace = true
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
