[package]
name = "concat-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Spike: the engine behind a native phone shell (Kotlin + Compose), through UniFFI."

# A shared object the Kotlin side loads: JNA for the UniFFI calls, and
# System.loadLibrary for the JNI entry points in jni.rs. The bindings are
# generated from the built library by android-native/uniffi-bindgen.
[lib]
crate-type = ["cdylib"]

[dependencies]
concat-core.workspace = true
concat-host = { workspace = true, features = ["gpu"] }
concat-project.workspace = true
concat-export.workspace = true
concat-media.workspace = true
uniffi = "=0.32.2"
thiserror.workspace = true
log = "0.4"
wgpu.workspace = true
pollster.workspace = true
raw-window-handle = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
# The Surface's ANativeWindow, and its CPU lock for the fallback path.
ndk = { version = "0.9", default-features = false, features = ["nativewindow", "rwh_06"] }
# cpal's AAudio host reads the JavaVM and the app's Context through this.
ndk-context = "0.1"
jni-sys = "0.4"
ndk-sys = { version = "0.6", features = ["nativewindow"] }

[lints]
workspace = true
