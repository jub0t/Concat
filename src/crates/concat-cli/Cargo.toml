[package]
name = "concat-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line driver for the Concat engine."

# `concat` is the editor window's binary; the driver gets the suffix.
[[bin]]
name = "concat-cli"
path = "src/main.rs"

[dependencies]
concat-core.workspace = true
concat-media.workspace = true
concat-render.workspace = true
# The `api` command: the Concat API over stdin and stdout.
concat-api.workspace = true
serde_json.workspace = true
# `preview` renders one effect at its defaults: the catalogue for the
# chain, the document model for the applied entry it takes.
concat-effects.workspace = true
concat-project.workspace = true
clap.workspace = true

[lints]
workspace = true
