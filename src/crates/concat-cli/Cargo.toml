[package]
name = "concat-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line driver for the Concat engine."

# `concat` is the editor window's binary; the driver gets the suffix.
[[bin]]
name = "concat-cli"
path = "src/main.rs"

[dependencies]
concat-core.workspace = true
concat-media.workspace = true
concat-render.workspace = true
# The `api` command: the Concat API over stdin and stdout. The `serve`
# command: the same on a socket.
concat-api.workspace = true
concat-server.workspace = true
serde_json.workspace = true
# `preview` draws one effect's card, as the window does; `check` loads
# packages and runs their probes.
concat-effects.workspace = true
concat-host.workspace = true
clap.workspace = true

[features]
# `serve --grpc`. Off by default; see concat-server.
grpc = ["concat-server/grpc"]

[lints]
workspace = true
