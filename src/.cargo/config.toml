# Where the FFmpeg development build lives - machine configuration, not
# repository configuration.
#
# Only the optional `ffi` feature of concat-media needs FFmpeg headers and
# libraries at build time. A normal build - which talks to FFmpeg as a
# subprocess - needs nothing here. Do not commit machine paths into this
# file: rusty_ffmpeg panics on an FFMPEG_INCLUDE_DIR that does not exist,
# which breaks `--features ffi` for everyone else.
#
# To build the ffi feature, set the variables in your own environment (or a
# cargo config outside the repository):
#
#   macOS / Linux, package-manager FFmpeg with dev files:
#     export FFMPEG_PKG_CONFIG_PATH="$(brew --prefix ffmpeg)/lib/pkgconfig"
#
#   Windows, a -shared dev build (gyan.dev / BtbN) unpacked into vendor/:
#     FFMPEG_INCLUDE_DIR = <build>/include
#     FFMPEG_LIBS_DIR    = <build>/lib
#     (Deliberately not FFMPEG_DLL_PATH: rusty_ffmpeg turns that into the
#     linker's /LIBPATH, which hunts for import libraries in bin/ where only
#     the DLLs live. The DLLs still have to be findable at run time.)

# No incremental caches. They are a speed-up for the second build of one
# crate and a tax on the disk for everything else: a session of edits across
# the workspace leaves tens of gigabytes of them behind. The shipping builds
# run on GitHub Actions; a machine here needs `cargo check` and the tests of
# the crates it is changing, and those are quick without.
[build]
incremental = false
