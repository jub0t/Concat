# Pinned so a checkout in two years builds the same way it does today, to
# the patch release: "1.93" alone is whichever 1.93.x is newest on the day,
# so two runs a week apart could build with different compilers. CI reads
# the channel from here (the workflows' "The pinned toolchain" steps).
[toolchain]
channel = "1.93.1"
components = ["rustfmt", "clippy"]
