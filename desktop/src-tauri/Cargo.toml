[package]
name = "concat-desktop"
version = "0.2.0"
license = "AGPL-3.0-or-later"  # + plugin exception, see LICENSE-EXCEPTIONS.md
description = "WolfCut video editor"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# otherwise collides on Windows. See rust-lang/cargo#8519.
name = "concat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The engine. Path dependencies rather than a shared workspace on purpose: the
# engine builds, tests and versions on its own, and nothing about it should
# depend on there being a desktop app.
concat-core = { path = "../../engine/crates/concat-core" }
concat-media = { path = "../../engine/crates/concat-media" }
concat-project = { path = "../../engine/crates/concat-project" }
concat-render = { path = "../../engine/crates/concat-render", features = ["gpu"] }
concat-export = { path = "../../engine/crates/concat-export", features = ["gpu"] }

# Engine-owned audio playback: cpal talks to the output device, memmap2 keeps
# decoded PCM disk-backed instead of resident.
cpal = "0.16"
memmap2 = "0.9"

# Whisper model downloads. Blocking on purpose: downloads run on a
# spawn_blocking thread, and an async HTTP stack would be a second runtime's
# worth of dependencies for one GET.
ureq = "2"

# Text to speech: the official k2-fsa bindings, linked statically so the
# bundle carries no extra dylibs. Kokoro models arrive as tar.bz2 archives,
# hence tar + bzip2 (pure-Rust decoder) for unpacking them.
sherpa-onnx = "1.13"
tar = "0.4"
bzip2 = "0.6"

# TypeScript bindings for the host's own wire types (EditorView and friends),
# generated by `cargo test --features types export_bindings` with
# TS_RS_EXPORT_DIR pointed at desktop/src/lib/generated - see the README
# there. Optional so normal builds never pay for it.
ts-rs = { version = "12", optional = true }

[features]
types = ["dep:ts-rs", "concat-project/types"]

[lints.clippy]
# Same stance as the engine workspace: a Tauri command's arguments are its
# wire signature, and splitting one to satisfy a count is cleverness.
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Not panic = "abort": Tauri catches panics on the command thread, and losing
# that turns a recoverable command failure into a dead window.

[profile.dev]
# The UI is unusable if the engine underneath it runs unoptimised.
[profile.dev.package."*"]
opt-level = 2
