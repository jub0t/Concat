# Validates the Nix flake (#7). The flake still packages the deprecated Tauri
# app in desktop/, which no longer builds against the engine - so this runs
# only when the flake or that tree changes, until the flake packages the
# Slint window instead.
name: Nix

on:
  workflow_dispatch:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
      - "desktop/**"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
      - "desktop/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Build the flake package
        run: nix build .#concat --print-build-logs
