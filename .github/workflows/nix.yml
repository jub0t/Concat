# Validates the Nix flake (#7) on anything the Nix build actually consumes -
# the flake itself, the engine, the desktop app and its lockfiles - so the
# check shows up beside the other builds instead of only on flake edits.
name: Nix

on:
  workflow_dispatch:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
      - "engine/**"
      - "desktop/**"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/nix.yml"
      - "engine/**"
      - "desktop/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Build the flake package
        run: nix build .#concat --print-build-logs
