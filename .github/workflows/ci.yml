name: CI

# The engine's tests and lints on every push and pull request. The bundles
# are built by release.yml, on a tag; see that file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this before it builds anything: a tag on a red tree
  # is not a release.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests and lints
    runs-on: ubuntu-latest
    env:
      FFMPEG_LINUX: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1.tar.xz
      # See build-app.yml: the version the ort crate is built against.
      ORT_VERSION: 1.28.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      # Slint's Skia renderer links fontconfig and freetype; cpal links
      # ALSA; bindgen needs libclang; whisper.cpp is built by cmake; the
      # file dialogs link GTK on Linux. Mesa's Vulkan drivers bring
      # lavapipe, a software GPU, so the compositor's parity suite runs
      # here rather than skipping for want of an adapter.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libclang-dev cmake \
            libvulkan1 mesa-vulkan-drivers

      # Ubuntu's packaged FFmpeg is older than the 7 the engine needs, so the
      # libraries come from BtbN, and FFMPEG_DIR tells the bindings where.
      - name: FFmpeg development libraries
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.tar.xz "$FFMPEG_LINUX"
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"

      # ONNX Runtime as a shared library, linked dynamically, for the reason
      # build-app.yml gives: a static one beside sherpa-onnx's is the same
      # protobuf twice, and the test binary does not link. The tests then
      # find it through LD_LIBRARY_PATH, as they find FFmpeg.
      - name: ONNX Runtime
        run: |
          set -euo pipefail
          stem="onnxruntime-linux-x64-$ORT_VERSION"
          curl -fsSL --retry 5 --retry-all-errors -o onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/$stem.tgz"
          tar -xzf onnxruntime.tgz
          ln -sf "libonnxruntime.so.$ORT_VERSION" "$stem/lib/libonnxruntime.so"
          {
            echo "ORT_LIB_LOCATION=$PWD/$stem/lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib:$PWD/$stem/lib"
          } >> "$GITHUB_ENV"

      - run: cargo fmt --check
        working-directory: src
      # Every string the interface shows is a key in a locale file; this
      # keeps en.json the inventory of them and every shipped language
      # keyed off it. See TRANSLATING.md.
      - run: python3 scripts/locales.py --check
      # The models Concat downloads are mirrored onto a release of this
      # repository; models/manifest.toml is what fills that mirror and the
      # engine's tables are what a download is checked against. This keeps
      # the two saying the same thing. See models/manifest.toml.
      - run: python3 scripts/models.py --check
      # -D warnings covers rustc lints too (missing_docs among them), so a
      # public item without documentation fails here, not in review. Lints
      # before tests: they finish in a fraction of the time and catch the
      # most.
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src
      # CONCAT_REQUIRE_GPU: the GPU tests fail rather than skip when no
      # adapter is usable, so the parity suite is known to have run.
      - run: cargo test --workspace -j 1
        working-directory: src
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CONCAT_REQUIRE_GPU: "1"
      # The performance table's quick scenarios against their budgets, in
      # the `quick` profile: planning, undo, the document, publishing.
      # The media scenarios need a machine that is not a shared runner.
      - run: cargo run -p concat-perf --profile quick -- --check --quick
        working-directory: src
      # The gRPC transport is a feature nothing else in the workspace turns
      # on, so it is linted and tested here on its own. See concat-server.
      - run: cargo clippy -p concat-server -p concat-cli --features grpc --all-targets -- -D warnings
        working-directory: src
      - run: cargo test -p concat-server --features grpc
        working-directory: src

  # The engine crates that carry no native library build for the web. This
  # job is what keeps that true: a std::thread or a blocking wait that
  # creeps into concat-core or concat-project fails here, not when someone
  # next tries the target. See src/README.md for the list.
  web:
    name: Engine on wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: wasm32
      - run: >
          cargo clippy
          -p concat-core -p concat-project -p concat-effects -p concat-render -p concat-text
          --features concat-render/gpu --target wasm32-unknown-unknown
          -- -D warnings
        working-directory: src

  # The window and the engine compiled where they ship. Linux is the job
  # above; macOS and Windows used to be compiled only by a release tag,
  # which is where a broken platform path was found. A check, not the
  # tests: the dependencies are the same as build-app.yml's, and what this
  # catches is code that does not build on the platform.
  desktop:
    name: Compiles on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            sherpa: osx-arm64
          - os: windows-2022
            sherpa: win-x64
    runs-on: ${{ matrix.os }}
    env:
      FFMPEG_WINDOWS: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install ffmpeg cmake
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg)" >> "$GITHUB_ENV"
      - name: FFmpeg and LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          curl.exe -fsSL --retry 5 --retry-all-errors -o ffmpeg-win.zip "$env:FFMPEG_WINDOWS"
          Expand-Archive ffmpeg-win.zip -DestinationPath ffdl
          $dir = (Get-ChildItem ffdl -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      # The prebuilt sherpa-onnx library, as build-app.yml fetches it:
      # static on macOS, the import libraries alone on Windows.
      - name: sherpa-onnx libraries
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -A1 'name = "sherpa-onnx-sys"' src/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          if [ "$RUNNER_OS" = "Windows" ]; then
            stem="sherpa-onnx-v$version-${{ matrix.sherpa }}-shared-MT-Release-lib"
          else
            stem="sherpa-onnx-v$version-${{ matrix.sherpa }}-static-lib"
          fi
          echo "Downloading $stem"
          curl -fsSL --retry 5 --retry-all-errors -o sherpa.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$version/$stem.tar.bz2"
          mkdir -p sherpa
          python3 -c "import tarfile; t = tarfile.open('sherpa.tar.bz2'); t.extractall('sherpa', **({'filter': 'data'} if hasattr(tarfile, 'data_filter') else {}))"
          test -d "sherpa/$stem/lib"
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p sherpa-libs
            cp "sherpa/$stem/lib/"*.lib sherpa-libs/
            echo "SHERPA_ONNX_LIB_DIR=$(pwd -W)\\sherpa-libs" >> "$GITHUB_ENV"
          else
            echo "SHERPA_ONNX_LIB_DIR=$PWD/sherpa/$stem/lib" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: check-${{ matrix.os }}
      - run: cargo check --workspace --all-targets
        working-directory: src
