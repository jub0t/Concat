name: Build app

# Builds Concat - the Slint window, `src/crates/concat` - for every
# platform and architecture it ships on, each on a runner of that
# architecture so nothing is cross-compiled, and uploads one artifact per
# target:
#
#   macOS    arm64 (Apple silicon)   x86_64 (Intel)     -> Concat-*.dmg
#   Linux    x86_64                  aarch64            -> Concat-*.deb, .rpm, .AppImage, .pkg.tar.zst
#   Windows  x86_64                  (aarch64, #326)    -> Concat-*-setup.exe, .msi
#
# Installers and binaries only: the program is not shipped as an archive
# of a folder to unpack, so what a person downloads is what they run.
#
# Reusable: release.yml calls it on every tag. It is the one place the
# build environment is described:
#
# - The engine links FFmpeg and compiles whisper.cpp in, so a build needs the
#   FFmpeg 7+ development libraries (headers and import libraries), cmake, a
#   C++ toolchain and libclang for bindgen. sherpa-onnx is a prebuilt static
#   library its crate downloads for the target.
# - Homebrew's FFmpeg serves on macOS and travels with the app: the dylibs
#   are copied into the bundle and the binary's load paths rewritten, so the
#   .dmg runs on a Mac with nothing installed. Windows and Linux use a BtbN
#   `shared` build - headers, import libraries and runtime libraries in one
#   archive - and the runtime libraries ship beside the binary; on Linux the
#   binary carries an rpath to find them there.
# - The app is signed and notarised on macOS when the signing secrets are
#   set on the repository, and ad-hoc signed when they are not, so a build
#   from a fork still opens (with Gatekeeper's warning).
#
# - Every bundle is launched before it is uploaded: `concat --version` and
#   `concat --smoke` from the staged folder, on a machine with nothing else
#   on the path (scripts/ci/smoke-*). On x86_64 the bundle is also started
#   under Intel's emulator posing as an Ivy Bridge, and its binaries are
#   scanned for instructions newer than AVX (scripts/ci/isa-scan.sh): the
#   x86_64 baseline is AVX, and twice now a release died at launch on
#   older CPUs (#193, #313). A target whose bundle does not start fails,
#   and release.yml publishes nothing.
# - Every prebuilt dependency downloaded here is pinned to one file and its
#   digest in scripts/ci/deps.lock, and every action to a commit.
#
# The six targets are a matrix so one fails without taking the rest down;
# `fail-fast` is off for the same reason.
on:
  workflow_call:
    inputs:
      ref:
        description: The ref to build, when it is not the one this runs on
        type: string
        default: ""
    secrets:
      APPLE_CERTIFICATE_P12:
        description: Base64 of a Developer ID Application .p12
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        description: "The identity to sign with, e.g. Developer ID Application: Name (TEAMID)"
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_PASSWORD:
        description: An app-specific password for notarytool
        required: false
      WINDOWS_CERTIFICATE_PFX:
        description: Base64 of an Authenticode code-signing .pfx
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        description: The .pfx's password
        required: false

env:
  CARGO_TERM_COLOR: always
  # The prebuilt dependencies - BtbN's FFmpeg 8.1 (GPL, shared, one per
  # arch), ONNX Runtime, sherpa-onnx, nfpm, appimagetool, LLVM for Windows
  # and Intel's emulator - are each pinned to one file and its digest in
  # scripts/ci/deps.lock, and fetched through scripts/ci/fetch.sh, which
  # refuses a file whose digest has changed. The versions below are the
  # ones those files carry, for the names inside them; a bump changes both.
  #
  # ONNX Runtime, for the Linux and Windows bundles: the version the ort
  # crate is built against (see ort-sys's dist table), as Microsoft's own
  # shared build.
  ORT_VERSION: 1.28.0
  # And for Intel Macs, which neither ort nor Microsoft build for any more:
  # the last release Microsoft made for them. It serves API 23, which is
  # what ort asks for there, and it is built for macOS 13.4, so it is not
  # linked: the app loads it at first use, and not on an older macOS (see
  # concat-vision's manifest and onnx.rs, and #333).
  ORT_INTEL_MAC_VERSION: 1.23.2
  # WiX for the Windows .msi, as a dotnet tool, pinned by version.
  WIX_VERSION: 6.0.2
  # Oldest macOS the bundles run on. Apple silicon Macs all run newer than
  # this; it is the Intel floor. scripts/ci/check-min-os.sh lists every
  # bundled library built for a newer one.
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  # ggml (whisper.cpp's kernels) tunes itself to the machine it is built
  # on unless told otherwise, and these bundles run on other machines: a
  # runner with AVX-512 or SVE would leave a binary that faults on a CPU
  # without them. Off, ggml does not probe the runner. whisper-rs-sys
  # forwards every GGML_* variable to CMake as a define. The instruction
  # sets each target's kernels are built for are the job's, by its `ggml`
  # row in the matrix; see the job's `env`.
  GGML_NATIVE: "OFF"

jobs:
  app:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `ffmpeg` and `sherpa` name the target the way each project's
          # release archives do.
          - platform: macos
            arch: arm64
            os: macos-15
            target: aarch64-apple-darwin
            sherpa: osx-arm64
          - platform: macos
            arch: x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            sherpa: osx-x64
            # No `ggml` row: built as 0.2.7 was, with no AVX2. This bundle
            # runs on macOS 12 again, and so on the 2013 Mac Pro, whose Ivy
            # Bridge has AVX and nothing newer; Intel Macs are about one
            # download in a hundred, and slower captions there beat a crash.
          # 22.04, not latest: the binary links the build machine's glibc,
          # so the oldest supported runner is what keeps it runnable on
          # older distributions.
          - platform: linux
            arch: x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ffmpeg: linux64
            sherpa: linux-x64
            ort: x64
            nfpm: amd64
            appimage: x86_64
            ggml: variants
          - platform: linux
            arch: aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            ffmpeg: linuxarm64
            sherpa: linux-aarch64
            ort: aarch64
            nfpm: arm64
            appimage: aarch64
          - platform: windows
            arch: x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            ffmpeg: win64
            sherpa: win-x64
            ort: win-x64
            llvm: win64
            vc: x64
            inno: x64compatible
            wix: x64
            ggml: variants
          # No Windows on ARM until its program starts: v0.2.7-rc.4's
          # concat.exe died with an access violation on `--version` (#326).
          # Its row was platform windows, arch aarch64, os windows-11-arm,
          # target aarch64-pc-windows-msvc, ffmpeg winarm64, sherpa and ort
          # win-arm64, llvm woa64, vc and inno and wix arm64.
    runs-on: ${{ matrix.os }}
    # The slowest target is Intel macOS, whose build alone ran past an hour
    # in v0.2.7-rc.1. The steps that can hang have timeouts of their own,
    # at most 155 minutes between them on any one target, so a stuck step
    # is named by its own timeout; this is for a job stuck anywhere else.
    timeout-minutes: 190
    env:
      # What whisper's CPU kernels are built for on x86_64, by the matrix's
      # `ggml` row. ggml's own switches default to AVX2 with FMA, F16C and
      # BMI2, compiled into the whole CPU backend - and the editor died at
      # launch with an illegal instruction on an Ivy Bridge, which has AVX
      # and nothing newer (#193). 0.2.6 and 0.2.7 built with all four off,
      # so those machines start, and every other one transcribed some
      # eight times slower: 324 s for 43 s of sound on a Ryzen 5 2600, 40 s
      # with AVX2 (#388). Two answers, by target:
      #
      # - `variants` (Windows and Linux x86_64): whisper and ggml are built
      #   as shared libraries and the CPU backend as one module per x86_64
      #   generation - ggml-cpu-x64, -sse42, -sandybridge, -haswell,
      #   -skylakex, -icelake, -alderlake and more - shipped beside the
      #   program. At the first transcription ggml scores each against the
      #   CPU's CPUID and loads the best it can run (concat-speech's
      #   `cpu_backend`), so a Haswell or a Ryzen gets AVX2 and FMA, and a
      #   Sandy Bridge the AVX kernels it had. The modules are what the
      #   whisper.cpp and llama.cpp projects ship their own x86 builds as.
      #   The published whisper-rs-sys can only build static libraries;
      #   src/patches/whisper-rs-sys adds the shared build, chosen by
      #   GGML_BACKEND_DL. Nothing else in the bundle may hold AVX2: the
      #   instruction-set scan allows it in the Haswell-and-newer modules
      #   alone (scripts/ci/isa-allow.txt).
      # - none (macOS x86_64): all four off, as before. It declares macOS 12,
      #   which the 2013 Mac Pro runs, and that is an Ivy Bridge.
      #
      # Everything else is ARM, which reads none of these. The `haswell`
      # answer - built for Haswell outright - is kept for a target that
      # only runs on AVX2 machines.
      GGML_BACKEND_DL: ${{ matrix.ggml == 'variants' && 'ON' || 'OFF' }}
      GGML_CPU_ALL_VARIANTS: ${{ matrix.ggml == 'variants' && 'ON' || 'OFF' }}
      GGML_AVX2: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
      GGML_FMA: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
      GGML_F16C: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
      GGML_BMI2: ${{ matrix.ggml == 'haswell' && 'ON' || 'OFF' }}
    steps:
      # The ref release.yml names, which is its tag: without one a run
      # started by hand builds main and publishes it under the tag's name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The toolchain src/rust-toolchain.toml pins, installed by name, so the
      # runner never also fetches a stable it will not use.
      - name: The pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Read the version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Concat $version for ${{ matrix.target }}"

      # ── Linux ──────────────────────────────────────────────────────────
      # Slint's Skia renderer links fontconfig and freetype; cpal links
      # ALSA; bindgen needs libclang; whisper.cpp is built by cmake; the
      # file dialogs link GTK.
      - name: System libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libclang-dev cmake libxkbcommon-x11-0

      # Ubuntu's packaged FFmpeg is older than the 7 the engine needs.
      - name: FFmpeg development libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          scripts/ci/fetch.sh "ffmpeg-${{ matrix.ffmpeg }}" ffmpeg.tar.xz
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          {
            echo "FFMPEG_DIR=$PWD/ffmpeg-dev"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib"
            # The shipped binary finds the libraries beside itself, in lib/.
            # --disable-new-dtags makes that an old-style DT_RPATH, which is
            # consulted for *every* object in the process - DT_RUNPATH is
            # not transitive, so libavformat's own load of libavcodec would
            # ignore it and the staged binary would not stand alone.
            echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,\$ORIGIN/lib -C link-arg=-Wl,--disable-new-dtags"
          } >> "$GITHUB_ENV"

      # ONNX Runtime, the cutout models' runtime. Left to itself ort-sys
      # downloads a static build and links it in; sherpa-onnx links a
      # static build of its own, and the two carry the same protobuf, which
      # the linker refuses as duplicate symbols the moment both are pulled
      # - every Linux link since the cutout arrived. So on Linux ort links
      # Microsoft's shared build instead, through ORT_LIB_LOCATION with
      # dynamic linking preferred, and the library ships in lib/ beside
      # FFmpeg's, where the rpath above finds it. The Nix package links
      # the same way against nixpkgs' onnxruntime.
      - name: ONNX Runtime (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          stem="onnxruntime-linux-${{ matrix.ort }}-$ORT_VERSION"
          scripts/ci/fetch.sh "onnxruntime-linux-${{ matrix.ort }}" onnxruntime.tgz
          tar -xzf onnxruntime.tgz
          test -f "$stem/lib/libonnxruntime.so.$ORT_VERSION"
          # The tarball carries the soname and the full version; the linker
          # asks for the bare name.
          ln -sf "libonnxruntime.so.$ORT_VERSION" "$stem/lib/libonnxruntime.so"
          {
            echo "ORT_LIB_LOCATION=$PWD/$stem/lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "ORT_DIR=$PWD/$stem"
          } >> "$GITHUB_ENV"

      # ── macOS ──────────────────────────────────────────────────────────
      # FFMPEG_DIR, same as the other platforms: ffmpeg-sys honours it ahead
      # of every fallback, so the build never depends on the runner image
      # happening to carry a pkg-config that knows about Homebrew - the
      # arm64 image did not, and the build died in the pkg-config fallback.
      - name: FFmpeg development libraries (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          brew install ffmpeg cmake dylibbundler
          echo "FFMPEG_DIR=$(brew --prefix ffmpeg)" >> "$GITHUB_ENV"
          # ggml's Metal code asks `@available(macOS 15, *)` before using
          # residency sets. Below that deployment target the question is
          # answered at run time by ___isPlatformVersionAtLeast, which lives
          # in clang's compiler-rt - and rustc links with -nodefaultlibs, so
          # nothing pulls that archive in. Name it on the link line. (A
          # build on a developer's Mac never sees this: with no deployment
          # target set, the check is folded away at compile time.)
          echo "RUSTFLAGS=-C link-arg=$(xcrun clang --print-file-name=libclang_rt.osx.a)" >> "$GITHUB_ENV"

      # ONNX Runtime on an Intel Mac. ort ships no build for
      # x86_64-apple-darwin, so the cutout's runtime is Microsoft's shared
      # one - and that is built for macOS 13.4, while the app runs on 12.
      # Linked at load time it closed the app at launch on 12 (#333), so
      # it is not linked at all: ort is built with `load-dynamic` there,
      # the bundle step copies the library into Frameworks, and the app
      # opens it at the first cutout or Chatterbox read, on a macOS new
      # enough for it. Apple silicon keeps ort's static build.
      - name: ONNX Runtime (Intel macOS)
        if: matrix.platform == 'macos' && matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          stem="onnxruntime-osx-x86_64-$ORT_INTEL_MAC_VERSION"
          scripts/ci/fetch.sh onnxruntime-osx-x86_64 onnxruntime.tgz
          tar -xzf onnxruntime.tgz
          test -f "$stem/lib/libonnxruntime.$ORT_INTEL_MAC_VERSION.dylib"
          echo "ORT_MAC_DYLIB=$PWD/$stem/lib/libonnxruntime.$ORT_INTEL_MAC_VERSION.dylib" >> "$GITHUB_ENV"

      # Thin LTO and sixteen codegen units for the Intel Mac, in place of the
      # app profile's fat LTO and one unit. The Intel runner is the slowest
      # target and the one every release waits on: in v0.2.7-rc.4 its
      # build was 70 minutes, 57 of them after the last dependency compiled -
      # fat LTO re-optimising the whole program on one thread, which no cache
      # can skip. Thin LTO does that work in parallel, for a binary a few
      # per cent slower on the platform with the fewest users. Every other
      # target keeps the profile as Cargo.toml writes it. Set before the
      # cache step, so these are part of its key (CARGO is in env-vars).
      - name: Thin LTO (Intel macOS)
        if: matrix.platform == 'macos' && matrix.arch == 'x86_64'
        run: |
          {
            echo "CARGO_PROFILE_APP_LTO=thin"
            echo "CARGO_PROFILE_APP_CODEGEN_UNITS=16"
          } >> "$GITHUB_ENV"

      # ── Windows ────────────────────────────────────────────────────────
      # LLVM: libclang for bindgen on both architectures, the C/C++
      # compiler on arm64, and llvm-objdump for the instruction-set scan.
      # LLVM's own installer for the architecture, at the version deps.lock
      # pins, into a folder of its own rather than over the LLVM the runner
      # image may already carry. The BtbN zip unpacks to one top-level
      # folder.
      #
      # On arm64 the whole C side is compiled by clang-cl rather than cl:
      # ggml refuses MSVC for ARM outright (its NEON kernels need clang),
      # and ring picks clang there on its own. clang-cl speaks cl's command
      # line and links against the same CRT, so the objects mix with the
      # rest of the build; the cc crate hands it the Visual Studio
      # environment, and the cmake crate passes it to CMake - but only
      # under a Ninja generator, since the Visual Studio generator chooses
      # the compiler itself. Ninja ships on the runner image. Under Ninja
      # the cmake crate also writes CMAKE_CXX_FLAGS itself, in place of
      # CMake's defaults, and those defaults are where /EHsc came from;
      # clang-cl, unlike cl, rejects `try` outright without it (ggml's
      # gguf reader uses exceptions). CXXFLAGS travels through the cc
      # crate into those flags - spelt with a dash, because the build
      # step runs under Git's bash, whose MSYS layer rewrites a value
      # that starts with a slash into a Windows path.
      #
      # fetch.sh runs under Git's bash, named by its full path: a bare
      # `bash` from PowerShell can be WSL's.
      - name: FFmpeg development libraries and LLVM (Windows)
        if: matrix.platform == 'windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          & $bash scripts/ci/fetch.sh "llvm-${{ matrix.llvm }}" llvm.exe
          if ($LASTEXITCODE -ne 0) { throw "the LLVM download failed" }
          Start-Process -Wait -FilePath .\llvm.exe -ArgumentList "/S", "/D=C:\llvm"
          if (-not (Test-Path C:\llvm\bin\libclang.dll)) { throw "LLVM did not install to C:\llvm" }
          # The installer is not needed once LLVM is in place. On Windows on
          # ARM it can still hold its own file open after it returns, which
          # turned the deletion into the step's failure in v0.2.7-rc.1; a
          # left-over installer in the workspace harms nothing.
          Remove-Item llvm.exe -ErrorAction SilentlyContinue
          if ("${{ matrix.arch }}" -eq "aarch64") {
            "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
            "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
            "CXXFLAGS=-EHsc" | Out-File -FilePath $env:GITHUB_ENV -Append
            "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          "C:\llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\llvm\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $bash scripts/ci/fetch.sh "ffmpeg-${{ matrix.ffmpeg }}" ffmpeg-win.zip
          if ($LASTEXITCODE -ne 0) { throw "the FFmpeg download failed" }
          Expand-Archive ffmpeg-win.zip -DestinationPath ffdl
          $dir = (Get-ChildItem ffdl -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ONNX Runtime on Windows: Microsoft's shared build, linked
      # dynamically, and onnxruntime.dll shipped beside concat.exe.
      #
      # Left to itself ort-sys links pyke's static build into concat.exe,
      # and that build is compiled for Haswell from end to end: BMI2
      # shifts in ordinary code, run at start-up, so 0.2.5 and 0.2.6 died
      # with STATUS_ILLEGAL_INSTRUCTION on every CPU before 2013 (#313).
      # Microsoft's build keeps its general code to the baseline and picks
      # AVX2 kernels at run time. pyke's is also the DirectML build, which
      # imports DirectML.dll when the program loads - and the one Windows
      # keeps in System32 is too old on many machines, so the program would
      # not start at all ("DMLCreateDevice1 not found", #303).
      #
      # Why the CPU build and not Microsoft's DirectML one: two runtimes
      # cannot share a process under one name, and sherpa-onnx's DLL loads
      # onnxruntime.dll too. sherpa-onnx 1.13.7 is built against ONNX
      # Runtime 1.27.1 and asks for its API 27 as it loads; ort 2.0.0-rc.13
      # asks for API 27 as well (its default `api-27` feature). Microsoft
      # stopped publishing the DirectML build at 1.24.4, which serves API
      # 24 and below, so it can serve neither. 1.28.0 serves both. The cost
      # is that the cutouts and Chatterbox run on the CPU on Windows: the
      # DirectML provider ort asks for is not in this runtime, and ort
      # carries on without it (it logs the failed registration and falls
      # back; error_on_failure is not set). Getting the GPU back means a
      # DirectML (or WebGPU) runtime at API 27 or later that is built for
      # the baseline - pyke's is neither the one nor shareable with
      # sherpa-onnx - and no DirectML.dll is shipped until then, since
      # nothing in the bundle imports it.
      #
      # The DLL's folder goes on the path too, so anything the build runs
      # that links it (a build script's helper, say) finds it.
      - name: ONNX Runtime (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/ci/fetch.sh "onnxruntime-${{ matrix.ort }}" onnxruntime.zip
          if ($LASTEXITCODE -ne 0) { throw "the ONNX Runtime download failed" }
          Expand-Archive onnxruntime.zip -DestinationPath .
          $dir = "$PWD\onnxruntime-${{ matrix.ort }}-$env:ORT_VERSION"
          if (-not (Test-Path "$dir\lib\onnxruntime.lib")) { throw "$dir\lib\onnxruntime.lib is not there" }
          if (-not (Test-Path "$dir\lib\onnxruntime.dll")) { throw "$dir\lib\onnxruntime.dll is not there" }
          "ORT_LIB_LOCATION=$dir\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_PREFER_DYNAMIC_LINK=1" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ORT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\lib" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ── sherpa-onnx ────────────────────────────────────────────────────
      # The prebuilt library the sys crate would otherwise fetch for
      # itself, fetched here instead and handed over through
      # SHERPA_ONNX_LIB_DIR. Left to the crate, the download lands inside
      # target/, where rust-cache's cleanup does not keep it; a restored
      # cache then replays the build script's answer without the files
      # it points at, and the crate fails to link the moment anything
      # makes it recompile. Outside target/, the files are there on every
      # run. The version is the one the lockfile resolved, and deps.lock
      # must pin that version's file: a bump to one without the other
      # stops here, saying so.
      - name: sherpa-onnx static libraries (macOS and Linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -A1 'name = "sherpa-onnx-sys"' src/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          name="sherpa-onnx-${{ matrix.sherpa }}-static-lib"
          case "$(scripts/ci/fetch.sh --url "$name")" in
            */v"$version"/*) ;;
            *) echo "scripts/ci/deps.lock pins $name for another version than Cargo.lock's $version" >&2; exit 1 ;;
          esac
          stem="sherpa-onnx-v$version-${{ matrix.sherpa }}-static-lib"
          scripts/ci/fetch.sh "$name" sherpa.tar.bz2
          mkdir -p sherpa
          tar -xjf sherpa.tar.bz2 -C sherpa
          test -d "sherpa/$stem/lib"
          echo "SHERPA_ONNX_LIB_DIR=$PWD/sherpa/$stem/lib" >> "$GITHUB_ENV"

      # On Windows it links shared (see concat-speech's manifest for why
      # static cannot work there), from a directory holding only the
      # import libraries. The separation matters: when the sys crate's
      # build script sees DLLs beside the .lib files it tries to copy them
      # into the "profile directory", located by searching OUT_DIR's
      # ancestors for one named after $PROFILE - which panics under the
      # custom `app` profile, whose directory is not called "release". The
      # DLLs are kept apart and the packaging step ships them beside the
      # binary.
      #
      # sherpa-onnx's own onnxruntime.dll and its import library are left
      # out: the bundle carries one ONNX Runtime, the one above, which
      # serves sherpa-onnx and ort alike (see that step).
      #
      # The archive is .tar.bz2, and Windows' own tar has no bzip2 of its
      # own: it pipes through an external decoder, and on the x64 image
      # that pipe can hang without a word. Python's tarfile unpacks it
      # in-process. Each command announces itself, so a stall would name
      # the culprit.
      - name: sherpa-onnx shared libraries (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Select-String -Path src\Cargo.lock -Pattern 'name = "sherpa-onnx-sys"' -Context 0,1).Context.PostContext[0] -replace '.*"(.*)".*', '$1'
          $name = "sherpa-onnx-${{ matrix.sherpa }}-shared-MT-Release-lib"
          $stem = "sherpa-onnx-v$version-${{ matrix.sherpa }}-shared-MT-Release-lib"
          $bash = "$env:ProgramFiles\Git\bin\bash.exe"
          $url = & $bash scripts/ci/fetch.sh --url $name
          if ($url -notmatch "/v$([regex]::Escape($version))/") { throw "scripts/ci/deps.lock pins $name for another version than Cargo.lock's $version" }
          Write-Host "Downloading $stem"
          & $bash scripts/ci/fetch.sh $name sherpa.tar.bz2
          if ($LASTEXITCODE -ne 0) { throw "the sherpa-onnx download failed" }
          Write-Host "Unpacking"
          python -c "import tarfile; t = tarfile.open('sherpa.tar.bz2'); t.extractall(**({'filter': 'data'} if hasattr(tarfile, 'data_filter') else {}))"
          if (-not (Test-Path "$stem\lib")) { throw "$stem\lib is not there after unpacking" }
          New-Item -ItemType Directory -Force sherpa-libs, sherpa-dlls | Out-Null
          Copy-Item "$stem\lib\sherpa-onnx-*.lib" sherpa-libs\
          Copy-Item "$stem\lib\sherpa-onnx-*.dll" sherpa-dlls\
          "SHERPA_ONNX_LIB_DIR=$PWD\sherpa-libs" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SHERPA_DLL_DIR=$PWD\sherpa-dlls" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ── Build ──────────────────────────────────────────────────────────
      # The cache comes after the environment is set, not before: its key
      # is made from the compiler and linker variables in force (RUSTFLAGS,
      # CC, CXX, CMAKE_*, and GGML_* and ORT_* added to the default set),
      # so a change to any of them is a new key rather than a stale
      # target/ served under the old one.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          key: ${{ matrix.target }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST GGML ORT

      # The shipping profile: fat LTO, panic=abort, stripped. See the
      # workspace Cargo.toml for what each knob costs.
      #
      # Bash on every platform, teed to a log: raw job logs need a login to
      # read, but the step summary is public - so on failure the tail of the
      # build goes there, and a red run explains itself to anyone.
      - name: Build
        # An Intel Mac runner is the slow one: its release build ran past
        # sixty minutes in v0.2.7-rc.1.
        timeout-minutes: ${{ matrix.platform == 'macos' && matrix.arch == 'x86_64' && 100 || 60 }}
        shell: bash
        working-directory: src
        run: |
          set -o pipefail
          cargo build --profile app -p concat --target ${{ matrix.target }} 2>&1 | tee build.log

      - name: Build log to the summary (failure only)
        if: failure()
        shell: bash
        run: |
          if [ -f src/build.log ]; then
            {
              echo "### Build failed: ${{ matrix.target }}"
              echo '```'
              tail -n 150 src/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Package: macOS ─────────────────────────────────────────────────
      # An .app bundle: the binary, an icon set made from the repository's
      # PNGs, an Info.plist, and every FFmpeg dylib the binary loads copied
      # into Frameworks with its load path rewritten, so the bundle depends
      # on nothing installed.
      - name: Bundle (macOS)
        if: matrix.platform == 'macos'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app=Concat.app
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Frameworks"
          cp "src/target/${{ matrix.target }}/app/concat" "$app/Contents/MacOS/concat"

          # The icon set Apple wants: each size and its @2x twin.
          iconset=Concat.iconset
          rm -rf "$iconset"; mkdir "$iconset"
          icons=assets/icons
          cp "$icons/concat_logo_16.png"  "$iconset/icon_16x16.png"
          cp "$icons/concat_logo_32.png"  "$iconset/icon_16x16@2x.png"
          cp "$icons/concat_logo_32.png"  "$iconset/icon_32x32.png"
          cp "$icons/concat_logo_64.png"  "$iconset/icon_32x32@2x.png"
          cp "$icons/concat_logo_128.png" "$iconset/icon_128x128.png"
          cp "$icons/concat_logo_256.png" "$iconset/icon_128x128@2x.png"
          cp "$icons/concat_logo_256.png" "$iconset/icon_256x256.png"
          cp "$icons/concat_logo_512.png" "$iconset/icon_256x256@2x.png"
          cp "$icons/concat_logo_512.png" "$iconset/icon_512x512.png"
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Concat.icns"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Concat</string>
            <key>CFBundleDisplayName</key><string>Concat</string>
            <key>CFBundleIdentifier</key><string>app.concat.editor</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>concat</string>
            <key>CFBundleIconFile</key><string>Concat</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>${MACOSX_DEPLOYMENT_TARGET}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.video</string>
            <key>NSHumanReadableCopyright</key><string>AGPL-3.0-or-later. See THIRD_PARTY_NOTICES.md.</string>
            <key>NSMicrophoneUsageDescription</key><string>Concat records voiceovers from your microphone.</string>
          </dict>
          </plist>
          PLIST

          # Every non-system dylib the binary (and those dylibs) load, copied
          # in and re-pointed at @executable_path/../Frameworks.
          dylibbundler -od -b \
            -x "$app/Contents/MacOS/concat" \
            -d "$app/Contents/Frameworks" \
            -p @executable_path/../Frameworks

          # Nothing outside the bundle may remain: a load path into
          # Homebrew would break on a Mac without it.
          if otool -L "$app/Contents/MacOS/concat" | grep -E '/opt/homebrew|/usr/local' ; then
            echo "the binary still loads libraries from outside the bundle" >&2
            exit 1
          fi

          # ONNX Runtime is never linked at launch: on an Intel Mac it is
          # loaded at first use from Frameworks, under the name the app
          # looks for (concat-vision's onnx.rs), and on Apple silicon it is
          # inside the binary. A link here is #333 back: the app closing at
          # launch on every macOS older than the runtime.
          if otool -L "$app/Contents/MacOS/concat" | grep libonnxruntime ; then
            echo "the binary links ONNX Runtime at launch" >&2
            exit 1
          fi
          lazy=()
          if [ -n "${ORT_MAC_DYLIB:-}" ]; then
            cp "$ORT_MAC_DYLIB" "$app/Contents/Frameworks/libonnxruntime.dylib"
            lazy=(--lazy Contents/Frameworks/libonnxruntime.dylib)
          fi

          # Every library in the bundle against the floor it declares. A
          # warning for now: Homebrew's FFmpeg is built for the runner's
          # macOS, so every Mac bundle has some until FFmpeg is built here
          # for the floor. ONNX Runtime is listed apart, with the macOS it
          # needs: the app reads that same field before loading it, and on
          # an older one the AI features say so instead.
          scripts/ci/check-min-os.sh "$app" "$MACOSX_DEPLOYMENT_TARGET" ${lazy[@]+"${lazy[@]}"}

      # Signed with the repository's Developer ID when it has one, and
      # notarised so Gatekeeper opens it without a warning; ad-hoc signed
      # otherwise, which is what a fork's build gets. Either way the
      # bundle carries a signature, which macOS insists on for arm64.
      - name: Sign and notarise (macOS)
        if: matrix.platform == 'macos'
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app=Concat.app
          dmg="Concat-${VERSION}-macos-${{ matrix.arch }}.dmg"
          if [ -n "${CERT_P12}" ] && [ -n "${IDENTITY}" ]; then
            keychain=$RUNNER_TEMP/signing.keychain-db
            echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
            security list-keychains -d user -s "$keychain" login.keychain-db
            # Frameworks first, then the executable, then the bundle: each
            # signature covers what is beneath it.
            find "$app/Contents/Frameworks" -name '*.dylib' -exec \
              codesign --force --options runtime --timestamp -s "$IDENTITY" {} \;
            # The hardened runtime keeps the microphone shut unless the app
            # says it records: the voiceover.
            entitlements="$RUNNER_TEMP/concat.entitlements"
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict><key>com.apple.security.device.audio-input</key><true/></dict></plist>' \
              > "$entitlements"
            codesign --force --options runtime --timestamp --entitlements "$entitlements" -s "$IDENTITY" "$app/Contents/MacOS/concat"
            codesign --force --options runtime --timestamp --entitlements "$entitlements" -s "$IDENTITY" "$app"
            codesign --verify --deep --strict "$app"
          else
            echo "No signing identity: ad-hoc signing."
            codesign --force --deep -s - "$app"
          fi

          hdiutil create -volname Concat -srcfolder "$app" -ov -format UDZO "$dmg"

          if [ -n "${APPLE_ID}" ] && [ -n "${TEAM_ID}" ] && [ -n "${APP_PASSWORD}" ] && [ -n "${IDENTITY}" ]; then
            codesign --force --timestamp -s "$IDENTITY" "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
              --password "$APP_PASSWORD" --wait
            xcrun stapler staple "$dmg"
          fi
          mkdir -p stage && mv "$dmg" stage/

      # The bundle that went into the .dmg, launched: its signature holds,
      # nothing in it loads from Homebrew, and `--version` and `--smoke`
      # exit 0. See scripts/ci/smoke-macos.sh.
      - name: Smoke test (macOS)
        if: matrix.platform == 'macos'
        timeout-minutes: 10
        run: scripts/ci/smoke-macos.sh Concat.app

      # ── Package: Linux ─────────────────────────────────────────────────
      # The binary, the FFmpeg runtime libraries it loads from lib/ beside
      # it (the rpath above), a desktop entry and an icon, in one folder.
      - name: Stage (Linux)
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="Concat-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "stage/$name/lib"
          cp "src/target/${{ matrix.target }}/app/concat" "stage/$name/concat"
          cp -a ffmpeg-dev/lib/*.so* "stage/$name/lib/"
          cp -a "$ORT_DIR"/lib/libonnxruntime.so* "stage/$name/lib/"
          # whisper's shared libraries and its CPU modules, one per x86_64
          # generation (the job's `env` says why), from where whisper-rs-sys
          # installed them: libraries in lib/, modules in bin/. Its build
          # also copies them beside the binary, for `cargo run`, but a build
          # the cache satisfied does not run that script again, and the
          # cache does not promise to keep loose files at the top of a
          # profile. In lib/ the rpath finds the libraries and
          # concat-speech's `cpu_backend` the modules.
          if [ "${{ matrix.ggml }}" = variants ]; then
            out=$(ls -dt "src/target/${{ matrix.target }}/app/build"/whisper-rs-sys-*/out/bin | head -1)
            out=${out%/bin}
            echo "whisper's build: $out"
            cp -a "$out"/lib*/libwhisper.so* "$out"/lib*/libggml*.so* "$out"/bin/libggml-cpu-*.so "stage/$name/lib/"
            for module in x64 sandybridge haswell; do
              test -f "stage/$name/lib/libggml-cpu-$module.so" \
                || { echo "libggml-cpu-$module.so is missing from the build" >&2; exit 1; }
            done
          fi
          cp assets/icons/concat_logo_256.png "stage/$name/concat.png"
          cat > "stage/$name/concat.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Concat
          Comment=Video editor
          Exec=concat
          Icon=concat
          Categories=AudioVideo;Video;
          Terminal=false
          StartupWMClass=concat
          DESKTOP
          cp LICENSE THIRD_PARTY_NOTICES.md "stage/$name/"
          # The binary must resolve every library from the folder alone.
          # The whole ldd report goes to the public summary when it does
          # not, so the failure names the library instead of just a step.
          report=$(env -u LD_LIBRARY_PATH ldd "stage/$name/concat" || true)
          if grep -i 'not found' <<<"$report"; then
            {
              echo "### Unresolved libraries: ${{ matrix.target }}"
              echo '```'
              echo "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$report"
            echo "the binary does not resolve every library from its own folder" >&2
            exit 1
          fi

      # The staged folder, launched on this machine with nothing but the
      # system and the folder to load from: `--version`, then `--smoke`
      # under Xvfb with every file it opens traced, so a start-up that so
      # much as reaches for CUDA or NVENC fails. On x86_64, `--version`
      # again under Intel's emulator posing as an Ivy Bridge. See
      # scripts/ci/smoke-linux.sh.
      - name: Smoke test (Linux)
        if: matrix.platform == 'linux'
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb xauth strace libgl1-mesa-dri mesa-vulkan-drivers
          args=()
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            scripts/ci/fetch.sh sde-lin sde.tar.xz
            mkdir -p sde
            tar -xJf sde.tar.xz -C sde --strip-components=1
            args+=(--sde "$PWD/sde/sde64")
          fi
          scripts/ci/smoke-linux.sh "${args[@]}" "stage/Concat-${VERSION}-linux-${{ matrix.arch }}"

      # Every x86_64 binary in the folder, disassembled and counted for
      # instructions an Ivy Bridge does not have, against what
      # scripts/ci/isa-allow.txt allows each one. See scripts/ci/isa-scan.sh.
      - name: Instruction-set scan (Linux x86_64)
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get install -y llvm
          scripts/ci/isa-scan.sh "stage/Concat-${VERSION}-linux-${{ matrix.arch }}"

      # Arch Linux package, from the same folder as the .deb and .rpm.
      # Arch ships x86_64 only, so aarch64 comes from Arch Linux ARM.
      - name: Package (Arch Linux)
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="Concat-${VERSION}-linux-${{ matrix.arch }}"
          pkgver="${VERSION//-/_}"
          image=archlinux:base-devel
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            image=menci/archlinuxarm:base-devel
          fi

          work="$PWD/arch"
          rm -rf "$work"
          mkdir -p "$work"
          cp assets/arch/PKGBUILD "$work/PKGBUILD"
          cp -a "stage/$name" "$work/stage"

          cat > "$work/build.sh" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          owner=$(stat -c '%u:%g' /pkg)
          useradd -m builder
          chown -R builder:builder /pkg
          # PKGEXT named outright: Arch Linux ARM's makepkg.conf still
          # writes .pkg.tar.xz where Arch's writes .pkg.tar.zst, and the
          # move below wants one name from both images.
          su builder -c "env CONCAT_VERSION='$CONCAT_VERSION' CONCAT_STAGE=/pkg/stage PKGDEST=/pkg PKGEXT=.pkg.tar.zst makepkg --noconfirm --nodeps"
          chown -R "$owner" /pkg
          SCRIPT
          chmod 755 "$work/build.sh"

          docker run --rm --env CONCAT_VERSION="$pkgver" \
            -v "$work:/pkg" -w /pkg "$image" /pkg/build.sh

          mv "$work"/concat-*.pkg.tar.zst "stage/$name.pkg.tar.zst"
          rm -rf "$work"
          ls -l stage

      # The folder three ways. A .deb and an .rpm, from one description in
      # assets/linux/nfpm.yaml: the program whole under /opt/concat, a
      # launcher on the path, a desktop entry and an icon. And an AppImage:
      # the folder as an AppDir, one file that runs on any distribution
      # with the toolkit installed, which every desktop has. All three from
      # the one staged folder, so they ship the same files - see issue #83.
      - name: Package (Linux)
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NFPM_ARCH: ${{ matrix.nfpm }}
          ARCH: ${{ matrix.appimage }}
        run: |
          set -euo pipefail
          name="Concat-${VERSION}-linux-${{ matrix.arch }}"
          export STAGE="$PWD/stage/$name"

          # What the packages add over the folder: the launcher, and a
          # desktop entry that names the program by its installed path.
          mkdir -p "$STAGE/pkg"
          printf '#!/bin/sh\nexec /opt/concat/concat "$@"\n' > "$STAGE/pkg/concat"
          chmod +x "$STAGE/pkg/concat"
          sed 's|^Exec=concat|Exec=/opt/concat/concat %U|' "$STAGE/concat.desktop" > "$STAGE/pkg/concat.desktop"

          scripts/ci/fetch.sh "nfpm-$( [ "${{ matrix.arch }}" = x86_64 ] && echo x86_64 || echo arm64 )" nfpm.tar.gz
          mkdir -p nfpm && tar -xzf nfpm.tar.gz -C nfpm
          # From inside the folder: nfpm names files relative to where it
          # runs, and expands no variables in their paths.
          for kind in deb rpm; do
            (cd "$STAGE" && "$OLDPWD/nfpm/nfpm" package -f "$OLDPWD/assets/linux/nfpm.yaml" -p "$kind" -t "$OLDPWD/stage/$name.$kind")
          done
          rm -r "$STAGE/pkg"

          # The AppDir: the binary and its lib/ under usr/bin, so the
          # rpath holds; the desktop entry and icon at the root, where
          # the tool wants them; AppRun is the binary.
          appdir="$PWD/Concat.AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/icons/hicolor/256x256/apps" "$appdir/usr/share/applications"
          cp "$STAGE/concat" "$appdir/usr/bin/concat"
          cp -a "$STAGE/lib" "$appdir/usr/bin/lib"
          # The X11 keyboard library the window opens by name at start, the
          # core library under it, and the xcb extension under that: a machine
          # without them panicked before showing a window, which is how the
          # AppImage catalog's test saw it. Beside the binary, the rpath finds
          # them, and an rpath on the binary covers every library the process
          # loads, not only its own.
          #
          # The core library comes too because the two are one build, and a
          # distribution pins them to each other ("libxkbcommon(x86-64) =
          # 1.13.1-2.fc44" on Fedora 44): this runner's 1.4.0 module left to
          # drive the host's 1.13.1 core segfaults in xkb_state_update_derived
          # as the X11 window opens (#379).
          for lib in libxkbcommon.so.0 libxkbcommon-x11.so.0 libxcb-xkb.so.1; do
            cp -L "$(ldconfig -p | awk -v lib="$lib" '$1 == lib { print $NF; exit }')" "$appdir/usr/bin/lib/$lib"
          done
          cp "$STAGE/concat.desktop" "$appdir/concat.desktop"
          cp "$STAGE/concat.desktop" "$appdir/usr/share/applications/concat.desktop"
          cp "$STAGE/concat.png" "$appdir/concat.png"
          cp "$STAGE/concat.png" "$appdir/usr/share/icons/hicolor/256x256/apps/concat.png"
          ln -s concat.png "$appdir/.DirIcon"
          ln -s usr/bin/concat "$appdir/AppRun"
          # The tool and the runtime it puts at the head of the AppImage,
          # both a named release: left to itself the tool downloads the
          # runtime's `continuous` build as it runs.
          scripts/ci/fetch.sh "appimagetool-$ARCH" appimagetool
          scripts/ci/fetch.sh "appimage-runtime-$ARCH" appimage-runtime
          chmod +x appimagetool
          # Extract-and-run: the runner has no FUSE to mount the tool with.
          # No "linux" in its name: every AppImage is for Linux, and the
          # AppImage catalog's check warns about names that say so.
          appimage="stage/Concat-${VERSION}-${{ matrix.arch }}.AppImage"
          ./appimagetool --appimage-extract-and-run --runtime-file appimage-runtime "$appdir" "$appimage"
          chmod +x "$appimage"

          rm -r "$STAGE" "$appdir"
          ls -l stage

      # The .deb and the AppImage in two clean distributions, the oldest
      # and a Debian: apt installs the .deb with exactly the dependencies it
      # declares, and both start (`--version`, and `--smoke` under Xvfb).
      # A library the package forgot to depend on fails here rather than
      # on somebody's machine. See scripts/ci/smoke-linux.sh.
      - name: Smoke test in clean distributions (Linux)
        if: matrix.platform == 'linux'
        timeout-minutes: 25
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for image in ubuntu:22.04 debian:12; do
            scripts/ci/smoke-linux.sh --container "$image" \
              "stage/Concat-${VERSION}-linux-${{ matrix.arch }}.deb" \
              "stage/Concat-${VERSION}-${{ matrix.arch }}.AppImage"
          done

      # ── Package: Windows ───────────────────────────────────────────────
      # The folder the installers are made from: the program, FFmpeg's
      # DLLs, sherpa-onnx's, ONNX Runtime's (one runtime for both; see its
      # step above) and the Visual C++ runtime the program and its DLLs
      # import. The C++ runtime is copied in from Visual Studio's
      # redistributable folder, as Microsoft allows: a clean Windows does
      # not have it, and a machine that does may have an older one.
      - name: Stage (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "Concat-$env:VERSION-windows-${{ matrix.arch }}"
          $dir = "stage\$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "src\target\${{ matrix.target }}\app\concat.exe" $dir
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $dir
          # The sherpa-onnx runtime, set aside by the download step above.
          Copy-Item "$env:SHERPA_DLL_DIR\*.dll" $dir
          Copy-Item "$env:ORT_DIR\lib\*.dll" $dir
          # whisper's DLLs and its CPU modules, one per x86_64 generation
          # (the job's `env` says why), from the bin\ whisper-rs-sys
          # installed them to; see the Linux stage for why not from beside
          # the program. Beside concat.exe Windows finds the DLLs and
          # concat-speech's `cpu_backend` the modules.
          if ("${{ matrix.ggml }}" -eq "variants") {
            $built = Get-ChildItem "src\target\${{ matrix.target }}\app\build\whisper-rs-sys-*\out\bin\ggml-cpu-x64.dll" |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $built) { throw "whisper-rs-sys installed no ggml-cpu-x64.dll" }
            Write-Host "whisper's build: $($built.DirectoryName)"
            Copy-Item "$($built.DirectoryName)\whisper.dll", "$($built.DirectoryName)\ggml*.dll" $dir
            foreach ($module in "x64", "sandybridge", "haswell") {
              if (-not (Test-Path "$dir\ggml-cpu-$module.dll")) { throw "ggml-cpu-$module.dll is missing from the build" }
            }
          }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $dir
          # The Visual C++ runtime DLLs anything in the folder imports, from
          # the newest redistributable folder Visual Studio carries.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\${{ matrix.vc }}\Microsoft.VC14*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "no Visual C++ redistributable folder for ${{ matrix.vc }} under $vs" }
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe" | Select-Object -First 1
          # Twice over: msvcp140.dll, once copied, imports vcruntime140.dll.
          foreach ($pass in 1, 2) {
            foreach ($pe in Get-ChildItem $dir -File -Include *.exe, *.dll -Recurse) {
              foreach ($line in & $dumpbin /nologo /dependents $pe.FullName) {
                $dll = $line.Trim()
                if ($dll -match "\.dll$" -and (Test-Path "$($crt.FullName)\$dll") -and -not (Test-Path "$dir\$dll")) {
                  Write-Host "$($pe.Name) imports $dll; copying it from $($crt.FullName)"
                  Copy-Item "$($crt.FullName)\$dll" $dir
                }
              }
            }
          }
          Get-ChildItem $dir | Format-Table Name, Length

      # Authenticode, with the repository's certificate when it has one:
      # every program and DLL in the folder that does not already carry a
      # valid signature (Microsoft's ONNX Runtime does, and keeps it), here,
      # and the installers in the step after the checks. Unsigned files
      # are what Smart App Control refuses to load ("Bad Image", 0xc0e90002,
      # #306, #311), and an unsigned DLL is refused even beside a signed
      # program. SmartScreen and the UAC prompt name the publisher instead
      # of warning about an unknown one. A fork's build is unsigned.
      #
      # The certificate is imported into the user's store and signtool is
      # told its thumbprint, so the password never reaches a command line:
      # it goes from the environment to the import as a SecureString. The
      # store is emptied of it again in the last step, whatever happens.
      - name: Sign (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CERT_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:CERT_PFX) {
            Write-Host "No signing certificate: the build is unsigned."
            exit 0
          }
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $password = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]"UserKeySet, PersistKeySet"
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $password, $flags)
          Remove-Item -Force $pfx
          if (-not $cert.HasPrivateKey) { throw "the certificate came in without its private key" }
          $store = [Security.Cryptography.X509Certificates.X509Store]::new("My", "CurrentUser")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe is not in the Windows SDK" }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          $dir = "stage\Concat-$env:VERSION-windows-${{ matrix.arch }}"
          $unsigned = Get-ChildItem $dir -Recurse -File -Include *.exe, *.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne "Valid" }
          foreach ($file in $unsigned) {
            & $signtool.FullName sign /sha1 $cert.Thumbprint /s My /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 /d Concat $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $($file.Name)" }
          }
          Write-Host "Signed $(@($unsigned).Count) files."

      # The staged folder, launched before any installer is made of it:
      # every DLL it imports is in it or is Windows' own; `--version` and
      # `--smoke` exit 0 with only Windows on the path; and on x86_64,
      # `--version` again under Intel's emulator posing as an Ivy Bridge
      # (#313). See scripts/ci/smoke-windows.ps1.
      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        timeout-minutes: 15
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/ci/smoke-windows.ps1 -Bundle "stage\Concat-$env:VERSION-windows-${{ matrix.arch }}"

      # The same, then `--version` under Intel's emulator posing as an Ivy
      # Bridge (#313). A step of its own, after the plain smoke test: in
      # v0.2.7-rc.1 one step did both, sat silent for its fifteen minutes
      # and said nothing about the bundle, stuck before its first line -
      # most likely in Windows' tar over SDE's .tar.xz. 7-Zip, which the
      # runner has, unpacks it here, and each stage says when it starts.
      - name: Smoke test on an emulated Ivy Bridge (Windows x86_64)
        if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
        timeout-minutes: 30
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "downloading SDE"
          & "$env:ProgramFiles\Git\bin\bash.exe" scripts/ci/fetch.sh sde-win sde.tar.xz
          if ($LASTEXITCODE -ne 0) { throw "the SDE download failed" }
          Write-Host "unpacking SDE"
          $7z = "$env:ProgramFiles\7-Zip\7z.exe"
          & $7z x -y sde.tar.xz | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "unpacking sde.tar.xz failed" }
          & $7z x -y -osde sde.tar | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "unpacking sde.tar failed" }
          $sde = (Get-ChildItem sde -Recurse -Filter sde.exe | Select-Object -First 1).FullName
          if (-not $sde) { throw "sde.exe is not in the archive" }
          Write-Host "SDE at $sde"
          scripts/ci/smoke-windows.ps1 -Bundle "stage\Concat-$env:VERSION-windows-x86_64" -Sde $sde

      # Every x86_64 binary in the folder, disassembled and counted for
      # instructions an Ivy Bridge does not have, against what
      # scripts/ci/isa-allow.txt allows each one. See scripts/ci/isa-scan.sh.
      - name: Instruction-set scan (Windows x86_64)
        if: matrix.platform == 'windows' && matrix.arch == 'x86_64'
        timeout-minutes: 15
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # llvm-objdump from the LLVM installed above, on the path.
        run: scripts/ci/isa-scan.sh "stage/Concat-${VERSION}-windows-${{ matrix.arch }}"

      # The installers, from the checked folder: Inno Setup's .exe and
      # WiX's .msi, each signed when the folder was.
      - name: Installers (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "Concat-$env:VERSION-windows-${{ matrix.arch }}"
          function Sign($file) {
            if (-not $env:SIGNING_THUMBPRINT) { return }
            & $env:SIGNTOOL sign /sha1 $env:SIGNING_THUMBPRINT /s My /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 /d Concat $file
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $file" }
          }
          # The installer, from that folder: Inno Setup, which the x64
          # image carries and the ARM image is given. See
          # assets/windows/concat.iss.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Installing Inno Setup"
            choco install innosetup --no-progress -y | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is not at $iscc" }
          & $iscc "/DVersion=$env:VERSION" "/DArch=${{ matrix.inno }}" "/DSuffix=${{ matrix.arch }}" `
            "/DStage=$PWD\stage\$name" "/DOut=$PWD\stage" assets\windows\concat.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }
          if (-not (Test-Path "stage\$name-setup.exe")) { throw "stage\$name-setup.exe is not there" }
          Sign "stage\$name-setup.exe"
          # And the .msi, with WiX, for the machines an administrator
          # deploys to. See assets/windows/concat.wxs.
          dotnet tool install --global wix --version $env:WIX_VERSION | Out-Null
          # No .wixpdb: everything in stage/ is published, and a debug
          # database for the installer is nothing a release should carry.
          wix build -arch ${{ matrix.wix }} -pdbtype none "-d" "Version=$env:VERSION" "-d" "Root=$PWD" "-d" "Stage=$PWD\stage\$name" `
            -o "stage\$name.msi" assets\windows\concat.wxs
          if ($LASTEXITCODE -ne 0) { throw "WiX failed with $LASTEXITCODE" }
          if (-not (Test-Path "stage\$name.msi")) { throw "stage\$name.msi is not there" }
          Sign "stage\$name.msi"
          # The folder itself is not published: the two installers are.
          Remove-Item -Recurse -Force "stage\$name"

      # The signing certificate out of the user's store again, whether the
      # steps above passed or not.
      - name: Forget the certificate (Windows)
        if: always() && matrix.platform == 'windows' && env.SIGNING_THUMBPRINT != ''
        shell: pwsh
        run: Remove-Item -Force -DeleteKey "Cert:\CurrentUser\My\$env:SIGNING_THUMBPRINT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Concat-${{ matrix.platform }}-${{ matrix.arch }}
          path: stage/*
          if-no-files-found: error
