name: Build app

# Builds Concat - the Slint window, `engine/crates/concat` - for macOS,
# Windows and Linux, and uploads each as an artifact named Concat-<platform>.
#
# Reusable: ci.yml calls it on every push to main, release.yml on every tag.
# It is the one place the build environment is described:
#
# - The engine links FFmpeg and compiles whisper.cpp in, so a build needs the
#   FFmpeg 7+ development libraries (headers and import libraries), cmake, a
#   C++ toolchain and libclang for bindgen. Nothing is staged beside the
#   binary any more.
# - Homebrew's FFmpeg serves on macOS. Windows and Linux use a BtbN `shared`
#   build, which ships headers, import libraries and the runtime libraries
#   together; FFMPEG_DIR tells the bindings where it is, and the runtime
#   libraries travel with the binary in the artifact.
on:
  workflow_call:

env:
  # BtbN's autobuilds: GPL (x264 in), shared, FFmpeg 8.1.
  FFMPEG_LINUX: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1.tar.xz
  FFMPEG_WINDOWS: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip

jobs:
  app:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          # 22.04, not latest: the binary links the build machine's glibc,
          # so the oldest supported runner is what keeps it runnable on
          # older distributions.
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # Slint's Skia renderer links fontconfig and freetype; cpal links
      # ALSA; bindgen needs libclang; whisper.cpp is built by cmake.
      - name: System libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libclang-dev cmake

      # Ubuntu's packaged FFmpeg is older than the 7 the engine needs.
      - name: FFmpeg development libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.tar.xz "$FFMPEG_LINUX"
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib" >> "$GITHUB_ENV"

      - name: FFmpeg development libraries (macOS)
        if: matrix.platform == 'macos'
        run: brew install ffmpeg cmake

      # LLVM from chocolatey provides libclang. The BtbN zip unpacks to one
      # top-level folder.
      - name: FFmpeg development libraries (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          curl.exe -fsSL --retry 5 --retry-all-errors -o ffmpeg-win.zip "$env:FFMPEG_WINDOWS"
          Expand-Archive ffmpeg-win.zip -DestinationPath ffdl
          $dir = (Get-ChildItem ffdl -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # The shipping profile: fat LTO, panic=abort, stripped. See the
      # workspace Cargo.toml for what each knob costs.
      - run: cargo build --profile app -p concat
        working-directory: engine

      # The binary, plus the FFmpeg runtime libraries it loads where those
      # are not the system's.
      - name: Stage (unix)
        if: matrix.platform != 'windows'
        run: |
          set -euo pipefail
          mkdir -p stage
          cp engine/target/app/concat stage/
          if [ -d ffmpeg-dev/lib ]; then
            mkdir -p stage/lib
            cp -a ffmpeg-dev/lib/*.so* stage/lib/
          fi
      - name: Stage (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item engine/target/app/concat.exe stage/
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" stage/

      - uses: actions/upload-artifact@v7
        with:
          name: Concat-${{ matrix.platform }}
          path: stage
          if-no-files-found: error
