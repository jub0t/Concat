name: Build FFmpeg

# Builds the cut-down FFmpeg that Concat ships.
#
# Run by hand, not on every push. The output only changes when the version or
# the feature list below changes, which is roughly never - so this produces an
# artifact you download once and commit to the release, rather than something
# that runs on your time.
#
# Why not build locally: the reduced build takes 20-35 minutes on a 4-core
# machine, and most of that is `configure` spawning thousands of tiny probes,
# which Windows is bad at. Here it runs while you do something else, and the
# exact source and configure line are recorded in the log.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "FFmpeg release tag (e.g. n8.1.2)"
        required: true
        default: "n8.1.2"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # nasm is not optional: without it the x86 assembly is skipped and
          # decoding runs several times slower.
          install: >-
            base-devel
            git
            diffutils
            make
            pkgconf
            nasm
            yasm
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-x264

      - name: Fetch FFmpeg source
        run: |
          git clone --depth 1 --branch "${{ inputs.version }}" \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg && git rev-parse HEAD > ../SOURCE-COMMIT.txt

      - name: Configure
        run: |
          cd ffmpeg
          #
          # Everything off, then only what Concat actually invokes turned back
          # on. This is where the size comes from: a full avcodec carries some
          # five hundred codecs, and an editor opens perhaps a dozen.
          #
          # If you add a format to the app, add it here too - the failure mode
          # is "could not open", not a crash.
          #
          # `--extra-ldflags=-static` is what makes the result portable. Without
          # it the exes link against the MSYS2 libx264/zlib/winpthread DLLs and
          # run only on the machine that built them.
          #
          # `--enable-zlib` is not optional under --disable-autodetect: that
          # flag turns off every external library that was not named, and PNG
          # silently stops working without zlib.
          #
          # `rawvideo` (decoder *and* encoder) is what the exporter pipes: see
          # concat-media/src/encode.rs, which feeds frames in as
          # `-f rawvideo -pix_fmt rgba -i -`. Enabling only the demuxer of that
          # name is not enough, and the failure reads as "no decoder found".
          ./configure \
            --prefix=../out \
            --pkg-config-flags=--static \
            --extra-ldflags=-static \
            --disable-everything \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-autodetect \
            --disable-ffplay \
            --disable-shared \
            --enable-static \
            --enable-small \
            --enable-gpl \
            --enable-libx264 \
            --enable-zlib \
            --enable-decoder=rawvideo,h264,hevc,vp8,vp9,av1,mpeg4,mjpeg,prores,dnxhd,png,webp,bmp,tiff,gif,aac,mp3,flac,opus,vorbis,alac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le \
            --enable-encoder=rawvideo,libx264,aac,mjpeg,png,pcm_s16le \
            --enable-demuxer=mov,matroska,avi,mp3,wav,flac,ogg,aac,image2,gif,rawvideo,pcm_s16le,concat \
            --enable-muxer=mp4,mov,mp3,wav,ipod,mjpeg,image2,rawvideo,pcm_s16le,null \
            --enable-parser=h264,hevc,vp8,vp9,av1,aac,mpegaudio,flac,vorbis,png,mjpeg \
            --enable-bsf=h264_mp4toannexb,hevc_mp4toannexb,aac_adtstoasc \
            --enable-protocol=file,pipe \
            --enable-filter=scale,tile,fps,format,null,copy,setpts,trim,transpose,crop,overlay \
            --enable-filter=fade,hue,colorchannelmixer,negate,unsharp,gblur,boxblur,colortemperature \
            --enable-filter=vibrance,eq,vignette,noise,lutrgb,pixelize,lenscorrection \
            --enable-filter=split,blend,hstack,hflip \
            --enable-filter=aresample,asetrate,atempo,aformat,anull,atrim,asetpts,adelay,amix,apad,afade,volume \
            --enable-filter=highpass,lowpass,equalizer,bass,treble,compand,deesser,aecho,alimiter,aphaser,flanger \
            --enable-filter=abuffer,abuffersink,buffer,buffersink

      - name: Build
        run: cd ffmpeg && make -j"$(nproc)" && make install

      - name: Verify it can do the work
        run: |
          set -e
          BIN=out/bin
          "$BIN/ffmpeg.exe" -hide_banner -version | head -1
          "$BIN/ffprobe.exe" -hide_banner -version | head -1

          # Not a smoke test of the binary - a check that the *feature list*
          # above is sufficient. Each of these mirrors something the app does.
          #
          # Fixtures are raw bytes rather than `-f lavfi -i testsrc2=...`,
          # because lavfi lives in libavdevice and --disable-everything removes
          # it. A verify step built on lavfi fails at its first line on a build
          # that is in fact perfectly good - which reads as "the build is
          # broken" and hides whatever the real gaps were.
          head -c 9216000 /dev/zero > frames.raw   # 30 frames of 320x240 rgba
          head -c 384000  /dev/zero > tone.pcm     # 2s of 48k stereo s16

          # Picture: exactly how concat-media/src/encode.rs drives the exporter.
          "$BIN/ffmpeg.exe" -hide_banner -loglevel error -y \
            -f rawvideo -pix_fmt rgba -s 320x240 -r 30 -i frames.raw \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
            -movflags +faststart probe.mp4
          "$BIN/ffprobe.exe" -v error -show_streams -show_format -of json probe.mp4 > /dev/null
          "$BIN/ffmpeg.exe" -hide_banner -loglevel error -y -i probe.mp4 \
            -vf "fps=4,scale=-2:72,tile=4x1" -frames:v 1 -f mjpeg strip.jpg
          "$BIN/ffmpeg.exe" -hide_banner -loglevel error -y -i probe.mp4 \
            -f rawvideo -pix_fmt rgba - > /dev/null

          # Stills - this is the path that silently died without zlib.
          "$BIN/ffmpeg.exe" -hide_banner -loglevel error -y -i probe.mp4 -frames:v 1 still.png
          "$BIN/ffmpeg.exe" -hide_banner -loglevel error -y -i still.png \
            -frames:v 1 -f rawvideo -pix_fmt rgba - > /dev/null

          # Sound: the preview render, then the full export mix and mux.
          "$BIN/ffmpeg.exe" -hide_banner -loglevel error -y \
            -f s16le -ar 48000 -ac 2 -i tone.pcm -c:a aac tone.m4a

          # The playback engine's decode: a clip span straight to raw PCM.
          # See desktop/src-tauri/src/playback.rs - this needs the pcm_s16le
          # *muxer*, easy to forget because the demuxer of the same name is
          # enabled for a different reason.
          "$BIN/ffmpeg.exe" -hide_banner -loglevel error -y -ss 0 -t 1 -i tone.m4a -vn \
            -af "aresample=48000,aformat=sample_fmts=s16:channel_layouts=stereo" \
            -f s16le span.pcm
          "$BIN/ffmpeg.exe" -hide_banner -loglevel error -y -i tone.m4a -vn \
            -af "aresample=48000,asetrate=52000,aresample=48000,atempo=0.92,highpass=f=85,equalizer=f=4200:t=q:w=0.8:g=3,compand=attacks=0.01:decays=0.18:points=-80/-80|0/-1.5,deesser=i=0.3,aecho=0.8:0.82:38:0.02,alimiter=limit=0.94,aphaser=type=t:speed=1.2,flanger=delay=2:depth=4,bass=g=5,treble=g=4" \
            -ac 2 -ar 48000 -c:a pcm_s16le -f wav filtered.wav
          "$BIN/ffmpeg.exe" -hide_banner -loglevel error -y -i tone.m4a -i tone.m4a \
            -filter_complex "[0:a]atrim=start=0:duration=1,asetpts=PTS-STARTPTS,volume=1.5,afade=t=in:st=0:d=0.2,adelay=100:all=1[a0];[1:a]atrim=start=0:duration=1,asetpts=PTS-STARTPTS[a1];[a0][a1]amix=inputs=2:normalize=0,apad,atrim=duration=2[out]" \
            -map "[out]" -c:a aac -b:a 192k mix.m4a
          "$BIN/ffmpeg.exe" -hide_banner -loglevel error -y -i probe.mp4 -i mix.m4a \
            -c:v copy -c:a copy -shortest -movflags +faststart final.mp4

          # Portable, or it only runs on the machine that built it.
          if ldd "$BIN/ffmpeg.exe" | grep -iv '/c/windows' | grep -q '=>'; then
            echo "not self-contained:"; ldd "$BIN/ffmpeg.exe" | grep -iv '/c/windows'; exit 1
          fi
          echo "every path the app uses is present, and the build is self-contained"

      - name: Report size
        run: |
          ls -l out/bin
          du -sh out/bin

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ inputs.version }}-win64
          path: |
            out/bin/ffmpeg.exe
            out/bin/ffprobe.exe
            SOURCE-COMMIT.txt
          if-no-files-found: error

  # The macOS half of the trimmed pair, so the build can one day replace the
  # full static downloads in build.yml on both platforms at once. Same
  # configure list as Windows; the differences are only what the platform
  # forces: no `-static` (macOS cannot fully static-link against libSystem),
  # x264 from Homebrew, `otool` instead of `ldd` for the portability check.
  macos:
    runs-on: macos-latest
    steps:
      - name: Tools
        run: brew install nasm x264

      - name: Fetch FFmpeg source
        run: |
          git clone --depth 1 --branch "${{ inputs.version }}" \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg
          cd ffmpeg && git rev-parse HEAD > ../SOURCE-COMMIT.txt

      - name: Configure
        run: |
          cd ffmpeg
          ./configure \
            --prefix=../out \
            --pkg-config-flags=--static \
            --disable-everything \
            --disable-doc \
            --disable-debug \
            --disable-network \
            --disable-autodetect \
            --disable-ffplay \
            --disable-shared \
            --enable-static \
            --enable-small \
            --enable-gpl \
            --enable-libx264 \
            --enable-zlib \
            --enable-decoder=rawvideo,h264,hevc,vp8,vp9,av1,mpeg4,mjpeg,prores,dnxhd,png,webp,bmp,tiff,gif,aac,mp3,flac,opus,vorbis,alac,pcm_s16le,pcm_s24le,pcm_s32le,pcm_f32le \
            --enable-encoder=rawvideo,libx264,aac,mjpeg,png,pcm_s16le \
            --enable-demuxer=mov,matroska,avi,mp3,wav,flac,ogg,aac,image2,gif,rawvideo,pcm_s16le,concat \
            --enable-muxer=mp4,mov,mp3,wav,ipod,mjpeg,image2,rawvideo,pcm_s16le,null \
            --enable-parser=h264,hevc,vp8,vp9,av1,aac,mpegaudio,flac,vorbis,png,mjpeg \
            --enable-bsf=h264_mp4toannexb,hevc_mp4toannexb,aac_adtstoasc \
            --enable-protocol=file,pipe \
            --enable-filter=scale,tile,fps,format,null,copy,setpts,trim,transpose,crop,overlay \
            --enable-filter=fade,hue,colorchannelmixer,negate,unsharp,gblur,boxblur,colortemperature \
            --enable-filter=vibrance,eq,vignette,noise,lutrgb,pixelize,lenscorrection \
            --enable-filter=split,blend,hstack,hflip \
            --enable-filter=aresample,asetrate,atempo,aformat,anull,atrim,asetpts,adelay,amix,apad,afade,volume \
            --enable-filter=highpass,lowpass,equalizer,bass,treble,compand,deesser,aecho,alimiter,aphaser,flanger \
            --enable-filter=abuffer,abuffersink,buffer,buffersink

      - name: Build
        run: cd ffmpeg && make -j"$(sysctl -n hw.ncpu)" && make install

      - name: Verify it can do the work
        run: |
          set -e
          BIN=out/bin
          "$BIN/ffmpeg" -hide_banner -version | head -1
          "$BIN/ffprobe" -hide_banner -version | head -1

          head -c 9216000 /dev/zero > frames.raw
          head -c 384000  /dev/zero > tone.pcm

          "$BIN/ffmpeg" -hide_banner -loglevel error -y \
            -f rawvideo -pix_fmt rgba -s 320x240 -r 30 -i frames.raw \
            -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p \
            -movflags +faststart probe.mp4
          "$BIN/ffprobe" -v error -show_streams -show_format -of json probe.mp4 > /dev/null
          "$BIN/ffmpeg" -hide_banner -loglevel error -y -i probe.mp4 \
            -vf "fps=4,scale=-2:72,tile=4x1" -frames:v 1 -f mjpeg strip.jpg
          "$BIN/ffmpeg" -hide_banner -loglevel error -y -i probe.mp4 \
            -f rawvideo -pix_fmt rgba - > /dev/null
          "$BIN/ffmpeg" -hide_banner -loglevel error -y -i probe.mp4 -frames:v 1 still.png
          "$BIN/ffmpeg" -hide_banner -loglevel error -y -i still.png \
            -frames:v 1 -f rawvideo -pix_fmt rgba - > /dev/null
          "$BIN/ffmpeg" -hide_banner -loglevel error -y \
            -f s16le -ar 48000 -ac 2 -i tone.pcm -c:a aac tone.m4a
          "$BIN/ffmpeg" -hide_banner -loglevel error -y -ss 0 -t 1 -i tone.m4a -vn \
            -af "aresample=48000,aformat=sample_fmts=s16:channel_layouts=stereo" \
            -f s16le span.pcm
          "$BIN/ffmpeg" -hide_banner -loglevel error -y -i tone.m4a -i tone.m4a \
            -filter_complex "[0:a]atrim=start=0:duration=1,asetpts=PTS-STARTPTS,volume=1.5,afade=t=in:st=0:d=0.2,adelay=100:all=1[a0];[1:a]atrim=start=0:duration=1,asetpts=PTS-STARTPTS[a1];[a0][a1]amix=inputs=2:normalize=0,apad,atrim=duration=2[out]" \
            -map "[out]" -c:a aac -b:a 192k mix.m4a
          "$BIN/ffmpeg" -hide_banner -loglevel error -y -i probe.mp4 -i mix.m4a \
            -c:v copy -c:a copy -shortest -movflags +faststart final.mp4

          # Portable means system frameworks only - a Homebrew dylib in this
          # list would bind the binary to the machine that built it.
          if otool -L "$BIN/ffmpeg" | tail -n +2 | grep -v "/usr/lib\|/System/Library"; then
            echo "not self-contained (see above)"; exit 1
          fi
          echo "every path the app uses is present, and the build is self-contained"

      - name: Report size
        run: ls -l out/bin && du -sh out/bin

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ inputs.version }}-macos-arm64
          path: |
            out/bin/ffmpeg
            out/bin/ffprobe
            SOURCE-COMMIT.txt
          if-no-files-found: error
