name: Release

# Pushing a tag that starts with v (v0.3.0, v0.3.0-alpha.1, ...) builds the
# app for every platform and architecture, desktops and phones, and
# publishes a GitHub release under that tag with one bundle per target and
# a checksum file. A tag
# containing a hyphen is a pre-release. The tag must be the workspace's
# version, alone or with a pre-release suffix: a release whose files say
# one number and whose tag says another is a release nobody can reason
# about.
#
# The bundles are self-contained: the macOS .dmg carries its FFmpeg dylibs
# and is notarised when the signing secrets are set; the Linux packages
# (.deb, .rpm, .AppImage, Arch) and the Windows installers carry the
# FFmpeg runtime libraries beside the binary; the Android .apk is signed
# with the repository's key, and the iOS .ipa is signed by the tester on
# the way onto the phone. Nothing is built until CI has passed on the tag,
# and nothing is published until every bundle has been launched where it
# was built: build-app.yml starts each one (`--version`, `--smoke`, and on
# x86_64 under an emulated Ivy Bridge) before it uploads it, and a bundle
# that does not start fails its job, which `publish` needs.
#
# The release is created as a draft. A person looks it over - the notes,
# the files - and publishes it from the Releases page; nothing reaches
# the updater or the downloads page before then.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish, e.g. v0.3.0
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      # The tag a person typed is checked before anything uses it: as the
      # ref to check out, in a script, or in a file name.
      - name: The tag is a version tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag (v1.2.3, or v1.2.3-alpha.1)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The tag comes in through the environment, never pasted into the
      # script: a value in ${{ }} is spliced into the shell's text before
      # bash reads it, so a tag typed into the form by hand could have run
      # as a command.
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          # The tag is the version, or the version with a pre-release
          # suffix: v0.2.1 and v0.2.1-alpha.22 both belong to 0.2.1.
          case "$tag" in
            "v$version" | "v$version-"*) ;;
            *)
              echo "tag $tag does not match src/Cargo.toml version $version" >&2
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The bundles are named for the version, not the tag: v0.2.1 and
          # v0.2.1-alpha.22 both produce Concat-0.2.1-* files.
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The engine's tests and lints, on the tagged commit: a tag on a red
  # tree is not a release. Named, because a run started by hand is on
  # main, and without the tag CI would test main instead.
  engine:
    name: CI
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.check.outputs.tag }}

  # Both builds are told the tag too. Left to themselves they build the
  # ref the run started on, and a run started by hand starts on main:
  # 0.2.6 shipped that way, 35 commits past the tag it was named for.
  build:
    needs: [check, engine]
    uses: ./.github/workflows/build-app.yml
    with:
      ref: ${{ needs.check.outputs.tag }}
    secrets: inherit

  # `sign` is the one thing that puts the repository's Android key into a
  # run; a pull request's build of mobile.yml never gets it.
  phones:
    needs: [check, engine]
    uses: ./.github/workflows/mobile.yml
    with:
      ref: ${{ needs.check.outputs.tag }}
      sign: true
    secrets: inherit

  publish:
    name: Publish release
    needs: [check, build, phones]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bundles
          pattern: Concat-*
          merge-multiple: true

      # The tree the release is cut from: the notes are read out of its
      # history, and the manifest out of its model table.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 0
          path: source

      # One file that says where every other one is: a row per bundle with
      # its size and digest, and a row per model with the mirror it is
      # fetched from. An updater or a package script reads this instead of
      # guessing at asset names. See scripts/models.py.
      - name: Write the manifest
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          python3 source/scripts/models.py release-manifest \
            --version "$VERSION" \
            --tag "$TAG" \
            --bundles bundles \
            --out bundles/manifest.json
          cat bundles/manifest.json

      - name: Checksums
        run: |
          set -euo pipefail
          cd bundles
          ls -l
          sha256sum -- * > SHA256SUMS

      # The notes are the commits since the previous tag; see the script.
      # For a release, the previous tag is the previous release: its own
      # candidates (v0.2.7-rc.2 before v0.2.7) are ancestors too, and from
      # the last of them the notes would be the handful of fixes it took to
      # get the candidate through, not what changed since 0.2.6.
      - name: Write the notes
        id: notes
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          cd source
          tag="$TAG"
          case "$tag" in
            *-*) candidates=() ;;
            *) candidates=(--exclude 'v*-*') ;;
          esac
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${candidates[@]}" "$tag^" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          .github/release-notes.sh "$previous" "$tag" "${tag#v}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # A draft: a person publishes it. See the top of this file.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Concat ${{ needs.check.outputs.tag }}
          draft: true
          prerelease: ${{ contains(needs.check.outputs.tag, '-') }}
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: true
          files: bundles/*
