name: Release

# Pushing a tag that starts with v (v0.3.0, v0.3.0-alpha.1, ...) builds the
# app for every platform and architecture, desktops and phones, and
# publishes a GitHub release under that tag with one bundle per target and
# a checksum file. A tag
# containing a hyphen is a pre-release. The tag must be the workspace's
# version, alone or with a pre-release suffix: a release whose files say
# one number and whose tag says another is a release nobody can reason
# about.
#
# The bundles are self-contained: the macOS .dmg carries its FFmpeg dylibs
# and is notarised when the signing secrets are set; the Linux tarball and
# the Windows zip carry the FFmpeg runtime libraries beside the binary; the
# Android .apk is signed with the repository's key, and the iOS .ipa is
# signed by the tester on the way onto the phone.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish, e.g. v0.3.0
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -1)
          # The tag is the version, or the version with a pre-release
          # suffix: v0.2.1 and v0.2.1-alpha.22 both belong to 0.2.1.
          case "$tag" in
            "v$version" | "v$version-"*) ;;
            *)
              echo "tag $tag does not match engine/Cargo.toml version $version" >&2
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: [check]
    uses: ./.github/workflows/build-app.yml
    secrets: inherit

  phones:
    needs: [check]
    uses: ./.github/workflows/mobile.yml
    secrets: inherit

  publish:
    name: Publish release
    needs: [check, build, phones]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bundles
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd bundles
          ls -l
          sha256sum -- * > SHA256SUMS

      # The notes are the commits since the previous tag; see the script.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 0
          path: source
      - name: Write the notes
        id: notes
        run: |
          set -euo pipefail
          cd source
          tag="${{ needs.check.outputs.tag }}"
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          .github/release-notes.sh "$previous" "$tag" "Concat ${tag#v}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: Concat ${{ needs.check.outputs.tag }}
          prerelease: ${{ contains(needs.check.outputs.tag, '-') }}
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: true
          files: bundles/*
