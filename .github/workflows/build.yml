name: Build App

# Tests the engine and builds Concat - the Slint window, `engine/crates/concat`
# - for macOS, Windows and Linux.
#
# The engine links FFmpeg and compiles whisper.cpp in, so a build needs the
# FFmpeg 7+ development libraries (headers and import libraries), cmake and a
# C++ toolchain - nothing is staged beside the binary any more. Homebrew's
# FFmpeg serves on macOS; Windows and Linux use a BtbN `shared` build, which
# ships headers, import libraries and the runtime libraries together.
#
# - Pushes to main and manual runs: test, build, and upload the binaries as
#   artifacts.
# - Releases: none yet. The Tauri app in desktop/ used to be packaged and
#   published from here; it is deprecated and no longer built. Automatic
#   alpha releases resume once the Slint window is packaged for each
#   platform.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # BtbN's autobuilds: GPL (x264 in), shared, FFmpeg 8.1.
  FFMPEG_LINUX: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-shared-8.1.tar.xz
  FFMPEG_WINDOWS: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip

jobs:
  engine-tests:
    name: Engine tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # Slint's Skia renderer links fontconfig and freetype; cpal links
      # ALSA; bindgen (for the FFmpeg bindings) needs libclang; whisper.cpp
      # is built by cmake.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libasound2-dev libclang-dev cmake

      # Ubuntu's packaged FFmpeg is older than the 7 the engine needs, so the
      # libraries come from BtbN, and FFMPEG_DIR tells the bindings where.
      - name: FFmpeg development libraries
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.tar.xz "$FFMPEG_LINUX"
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib" >> "$GITHUB_ENV"

      - run: cargo test --workspace
        working-directory: engine
      # -D warnings covers rustc lints too (missing_docs among them), so a
      # public item without documentation fails here, not in review.
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: engine

  app:
    name: App (${{ matrix.platform }})
    needs: [engine-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          # 22.04, not latest: the binary links the build machine's glibc,
          # so the oldest supported runner is what keeps it runnable on
          # older distributions.
          - platform: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: System libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libasound2-dev libclang-dev cmake

      - name: FFmpeg development libraries (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.tar.xz "$FFMPEG_LINUX"
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          echo "FFMPEG_DIR=$PWD/ffmpeg-dev" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib" >> "$GITHUB_ENV"

      - name: FFmpeg development libraries (macOS)
        if: matrix.platform == 'macos'
        run: brew install ffmpeg cmake

      # bindgen needs libclang on Windows too; LLVM from chocolatey provides
      # it. The BtbN zip unpacks to one top-level folder.
      - name: FFmpeg development libraries (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          curl.exe -fsSL --retry 5 --retry-all-errors -o ffmpeg-win.zip "$env:FFMPEG_WINDOWS"
          Expand-Archive ffmpeg-win.zip -DestinationPath ffdl
          $dir = (Get-ChildItem ffdl -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$dir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # The shipping profile: fat LTO, panic=abort, stripped. See the
      # workspace Cargo.toml for what each knob costs.
      - run: cargo build --profile app -p concat
        working-directory: engine

      # The binary, plus the FFmpeg runtime libraries it loads on the
      # platforms where those are not the system's.
      - name: Stage the build (unix)
        if: matrix.platform != 'windows'
        run: |
          set -euo pipefail
          mkdir -p stage
          cp engine/target/app/concat stage/
          if [ -d ffmpeg-dev/lib ]; then mkdir -p stage/lib && cp -a ffmpeg-dev/lib/*.so* stage/lib/; fi
      - name: Stage the build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item engine/target/app/concat.exe stage/
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" stage/

      - uses: actions/upload-artifact@v4
        with:
          name: Concat-${{ matrix.platform }}
          path: stage
          if-no-files-found: error
