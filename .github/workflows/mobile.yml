name: Build for phones

# Builds Concat for Android and iOS and uploads one artifact per phone,
# named like the desktop bundles from build-app.yml:
#
#   Android  arm64  -> Concat-<version>-android-arm64.apk
#   iOS      arm64  -> Concat-<version>-ios-arm64.ipa
#
# Reusable, the way build-app.yml is: nightly.yml calls it on every push
# to main and release.yml on every tag, so the nightly and the releases
# carry the phones beside the desktops. Pull requests build here directly.
#
# Phones are cross-compiled - the Android job runs on Linux with the NDK,
# the iOS job on macOS with Xcode - and the two native libraries that
# cannot be fetched prebuilt for a phone are built from source here and
# cached: FFmpeg by engine/scripts/ffmpeg-mobile.sh, with the platform's
# hardware codecs, and whisper.cpp by its crate. sherpa-onnx comes prebuilt
# from k2-fsa through engine/scripts/sherpa-mobile.sh.
#
# engine/scripts/mobile-env.sh is the one description of the build
# environment, here and on a developer's machine.
#
# The APK is signed with the repository's key when ANDROID_KEYSTORE (the
# keystore, base64) and ANDROID_KEYSTORE_PASSWORD are set as secrets, and
# with a key made for the run when they are not. The .ipa is ad-hoc
# signed: a tester signs it with their own Apple ID on the way onto a
# phone (AltStore, Sideloadly, Xcode's Devices window all do this).
on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE:
        description: Base64 of the release keystore
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
  pull_request:
  workflow_dispatch:

# Keyed by the calling workflow too, so a call from the nightly or a
# release never shares a group with a pull request's run. A tag's release
# is never cancelled; everything else is superseded by the next push.
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # ggml compiles to the portable baseline for the architecture, NEON on
  # ARM, rather than to whatever the build machine has.
  GGML_NATIVE: "OFF"

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Concat $version for aarch64-linux-android"
      # The engine pins its toolchain in rust-toolchain.toml, so the phone's
      # standard library is added to that toolchain from inside engine/,
      # where the pin applies.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-linux-android
        working-directory: engine
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-apk

      # The runner image carries the SDK and an NDK; the script finds the
      # newest NDK under the SDK on its own, and the build scripts of
      # whisper.cpp, Skia and Slint's backend each read it by their own
      # name from what mobile-env.sh exports.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      # Restored and saved as two steps rather than one, so the FFmpeg
      # build is kept the moment it finishes, whatever happens to the Rust
      # build after it.
      - name: FFmpeg for Android (cached)
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: engine/vendor/ffmpeg/aarch64-linux-android
          key: ffmpeg-aarch64-linux-android-${{ hashFiles('engine/scripts/ffmpeg-mobile.sh') }}
      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: engine/scripts/ffmpeg-mobile.sh aarch64-linux-android
      - name: FFmpeg for Android (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: engine/vendor/ffmpeg/aarch64-linux-android
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: sherpa-onnx for Android
        run: engine/scripts/sherpa-mobile.sh aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: aarch64-linux-android

      # A release APK has to be signed. With the repository's key it is
      # signed with that, and installs over the store's build; without one
      # it is signed with a key made for the run, which installs on a phone
      # as any sideloaded app does.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keystore=$RUNNER_TEMP/release.keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$keystore"
            password=$KEYSTORE_PASSWORD
          else
            password=concat
            keytool -genkeypair -v -keystore "$keystore" -storepass "$password" -keypass "$password" \
              -alias concat -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Concat, O=Concat" >/dev/null 2>&1
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"

      # The build environment first, then the build under it.
      - name: Build the APK
        working-directory: engine
        run: |
          set -o pipefail
          eval "$(scripts/mobile-env.sh aarch64-linux-android)"
          cargo apk build --release -p concat-android 2>&1 | tee build.log

      - name: Build log to the summary (failure only)
        if: failure()
        run: |
          if [ -f engine/build.log ]; then
            {
              echo "### Build failed: Android arm64"
              echo '```'
              tail -n 150 engine/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Named by version and target, as the desktop bundles are; the
      # nightly stamps its commit into the same name.
      - name: Stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir stage
          cp engine/target/release/apk/Concat.apk "stage/Concat-$VERSION-android-arm64.apk"
          ls -l stage

      - uses: actions/upload-artifact@v7
        with:
          name: Concat-android-arm64
          path: stage/*
          if-no-files-found: error

  ios:
    name: iOS arm64
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' engine/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Concat $version for aarch64-apple-ios"
      # The engine pins its toolchain in rust-toolchain.toml, so the phone's
      # standard library is added to that toolchain from inside engine/,
      # where the pin applies.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-ios
        working-directory: engine

      - run: brew install cmake

      # Restored and saved as two steps rather than one, so the FFmpeg
      # build is kept the moment it finishes, whatever happens to the Rust
      # build after it.
      - name: FFmpeg for iOS (cached)
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: engine/vendor/ffmpeg/aarch64-apple-ios
          key: ffmpeg-aarch64-apple-ios-${{ hashFiles('engine/scripts/ffmpeg-mobile.sh') }}
      - name: FFmpeg for iOS
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: engine/scripts/ffmpeg-mobile.sh aarch64-apple-ios
      - name: FFmpeg for iOS (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: engine/vendor/ffmpeg/aarch64-apple-ios
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: sherpa-onnx for iOS
        run: engine/scripts/sherpa-mobile.sh aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          key: aarch64-apple-ios

      - name: Build
        working-directory: engine
        run: |
          set -o pipefail
          eval "$(scripts/mobile-env.sh aarch64-apple-ios)"
          cargo build --release -p concat --target aarch64-apple-ios 2>&1 | tee build.log

      - name: Build log to the summary (failure only)
        if: failure()
        run: |
          if [ -f engine/build.log ]; then
            {
              echo "### Build failed: iOS arm64"
              echo '```'
              tail -n 150 engine/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The bundle: binary, Info.plist and the sherpa-onnx framework, ad-hoc
      # signed. A developer's identity and provisioning profile go on with
      # codesign before it can be installed on a phone.
      - name: Bundle
        run: engine/scripts/ios-app.sh aarch64-apple-ios release

      # An .ipa is the bundle under Payload/ in a zip: the form every
      # sideloading tool and Xcode's Devices window take, re-signing it
      # with the tester's own identity on the way onto the phone. ditto
      # keeps the bundle's signature and resource forks where zip would
      # not.
      - name: Stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p stage payload/Payload
          cp -R engine/target/aarch64-apple-ios/release/Concat.app payload/Payload/
          (cd payload && ditto -c -k --keepParent Payload "../stage/Concat-$VERSION-ios-arm64.ipa")
          ls -l stage

      - uses: actions/upload-artifact@v7
        with:
          name: Concat-ios-arm64
          path: stage/*
          if-no-files-found: error
