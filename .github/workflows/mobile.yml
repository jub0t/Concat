name: Build for phones

# Builds Concat for Android and iOS and uploads one artifact per phone,
# named like the desktop bundles from build-app.yml:
#
#   Android  arm64  -> Concat-<version>-android-arm64.apk
#   iOS      arm64  -> Concat-<version>-ios-arm64.ipa
#
# Reusable, the way build-app.yml is: release.yml calls it on every tag,
# so a release carries the phones beside the desktops. Pull requests build
# here directly.
#
# Phones are cross-compiled - the Android job runs on Linux with the NDK,
# the iOS job on macOS with Xcode - and the two native libraries that
# cannot be fetched prebuilt for a phone are built from source here and
# cached: FFmpeg by src/scripts/ffmpeg-mobile.sh, with the platform's
# hardware codecs, and whisper.cpp by its crate. sherpa-onnx comes prebuilt
# from k2-fsa through src/scripts/sherpa-mobile.sh.
#
# src/scripts/mobile-env.sh is the one description of the build
# environment, here and on a developer's machine.
#
# The APK is built under a key made for the run, and a release (the `sign`
# input, which release.yml alone passes) signs it over again with the
# repository's key, ANDROID_KEYSTORE (the keystore, base64),
# ANDROID_KEYSTORE_PASSWORD, and optionally ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD, in a step of its own after the build: the key
# never sits in the environment of the build and the several hundred build
# scripts it runs, and a pull request's run never sees it at all. The .ipa
# is ad-hoc signed: a tester signs it with their own Apple ID on the way
# onto a phone (AltStore, Sideloadly, Xcode's Devices window all do this).
#
# No phone build passes unless it starts on a phone. The APK the Android
# job uploads, the very file a release ships, is installed on an emulator
# of Android 11 (API 30, where #312's preview failed) and of Android 15
# (API 35, the SDK the app targets) and started there
# (scripts/ci/smoke-android.sh). The APK is arm64 only, and the emulators
# are x86_64 ones on Linux with KVM, which run arm64 code through the ARM
# translation Google's x86_64 images carry from API 30 on: GitHub's arm64
# Macs cannot run the emulator at all (no nested virtualisation, so HVF
# fails with HV_UNSUPPORTED), and an x86_64 APK would be a different build
# from the one that ships. Under that translation ONNX Runtime's CPU
# detection crashes as the library loads, before any of the app's code
# runs; the smoke reports that one crash as "not tested" with a warning
# rather than failing (see smoke-android.sh), and a release's APK is then
# started on a real phone by hand. The iPhone is tested the same way through the
# iOS Simulator, which needs a build of its own for aarch64-apple-ios-sim,
# made beside the device build and never shipped
# (scripts/ci/smoke-ios.sh). release.yml waits on every job here, so a
# release with a phone that does not start is never published; what the
# smokes leave behind (logs, screenshots) is uploaded under smoke-*, a
# name the release does not pick up.
on:
  workflow_call:
    inputs:
      ref:
        description: The ref to build, when it is not the one this runs on
        type: string
        default: ""
      sign:
        description: Sign the APK with the repository's key; a release does, nothing else may
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE:
        description: Base64 of the release keystore
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        description: The key's alias in the keystore; the keystore's first alias when unset
        required: false
      ANDROID_KEY_PASSWORD:
        description: The key's own password; the keystore's when unset
        required: false
  pull_request:
  workflow_dispatch:

# Keyed by the calling workflow too, so a call from a release never shares
# a group with a pull request's run. Only a pull request's run is
# superseded by the next push to it; a release's, or one started by hand,
# runs to the end.
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # ggml compiles to the portable baseline for the architecture, NEON on
  # ARM, rather than to whatever the build machine has.
  GGML_NATIVE: "OFF"

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The ref release.yml names, which is its tag: without one a run
      # started by hand builds main and publishes it under the tag's name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Concat $version for aarch64-linux-android"
      # The toolchain src/rust-toolchain.toml pins, installed by name, with
      # the phone's standard library.
      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-linux-android
      - uses: taiki-e/cache-cargo-install-action@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v2.3.1
        with:
          tool: cargo-apk

      # The runner image carries the SDK and an NDK; the script finds the
      # newest NDK under the SDK on its own, and the build scripts of
      # whisper.cpp, Skia and Slint's backend each read it by their own
      # name from what mobile-env.sh exports.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      # Restored and saved as two steps rather than one, so the FFmpeg
      # build is kept the moment it finishes, whatever happens to the Rust
      # build after it.
      - name: FFmpeg for Android (cached)
        id: ffmpeg
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ffmpeg-aarch64-linux-android-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}
      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: src/scripts/ffmpeg-mobile.sh aarch64-linux-android
      - name: FFmpeg for Android (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: sherpa-onnx for Android
        run: src/scripts/sherpa-mobile.sh aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          key: aarch64-linux-android

      # A release APK has to be signed, and cargo-apk signs it as it builds,
      # so the build runs under a key made for the run. That key installs
      # on a phone as any sideloaded app does, and there is nothing worth
      # keeping in the environment the build scripts of several hundred
      # crates run in.
      - name: A key for the run
        run: |
          set -euo pipefail
          keystore=$RUNNER_TEMP/run.keystore
          keytool -genkeypair -v -keystore "$keystore" -storepass concat -keypass concat \
            -alias concat -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Concat, O=Concat" >/dev/null 2>&1
          echo "CARGO_APK_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=concat" >> "$GITHUB_ENV"

      # The build environment first, then the build under it.
      - name: Build the APK
        working-directory: src
        run: |
          set -o pipefail
          eval "$(scripts/mobile-env.sh aarch64-linux-android)"
          cargo apk build --release -p concat-android 2>&1 | tee build.log

      # A release's APK is signed over again with the repository's key, so
      # it installs over the build before it. Only a release asks (`sign`);
      # the key and its password reach this one step, the password through
      # the environment and never the command line, and the keystore is
      # removed once the signature is on. apksigner replaces the run's
      # signature rather than adding to it. A release with no key set keeps
      # the run's key and says so in the run's annotations.
      #
      # apksigner is told everything it would otherwise stop and ask for:
      # which key (ANDROID_KEY_ALIAS, or the keystore's first alias, which
      # keytool lists), and the key's password (ANDROID_KEY_PASSWORD, or
      # the keystore's, which is what a key made with the keystore has).
      # A prompt on a runner is a step that waits for its timeout.
      - name: Sign with the repository's key
        if: inputs.sign
        timeout-minutes: 10
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE is not set; the APK keeps the key made for this run"
            exit 0
          fi
          keystore=$RUNNER_TEMP/release.keystore
          echo "$KEYSTORE_B64" | base64 --decode > "$keystore"
          alias=$KEY_ALIAS
          if [ -z "$alias" ]; then
            alias=$(keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD 2>/dev/null \
              | awk -F, '/PrivateKeyEntry/ { print $1; exit }')
            if [ -z "$alias" ]; then
              rm -f "$keystore"
              echo "::error::the keystore holds no private key, or its password is wrong; set ANDROID_KEY_ALIAS"
              exit 1
            fi
            echo "ANDROID_KEY_ALIAS is not set; signing with the keystore's first key, $alias"
          fi
          sdk=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          tools=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apk=src/target/release/apk/Concat.apk
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$alias" --key-pass env:KEY_PASSWORD "$apk" < /dev/null
          rm -f "$keystore"
          "$tools/apksigner" verify --print-certs "$apk"

      - name: Build log to the summary (failure only)
        if: failure()
        run: |
          if [ -f src/build.log ]; then
            {
              echo "### Build failed: Android arm64"
              echo '```'
              tail -n 150 src/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Named by version and target, as the desktop bundles are.
      - name: Stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir stage
          cp src/target/release/apk/Concat.apk "stage/Concat-$VERSION-android-arm64.apk"
          ls -l stage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Concat-android-arm64
          path: stage/*
          if-no-files-found: error

  # The APK the job above uploaded, installed and started on an emulator;
  # see the top of this file for why an x86_64 one. A release's run tests
  # the APK signed with the repository's key, which is the one it ships.
  android-smoke:
    name: Android smoke (API ${{ matrix.api }})
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: scripts/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 10
        with:
          name: Concat-android-arm64
          path: apk

      # The emulator needs KVM, which the runner has but only root may
      # open until a udev rule says otherwise.
      - name: KVM for the emulator
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A Google APIs image, which has the ARM translation (the ATD images
      # leave it out), on a phone-sized screen with SwiftShader standing in
      # for the GPU. The emulator keeps its sound device, as a phone does:
      # the engine opens an audio stream as it starts. The SDK pieces the
      # action downloads are checked by sdkmanager against Google's own
      # repository digests, not through scripts/ci/deps.lock.
      - name: Start the APK on an emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: scripts/ci/smoke-android.sh --out smoke-android --wait 60 apk/Concat-*.apk

      # The log, the screenshot and the rest, pass or fail.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 10
        with:
          name: smoke-android-api${{ matrix.api }}
          path: smoke-android/
          if-no-files-found: warn

  ios:
    name: iOS arm64
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Concat $version for aarch64-apple-ios"
      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-apple-ios

      - run: brew install cmake

      # Restored and saved as two steps rather than one, so the FFmpeg
      # build is kept the moment it finishes, whatever happens to the Rust
      # build after it.
      - name: FFmpeg for iOS (cached)
        id: ffmpeg
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/vendor/ffmpeg/aarch64-apple-ios
          key: ffmpeg-aarch64-apple-ios-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}
      - name: FFmpeg for iOS
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: src/scripts/ffmpeg-mobile.sh aarch64-apple-ios
      - name: FFmpeg for iOS (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/vendor/ffmpeg/aarch64-apple-ios
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: sherpa-onnx for iOS
        run: src/scripts/sherpa-mobile.sh aarch64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src
          key: aarch64-apple-ios

      - name: Build
        working-directory: src
        run: |
          set -o pipefail
          eval "$(scripts/mobile-env.sh aarch64-apple-ios)"
          cargo build --release -p concat --target aarch64-apple-ios 2>&1 | tee build.log

      - name: Build log to the summary (failure only)
        if: failure()
        run: |
          if [ -f src/build.log ]; then
            {
              echo "### Build failed: iOS arm64"
              echo '```'
              tail -n 150 src/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The bundle: binary, Info.plist and the sherpa-onnx framework, ad-hoc
      # signed. A developer's identity and provisioning profile go on with
      # codesign before it can be installed on a phone.
      - name: Bundle
        run: src/scripts/ios-app.sh aarch64-apple-ios release

      # An .ipa is the bundle under Payload/ in a zip: the form every
      # sideloading tool and Xcode's Devices window take, re-signing it
      # with the tester's own identity on the way onto the phone. ditto
      # keeps the bundle's signature and resource forks where zip would
      # not.
      - name: Stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p stage payload/Payload
          cp -R src/target/aarch64-apple-ios/release/Concat.app payload/Payload/
          (cd payload && ditto -c -k --keepParent Payload "../stage/Concat-$VERSION-ios-arm64.ipa")
          ls -l stage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Concat-ios-arm64
          path: stage/*
          if-no-files-found: error

  # The iPhone build again, for the iOS Simulator on this Mac, bundled the
  # way the device build is and started there; it is never shipped. The
  # same FFmpeg and sherpa-onnx, for the simulator: ffmpeg-mobile.sh and
  # ios-app.sh take aarch64-apple-ios-sim, and the xcframework
  # sherpa-mobile.sh fetches for iOS carries a simulator slice beside the
  # device one. mobile-env.sh does not know the simulator yet, so the
  # build's environment is written out in the build step below.
  ios-simulator:
    name: iOS simulator smoke
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: The pinned toolchain
        id: toolchain
        timeout-minutes: 1
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master (v1), 2026-10-09
        timeout-minutes: 10
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-apple-ios-sim

      - run: brew install cmake
        timeout-minutes: 10

      - name: FFmpeg for the iOS Simulator (cached)
        id: ffmpeg
        timeout-minutes: 10
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/vendor/ffmpeg/aarch64-apple-ios-sim
          key: ffmpeg-aarch64-apple-ios-sim-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}
      - name: FFmpeg for the iOS Simulator
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: src/scripts/ffmpeg-mobile.sh aarch64-apple-ios-sim
      - name: FFmpeg for the iOS Simulator (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        timeout-minutes: 10
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src/vendor/ffmpeg/aarch64-apple-ios-sim
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      # The device's fetch, which brings the whole xcframework; the binary
      # links against the simulator's slice of it, under the name the
      # linker looks for, as mobile-env.sh does with the device's slice.
      - name: sherpa-onnx for the iOS Simulator
        timeout-minutes: 10
        run: |
          set -euo pipefail
          src/scripts/sherpa-mobile.sh aarch64-apple-ios
          framework=$(find src/vendor/sherpa-onnx/ios -maxdepth 2 -name '*.xcframework' | head -1)
          binary=$PWD/$framework/ios-arm64_x86_64-simulator/SherpaOnnxC.framework/SherpaOnnxC
          [ -f "$binary" ] || { echo "::error::no simulator slice in $framework"; exit 1; }
          mkdir -p src/vendor/sherpa-onnx/ios/lib-sim
          ln -sf "$binary" src/vendor/sherpa-onnx/ios/lib-sim/libsherpa-onnx-c-api.dylib

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 10
        with:
          workspaces: src
          key: aarch64-apple-ios-sim

      # What `scripts/mobile-env.sh aarch64-apple-ios` exports, for the
      # simulator: its FFmpeg, its slice of sherpa-onnx, and the same
      # oldest iOS. whisper.cpp's CMake build is told the simulator's SDK
      # outright (whisper-rs-sys hands it every CMAKE_ variable): left to
      # itself, CMake's iOS platform takes the device's.
      - name: Build
        working-directory: src
        timeout-minutes: 75
        run: |
          set -o pipefail
          export FFMPEG_DIR="$PWD/vendor/ffmpeg/aarch64-apple-ios-sim"
          export SHERPA_ONNX_LIB_DIR="$PWD/vendor/sherpa-onnx/ios/lib-sim"
          export IPHONEOS_DEPLOYMENT_TARGET=15.0
          export CMAKE_OSX_SYSROOT=iphonesimulator
          cargo build --release -p concat --target aarch64-apple-ios-sim 2>&1 | tee build.log

      - name: Build log to the summary (failure only)
        if: failure()
        timeout-minutes: 1
        run: |
          if [ -f src/build.log ]; then
            {
              echo "### Build failed: iOS Simulator"
              echo '```'
              tail -n 150 src/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bundle
        timeout-minutes: 5
        run: src/scripts/ios-app.sh aarch64-apple-ios-sim release

      # A fresh iPhone simulator: `--smoke` through the first publish, then
      # a launch as from the home screen, watched for a minute.
      - name: Start the app on a simulator
        timeout-minutes: 25
        run: scripts/ci/smoke-ios.sh --out smoke-ios --wait 60 src/target/aarch64-apple-ios-sim/release/Concat.app

      # The app's output, the system log, the screenshot and any crash
      # report, pass or fail.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 10
        with:
          name: smoke-ios-simulator
          path: smoke-ios/
          if-no-files-found: warn
