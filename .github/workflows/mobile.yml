name: Build for phones

# Builds Concat for Android and uploads the app, named like the desktop
# bundles from build-app.yml:
#
#   Android  arm64  -> Concat-<version>-android-arm64.apk
#
# Reusable, the way build-app.yml is: release.yml calls it on every tag,
# so a release carries the phone beside the desktops. Pull requests build
# here directly.
#
# The phone is cross-compiled - the Android job runs on Linux with the
# NDK - and the two native libraries that cannot be fetched prebuilt for a
# phone are built from source here and cached: FFmpeg by
# src/scripts/ffmpeg-mobile.sh, with the platform's
# hardware codecs, and whisper.cpp by its crate. ONNX Runtime comes from
# ort's own downloads, and on Android the C++ runtime it links (and the
# emulator's ONNX Runtime) from src/scripts/android-libs.sh.
#
# src/scripts/mobile-env.sh is the one description of the build
# environment, here and on a developer's machine.
#
# The APK is built under a key made for the run, and a release (the `sign`
# input, which release.yml alone passes) signs it over again with the
# repository's key, ANDROID_KEYSTORE (the keystore, base64),
# ANDROID_KEYSTORE_PASSWORD, and optionally ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD, in a step of its own after the build: the key
# never sits in the environment of the build and the several hundred build
# scripts it runs, and a pull request's run never sees it at all.
#
# No phone build passes unless it starts on a phone. The Android app is
# installed on an emulator of Android 11 (API 30, where #312's preview
# failed) and of Android 15 (API 35, the SDK the app targets) and started
# there (scripts/ci/smoke-android.sh). The emulators are x86_64 ones on
# Linux with KVM: GitHub's arm64 Macs cannot run the emulator at all (no
# nested virtualisation, so HVF fails with HV_UNSUPPORTED). The APK that
# ships is arm64 only, and under the ARM translation the x86_64 images
# carry, ONNX Runtime's CPU detection crashed as the library loaded,
# before any of the app's code, so it was never tested at all. So the
# Android job also builds the same source for x86_64, an APK that never
# leaves the run, and that is the one the emulators start natively.
# release.yml waits on every job here, so a release with a phone that
# does not start is never published; what the smokes leave behind (logs,
# screenshots) is uploaded under smoke-*, a name the release does not
# pick up.
on:
  workflow_call:
    inputs:
      ref:
        description: The ref to build, when it is not the one this runs on
        type: string
        default: ""
      sign:
        description: Sign the APK with the repository's key; a release does, nothing else may
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE:
        description: Base64 of the release keystore
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        description: The key's alias in the keystore; the keystore's first alias when unset
        required: false
      ANDROID_KEY_PASSWORD:
        description: The key's own password; the keystore's when unset
        required: false
  pull_request:
  # Every push to main, so main is known to build for phones; a push that
  # changes only words for people to read builds nothing.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/readme/**"
  workflow_dispatch:

# Keyed by the calling workflow too, so a call from a release never shares
# a group with a pull request's run. A pull request's run is superseded by
# the next push. A push's run is left to finish, so a busy day of pushes to
# main still ends with a finished phone build: GitHub keeps one waiting run
# per group and drops the older waiting ones, so at most two run in turn.
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # ggml compiles to the portable baseline for the architecture, NEON on
  # ARM, rather than to whatever the build machine has.
  GGML_NATIVE: "OFF"

jobs:
  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The app is android-native/: Kotlin and Jetpack Compose over the engine
    # (crates/concat-mobile) through UniFFI. Gradle's release APK, signed
    # with the debug key Gradle makes, then over again with the repository's
    # key on a release.
    env:
      APK: android-native/app/build/outputs/apk/release/app-release.apk
    # arm64 is the APK that ships. x86_64 is the same source built for CI's
    # emulators, which run x86_64 and could not start the arm64 one: the
    # launch check below installs it, and it never leaves the run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64
            android_abi: arm64-v8a
            ship: true
          - target: x86_64-linux-android
            abi: x86_64
            android_abi: x86_64
            ship: false
    steps:
      # The ref release.yml names, which is its tag: without one a run
      # started by hand builds main and publishes it under the tag's name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Concat $version for ${{ matrix.target }}"
      # The toolchain src/rust-toolchain.toml pins, installed by name, with
      # the phone's standard library.
      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (v1), 2026-10-09
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: cargo-ndk

      # The runner image carries the SDK and an NDK; the script finds the
      # newest NDK under the SDK on its own, and the build scripts of
      # whisper.cpp, Skia and Slint's backend each read it by their own
      # name from what mobile-env.sh exports.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      # Restored and saved as two steps rather than one, so the FFmpeg
      # build is kept the moment it finishes, whatever happens to the Rust
      # build after it.
      - name: FFmpeg for Android (cached)
        id: ffmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/vendor/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}
      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: src/scripts/ffmpeg-mobile.sh ${{ matrix.target }}
      - name: FFmpeg for Android (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/vendor/ffmpeg/${{ matrix.target }}
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: Android libraries
        run: src/scripts/android-libs.sh ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src
          key: ${{ matrix.target }}

      # Linking the engine in one codegen unit comes close to the runner's
      # memory at its peak; with line tables it went over, swap or not, and
      # the runner itself was killed mid-build (f22453d8 to 3a10dc47). The
      # swap file on the larger disk is the margin, without changing
      # anything that is built.
      - name: Room for the build's peak memory
        run: |
          set -euo pipefail
          avail_kb() { df --output=avail -k "$1" | tail -1; }
          dir=/
          if [ -d /mnt ] && [ "$(avail_kb /mnt)" -gt $((24 * 1024 * 1024)) ]; then dir=/mnt; fi
          sudo fallocate -l 12G "$dir/build.swap"
          sudo chmod 600 "$dir/build.swap"
          sudo mkswap "$dir/build.swap" >/dev/null
          sudo swapon "$dir/build.swap"
          free -h
          df -h / "$dir"

      # The engine and its Kotlin bindings (build-rust.sh), then the app. No
      # line tables in the engine: with them its link starved the runner off
      # mid-build on both targets, swap or not (f22453d8 to 3a10dc47), and
      # without them it never has. The library keeps its symbol table, and
      # is kept as an artifact below, so the frames of a phone's hang or
      # crash can be named by function from its offsets
      # (scripts/symbolize-android.sh). The x86_64 build alone is made with
      # `smoke`, which the emulators' export run drives (Smoke.kt); the one
      # that ships never is.
      - name: Java 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      # Gradle's downloads (its own distribution, the plugins and every
      # library) kept between runs. Without them each run asked Maven
      # Central for all of it again, and on a busy day Maven answered 429
      # (too many requests) and failed the build before any code of ours
      # was compiled.
      - name: Gradle's downloads (cached)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-native/**/*.gradle.kts', 'android-native/gradle/**', 'android-native/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build the APK
        run: |
          set -o pipefail
          {
            android-native/build-rust.sh release ${{ matrix.target }}
            cd android-native
            ./gradlew --no-daemon assembleRelease -Pabis=${{ matrix.android_abi }} ${{ !matrix.ship && '-Psmoke=true' || '' }}
          } 2>&1 | tee src/build.log
          ls -l "$APK"

      # A release's APK is signed over again with the repository's key, so
      # it installs over the build before it. Only a release asks (`sign`);
      # the key and its password reach this one step, the password through
      # the environment and never the command line, and the keystore is
      # removed once the signature is on. apksigner replaces the run's
      # signature rather than adding to it. A release with no key set keeps
      # the run's key and says so in the run's annotations.
      #
      # apksigner is told everything it would otherwise stop and ask for:
      # which key (ANDROID_KEY_ALIAS, or the keystore's first alias, which
      # keytool lists), and the key's password (ANDROID_KEY_PASSWORD, or
      # the keystore's, which is what a key made with the keystore has).
      # A prompt on a runner is a step that waits for its timeout.
      - name: Sign with the repository's key
        if: inputs.sign && matrix.ship
        timeout-minutes: 10
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE is not set; the APK keeps the key made for this run"
            exit 0
          fi
          keystore=$RUNNER_TEMP/release.keystore
          echo "$KEYSTORE_B64" | base64 --decode > "$keystore"
          alias=$KEY_ALIAS
          if [ -z "$alias" ]; then
            alias=$(keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD 2>/dev/null \
              | awk -F, '/PrivateKeyEntry/ { print $1; exit }')
            if [ -z "$alias" ]; then
              rm -f "$keystore"
              echo "::error::the keystore holds no private key, or its password is wrong; set ANDROID_KEY_ALIAS"
              exit 1
            fi
            echo "ANDROID_KEY_ALIAS is not set; signing with the keystore's first key, $alias"
          fi
          sdk=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          tools=$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apk=$APK
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$alias" --key-pass env:KEY_PASSWORD "$apk" < /dev/null
          rm -f "$keystore"
          "$tools/apksigner" verify --print-certs "$apk"

      # The engine's library as the linker made it, with its symbol table:
      # what a trace's offsets are looked up in, by the BuildId the trace
      # names, which the APK's copy shares. The APK's own copy is checked
      # for having no debug sections, so they never make the download
      # larger. Not "Concat-*", so a release never publishes it.
      - name: Keep the engine's symbols
        if: matrix.ship
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          eval "$(src/scripts/mobile-env.sh "$TARGET")"
          readelf=$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -path '*/bin/llvm-readelf' | head -1)
          built=src/target/$TARGET/release/libconcat_mobile.so
          packed=$RUNNER_TEMP/packed-libconcat_mobile.so
          unzip -p "$APK" 'lib/${{ matrix.android_abi }}/libconcat_mobile.so' > "$packed"
          if "$readelf" -S --wide "$packed" | grep -q '\.debug_'; then
            echo "::error::the APK's libconcat_mobile.so carries debug sections; it would ship larger"
            exit 1
          fi
          if ! "$readelf" -S --wide "$built" | grep -q '\.symtab'; then
            echo "::error::the engine was linked without a symbol table; its frames could not be named"
            exit 1
          fi
          id_of() { "$readelf" -n "$1" | sed -n 's/.*Build ID: *\([0-9a-fA-F]*\).*/\1/p' | head -1; }
          if [ -z "$(id_of "$built")" ]; then
            echo "::error::the engine has no build ID; no trace could be matched to its symbols"
            exit 1
          fi
          if [ "$(id_of "$built")" != "$(id_of "$packed")" ]; then
            echo "::error::the kept library and the APK's are not the same build"
            exit 1
          fi
          mkdir symbols
          cp "$built" "symbols/libconcat_mobile-$VERSION-$TARGET.so"
          echo "BuildId $(id_of "$built")"
          ls -l symbols "$packed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.ship
        with:
          name: symbols-concat-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: symbols/*
          retention-days: 90
          if-no-files-found: error

      # A phone with 16 KB pages loads none of a library aligned to less,
      # and the build would not say so.
      - name: Every library is aligned for 16 KB pages
        if: matrix.ship
        run: python3 scripts/ci/check-16k-pages.py "$APK"

      - name: Build log to the summary (failure only)
        if: failure()
        run: |
          python3 scripts/ci/annotate.py src/build.log || true
          if [ -f src/build.log ]; then
            {
              echo "### Build failed: Android ${{ matrix.abi }}"
              echo '```'
              tail -n 150 src/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Named by version and target, as the desktop bundles are.
      - name: Stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir stage
          cp "$APK" "stage/Concat-$VERSION-android-${{ matrix.abi }}.apk"
          ls -l stage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Concat-* is what a release publishes; the emulator's APK is
          # named so it never is.
          name: ${{ matrix.ship && 'Concat-android-arm64' || 'smoke-apk-android-x86_64' }}
          path: stage/*
          if-no-files-found: error

      # The engine's library and Kotlin bindings, so the app can be worked
      # on with Gradle alone on a machine too slow to build the engine for
      # a phone (android-native/README.md). Not "Concat-*": never published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.ship
        with:
          name: concat-native-android-arm64
          path: |
            android-native/app/src/main/jniLibs/arm64-v8a/*.so
            android-native/app/src/main/java/uniffi/**
          if-no-files-found: error

  # The x86_64 APK the job above built from the same source, installed and
  # started on an emulator, which runs it natively: the arm64 one that
  # ships ran there only through ARM translation, where ONNX Runtime's CPU
  # detection crashed before any of the app's code, so it was never
  # tested at all.
  android-smoke:
    name: Android smoke (API ${{ matrix.api }})
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            scripts/ci
            src/crates/concat-media/fixtures
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 10
        with:
          name: smoke-apk-android-x86_64
          path: apk

      # The emulator needs KVM, which the runner has but only root may
      # open until a udev rule says otherwise.
      - name: KVM for the emulator
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A Google APIs image, which has the ARM translation (the ATD images
      # leave it out), on a phone-sized screen with SwiftShader standing in
      # for the GPU. The emulator keeps its sound device, as a phone does:
      # the engine opens an audio stream as it starts. The SDK pieces the
      # action downloads are checked by sdkmanager against Google's own
      # repository digests, not through scripts/ci/deps.lock.
      #
      # Then an export, of a two-second clip made a project of, with keys
      # pressed all through it: 0.2.10 and 0.2.11 froze the window on every
      # phone the moment an export started (#747), and a launch alone never
      # gets that far. The line runs only once the first has passed.
      - name: Start the APK on an emulator, and export on it
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 6G
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            scripts/ci/smoke-android.sh --out smoke-android --wait 60 apk/Concat-*.apk
            scripts/ci/smoke-android.sh --out smoke-android/export --no-install --export src/crates/concat-media/fixtures/picture-starts-late.mov apk/Concat-*.apk

      # The log, the screenshot and the rest, pass or fail.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 10
        with:
          name: smoke-android-api${{ matrix.api }}
          path: smoke-android/
          if-no-files-found: warn
