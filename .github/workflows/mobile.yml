name: Build for phones

# Builds Concat for Android and iOS and uploads one artifact per phone,
# named like the desktop bundles from build-app.yml:
#
#   Android  arm64  -> Concat-<version>-android-arm64.apk
#   iOS      arm64  -> Concat-<version>-ios-arm64.ipa
#
# Reusable, the way build-app.yml is: release.yml calls it on every tag,
# so a release carries the phones beside the desktops. Pull requests build
# here directly.
#
# Phones are cross-compiled - the Android job runs on Linux with the NDK,
# the iOS job on macOS with Xcode - and the two native libraries that
# cannot be fetched prebuilt for a phone are built from source here and
# cached: FFmpeg by src/scripts/ffmpeg-mobile.sh, with the platform's
# hardware codecs, and whisper.cpp by its crate. sherpa-onnx comes prebuilt
# from k2-fsa through src/scripts/sherpa-mobile.sh.
#
# src/scripts/mobile-env.sh is the one description of the build
# environment, here and on a developer's machine.
#
# The APK is built under a key made for the run, and a release (the `sign`
# input, which release.yml alone passes) signs it over again with the
# repository's key, ANDROID_KEYSTORE (the keystore, base64) and
# ANDROID_KEYSTORE_PASSWORD, in a step of its own after the build: the key
# never sits in the environment of the build and the several hundred build
# scripts it runs, and a pull request's run never sees it at all. The .ipa
# is ad-hoc signed: a tester signs it with their own Apple ID on the way
# onto a phone (AltStore, Sideloadly, Xcode's Devices window all do this).
on:
  workflow_call:
    inputs:
      ref:
        description: The ref to build, when it is not the one this runs on
        type: string
        default: ""
      sign:
        description: Sign the APK with the repository's key; a release does, nothing else may
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE:
        description: Base64 of the release keystore
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
  pull_request:
  workflow_dispatch:

# Keyed by the calling workflow too, so a call from a release never shares
# a group with a pull request's run. A tag's release is never cancelled;
# everything else is superseded by the next push.
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # ggml compiles to the portable baseline for the architecture, NEON on
  # ARM, rather than to whatever the build machine has.
  GGML_NATIVE: "OFF"

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The ref release.yml names, which is its tag: without one a run
      # started by hand builds main and publishes it under the tag's name.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Concat $version for aarch64-linux-android"
      # The toolchain src/rust-toolchain.toml pins, installed by name, with
      # the phone's standard library.
      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-linux-android
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-apk

      # The runner image carries the SDK and an NDK; the script finds the
      # newest NDK under the SDK on its own, and the build scripts of
      # whisper.cpp, Skia and Slint's backend each read it by their own
      # name from what mobile-env.sh exports.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      # Restored and saved as two steps rather than one, so the FFmpeg
      # build is kept the moment it finishes, whatever happens to the Rust
      # build after it.
      - name: FFmpeg for Android (cached)
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ffmpeg-aarch64-linux-android-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}
      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: src/scripts/ffmpeg-mobile.sh aarch64-linux-android
      - name: FFmpeg for Android (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: sherpa-onnx for Android
        run: src/scripts/sherpa-mobile.sh aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: aarch64-linux-android

      # A release APK has to be signed, and cargo-apk signs it as it builds,
      # so the build runs under a key made for the run. That key installs
      # on a phone as any sideloaded app does, and there is nothing worth
      # keeping in the environment the build scripts of several hundred
      # crates run in.
      - name: A key for the run
        run: |
          set -euo pipefail
          keystore=$RUNNER_TEMP/run.keystore
          keytool -genkeypair -v -keystore "$keystore" -storepass concat -keypass concat \
            -alias concat -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Concat, O=Concat" >/dev/null 2>&1
          echo "CARGO_APK_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=concat" >> "$GITHUB_ENV"

      # The build environment first, then the build under it.
      - name: Build the APK
        working-directory: src
        run: |
          set -o pipefail
          eval "$(scripts/mobile-env.sh aarch64-linux-android)"
          cargo apk build --release -p concat-android 2>&1 | tee build.log

      # A release's APK is signed over again with the repository's key, so
      # it installs over the build before it. Only a release asks (`sign`);
      # the key and its password reach this one step, the password through
      # the environment and never the command line, and the keystore is
      # removed once the signature is on. apksigner replaces the run's
      # signature rather than adding to it. A release with no key set keeps
      # the run's key and says so in the run's annotations.
      - name: Sign with the repository's key
        if: inputs.sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE is not set; the APK keeps the key made for this run"
            exit 0
          fi
          keystore=$RUNNER_TEMP/release.keystore
          echo "$KEYSTORE_B64" | base64 --decode > "$keystore"
          sdk=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          tools=$(ls -d "$sdk"/build-tools/*/ | sort -V | tail -1)
          apk=src/target/release/apk/Concat.apk
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD "$apk"
          rm -f "$keystore"
          "$tools/apksigner" verify --print-certs "$apk"

      - name: Build log to the summary (failure only)
        if: failure()
        run: |
          if [ -f src/build.log ]; then
            {
              echo "### Build failed: Android arm64"
              echo '```'
              tail -n 150 src/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Named by version and target, as the desktop bundles are.
      - name: Stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir stage
          cp src/target/release/apk/Concat.apk "stage/Concat-$VERSION-android-arm64.apk"
          ls -l stage

      - uses: actions/upload-artifact@v7
        with:
          name: Concat-android-arm64
          path: stage/*
          if-no-files-found: error

  ios:
    name: iOS arm64
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Concat $version for aarch64-apple-ios"
      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-apple-ios

      - run: brew install cmake

      # Restored and saved as two steps rather than one, so the FFmpeg
      # build is kept the moment it finishes, whatever happens to the Rust
      # build after it.
      - name: FFmpeg for iOS (cached)
        id: ffmpeg
        uses: actions/cache/restore@v4
        with:
          path: src/vendor/ffmpeg/aarch64-apple-ios
          key: ffmpeg-aarch64-apple-ios-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}
      - name: FFmpeg for iOS
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: src/scripts/ffmpeg-mobile.sh aarch64-apple-ios
      - name: FFmpeg for iOS (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/vendor/ffmpeg/aarch64-apple-ios
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: sherpa-onnx for iOS
        run: src/scripts/sherpa-mobile.sh aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: aarch64-apple-ios

      - name: Build
        working-directory: src
        run: |
          set -o pipefail
          eval "$(scripts/mobile-env.sh aarch64-apple-ios)"
          cargo build --release -p concat --target aarch64-apple-ios 2>&1 | tee build.log

      - name: Build log to the summary (failure only)
        if: failure()
        run: |
          if [ -f src/build.log ]; then
            {
              echo "### Build failed: iOS arm64"
              echo '```'
              tail -n 150 src/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The bundle: binary, Info.plist and the sherpa-onnx framework, ad-hoc
      # signed. A developer's identity and provisioning profile go on with
      # codesign before it can be installed on a phone.
      - name: Bundle
        run: src/scripts/ios-app.sh aarch64-apple-ios release

      # An .ipa is the bundle under Payload/ in a zip: the form every
      # sideloading tool and Xcode's Devices window take, re-signing it
      # with the tester's own identity on the way onto the phone. ditto
      # keeps the bundle's signature and resource forks where zip would
      # not.
      - name: Stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p stage payload/Payload
          cp -R src/target/aarch64-apple-ios/release/Concat.app payload/Payload/
          (cd payload && ditto -c -k --keepParent Payload "../stage/Concat-$VERSION-ios-arm64.ipa")
          ls -l stage

      - uses: actions/upload-artifact@v7
        with:
          name: Concat-ios-arm64
          path: stage/*
          if-no-files-found: error
