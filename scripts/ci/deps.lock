# The prebuilt dependencies CI downloads, each pinned to one file and the
# sha256 of its bytes. scripts/ci/fetch.sh is the only thing that reads
# this, and it refuses a file whose digest is not the one written here.
#
#   name  url  sha256
#
# To bump one: change the URL, run `scripts/ci/fetch.sh NAME /tmp/x`, and
# put the digest it reports in place of the old one. Where a version is
# also named elsewhere, change it there too; the comment above each group
# says where.

